const isExcludedSpend=(t)=>{const ex=getSpendExclude();if(!ex.length)return false;const m=((t.merchant||"")+" "+(t.category||"")).toLowerCase();return ex.some(kw=>kw&&m.includes(kw.toLowerCase()));};

// 가맹점명으로 카테고리 자동 추론
function autoClassify(merchant){
  if(!merchant)return null;
  const m=merchant.trim();
  const rules=allRules();
  // 키워드 길이 긴 순으로 매칭 (더 구체적인 규칙 우선)
  const keys=Object.keys(rules).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    if(m.includes(k)||k.includes(m.split("(")[0].split("*")[0].trim())){
      return rules[k];
    }
  }
  return null;
}

async function imgToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({b64:r.result.split(",")[1],mime:file.type||"image/jpeg"});
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function claudeVisionMulti(files,prompt){
  const key=getApiKey();

  const imgs=[];
  for(const f of files){const{b64,mime}=await imgToB64(f);imgs.push({type:"image",source:{type:"base64",media_type:mime,data:b64}});}
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:4000,messages:[{role:"user",content:[...imgs,{type:"text",text:prompt}]}]})

async function fetchFxRate(){
  // 환율 전용 무료 API (CORS 허용, 키 불필요)
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const d=await r.json();
    const krw=d?.rates?.KRW;
    if(krw)return{price:krw,currency:"KRW",name:"USD/KRW",ticker:"USDKRW=X"};
  }catch{}

}
async function fetchPrice(ticker){
  if(ticker==="USDKRW=X")return await fetchFxRate();
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`,{mode:"cors"});
    const d=await r.json();
    const m=d.chart?.result?.[0]?.meta;
    if(!m)return null;
    return{price:m.regularMarketPrice,currency:m.currency,name:m.shortName||ticker,ticker};
  }catch{return null;}
}

const wonKor=n=>{n=Math.round(Number(n)||0);if(n<=0)return"";let s="",r=n;for(const[u,l]of[[100000000,"억"],[10000,"만"]]){const q=Math.floor(r/u);if(q){s+=q.toLocaleString("ko-KR")+l+" ";r%=u;}}if(r||!s)s+=r.toLocaleString("ko-KR");return s.trim()+"원";}; // 1234567 → "123만 4,567원" (금액 입력 실수 방지용)
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); // 로컬(KST) 기준 YYYY-MM-DD — toISOString은 UTC라 새벽에 하루 어긋남

const shYm=(y,d)=>{const[a,m]=y.split("-").map(Number);const dt=new Date(a,m-1+d,1);return`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}`};
const mRange=y=>{const[a,m]=y.split("-").map(Number);return[`${y}-01`,`${y}-${String(new Date(a,m,0).getDate()).padStart(2,"0")}`]};
const kindOf=t=>["소비(일시불)","소비(할부)"].includes(t)?"spend":["정산환급","환불/취소"].includes(t)?"reduce":t==="수입"?"income":["저축/적금","투자"].includes(t)?"save":"flow";
// 계좌 간 이체 판별: 내 통장↔공용통장 이동은 수입/지출 아님
const TRANSFER_RE=/생활비\s*입금|월세\s*입금|계좌\s*이체|통장\s*이체|이체\s*입금|공용\s*입금|본인\s*입금/i;
const PAY_CHARGE_RE=/(카카오페이|네이버페이|토스페이|페이코|삼성페이|쿠페이|스마일페이|엘페이|위비페이)\s*충전|(카카오|네이버|토스)\s*머니\s*충전|머니\s*충전|(사랑상품권|사랑카드|지역화폐|제로페이|온누리|상품권|기프트카드|교통카드)\s*충전|(천안사랑|지역화폐|제로페이|온누리)\s*충전|충전\s*(사랑카드|지역화폐|상품권)/i;
function isInternalTransfer(t){
  if(!t)return false;
  const m=(t.merchant||"")+" "+(t.memo||"");
  // 수동 지정: 메모에 #이체 태그
  if(/#이체/.test(t.memo||""))return true;
  // 카드대금 = 이미 기록된 소비를 정산(빚 갚기) → 이중계상 방지 위해 이체 취급
  if(t.type==="카드대금")return true;
  // 공용입금 타입 = 내 계좌 간 이동
  if(t.type==="공용입금")return true;
  // 수입인데 이체성 키워드 (내 통장으로 들어오는 이동)
  if(t.type==="수입"&&TRANSFER_RE.test(m))return true;
  // 페이/머니 충전 = 내 자산 안에서 이동 (단, '충전소'는 위 정규식이 안 잡음)
  if(PAY_CHARGE_RE.test(m))return true;
  return false;
}

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(p)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{if(k==null||k===false)return;e.append(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);});
  return e;
}

// ── 📸 자동 시세 갱신 + 오늘 기록: 12시간마다 1번, 앱 열 때 알아서 ──
const KNOWN_TICKERS={"스페이스x":"SPCX","spacex":"SPCX"};
async function autoSnapshot(){
  try{
    if(!S.session)return;
    const last=Number(localStorage.getItem("autosnap_ts")||0);
    if(Date.now()-last<12*60*60*1000)return; // 12시간 가드 → 하루 최대 2회
    const{data:hd}=await sb.from("investment_holdings").select("*").order("snapshot_date",{ascending:false});
    const holds=hd||[];if(!holds.length)return;
    const latestDate=holds[0].snapshot_date;
    const latest=holds.filter(x=>x.snapshot_date===latestDate);
    // 심볼 없는 종목 자동 매핑 (예: 스페이스X → SPCX)
    for(const x of latest){
      if(!x.ticker){
        const key=(x.name||"").toLowerCase().replace(/\s/g,"");
        const tk=KNOWN_TICKERS[key];
        if(tk){x.ticker=tk;try{await sb.from("investment_holdings").update({ticker:tk}).eq("id",x.id);dlog("[티커 자동매핑]",x.name,"→",tk);}catch{}}
      }
    }
    let fx=Number(latest[0]?.fx_rate)||1380;
    try{const fxr=await fetchFxRate();if(fxr?.price)fx=fxr.price;}catch{}
    const syms=[...new Set(latest.map(x=>x.ticker).filter(Boolean))];
    let quotes={};try{quotes=syms.length?await fetchQuotes(syms):{};}catch{}
    let updated=0;
    for(const x of latest){
      const qty=Number(x.quantity)||0;
      const q=x.ticker&&quotes[x.ticker];
      if(q&&q.price!=null&&qty){
        let px=Number(q.price);
        if(q.currency!=="KRW"){const avgP=Number(x.avg_price)||0;if(px>10000||(avgP>0&&px>avgP*20&&px>1000)){dlog("[자동갱신:원화가격 교정]",x.ticker,px);px=px/fx;}}
        const usd=q.currency==="KRW"?null:Math.round(px*qty*100)/100;
        const krw=q.currency==="KRW"?Math.round(px*qty):Math.round(px*qty*fx);
        await sb.from("investment_holdings").update({eval_value_krw:krw,eval_value_usd:usd??x.eval_value_usd,fx_rate:fx,day_change_pct:q.changePct??null}).eq("id",x.id);
        updated++;
      }else if(usdLooksKrw(x)){
        await sb.from("investment_holdings").update({eval_value_krw:Math.round(Number(x.eval_value_usd)),eval_value_usd:Math.round(Number(x.eval_value_usd)/fx*100)/100,fx_rate:fx}).eq("id",x.id);
      }
    }
    // 오늘 스냅샷 upsert (종목 합계 기준)
    const{data:fresh}=await sb.from("investment_holdings").select("eval_value_krw,eval_value_usd,quantity,avg_price,fx_rate,day_change_pct").eq("snapshot_date",latestDate);
    let sum=0;(fresh||[]).forEach(x=>{sum+=safeEvalKrw(x);});
    if(sum<=0)return;
    const{data:snaps}=await sb.from("investment_snapshots").select("*").eq("user_id",S.session.user.id).order("snapshot_date",{ascending:false}).limit(1);
    const base=snaps&&snaps[0];
    const cash=base?Number(base.cash_krw)||0:0;
    const inv=base&&base.total_invested_krw!=null?Number(base.total_invested_krw):null;
    const total=Math.round(sum+cash);
    const row={user_id:S.session.user.id,snapshot_date:td(),total_value_krw:total,cash_krw:cash,exchange_rate:Math.round(fx*100)/100};
    if(inv!=null){row.total_invested_krw=inv;row.total_pl_krw=Math.round(total-inv);if(inv>0)row.return_rate_krw=Math.round((total-inv)/inv*10000)/100;}
    await sb.from("investment_snapshots").upsert(row,{onConflict:"user_id,snapshot_date"});
    localStorage.setItem("autosnap_ts",String(Date.now()));
    S.allSnaps=null;
    if(S.tab==="invest"){await loadInvest();await loadAllSnapshots(true);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildInvest().forEach(n=>ct.append(n));}}
    if(typeof toast==="function")toast(updated?`📸 시세 ${updated}개 자동 갱신 + 오늘 기록했어요`:"📸 오늘 투자현황을 자동 기록했어요");
  }catch(e){try{dlog("[autoSnapshot]",e);}catch{}}
}

// ── STATS ──
function calcStatsFor(txns){
  let pS=0,pR=0,cS=0,cR=0,inc=0,sav=0;
  for(const t of txns){
    if(isExcludedSpend(t))continue;
    if(isInternalTransfer(t))continue; // 계좌 간 이체는 수입·지출 아님
    const k=kindOf(t.type),a=Number(t.amount)||0;
    // 공용 우선: account가 공용이거나, 공용통장/공용카드로 결제했으면 공용으로 집계
    const isShared=t.account==="공용"||t.payment_method==="공용통장"||t.payment_method==="공용카드"||t.payment_method==="공용통장 자동출금"||t.payment_method==="공용통장 지로출금";
    if(isShared){if(k==="spend")cS+=a;else if(k==="reduce")cR+=a;}
    else{if(k==="spend")pS+=a;else if(k==="reduce")pR+=a;}
    if(k==="income"&&!isShared)inc+=a; // 공용통장 입금(생활비 등)은 내 수입 아님
    if(k==="save")sav+=a;
  }
  return{pNet:pS-pR,cNet:cS-cR,income:inc,save:sav,balance:inc-(pS-pR)-(cS-cR)-sav};
}

// ── ⏪ 실행 취소 (되돌리기 스택) ──
// kind:"delete" → rows(전체 행)를 다시 insert / kind:"update" → rows[{id,before:{...}}]를 되돌림
const getUndoStack=()=>{try{return JSON.parse(localStorage.getItem("undo_stack")||"[]");}catch{return[];}};
const setUndoStack=(a)=>{try{localStorage.setItem("undo_stack",JSON.stringify(a.slice(0,15)));}catch{}};
function pushUndo(label,rows,kind){
  if(!rows||!rows.length)return null;
  const e={id:"u"+Date.now()+Math.random().toString(36).slice(2,6),label,kind:kind||"delete",rows,at:new Date().toISOString()};
  const st=getUndoStack();st.unshift(e);setUndoStack(st);
  return e;
}
async function runUndo(e){
  if(!e)return{ok:false,msg:"되돌릴 작업이 없어요"};
  try{
    if(e.kind==="delete"){
      const rows=e.rows.map(r=>{const c={...r};delete c.created_at;delete c.updated_at;return c;});
      const{error}=await sb.from("transactions").insert(rows);
      if(error)throw error;
    }else{
      for(const r of e.rows){
        const{error}=await sb.from("transactions").update(r.before).eq("id",r.id);
        if(error)throw error;
      }
    }
    setUndoStack(getUndoStack().filter(x=>x.id!==e.id));
    return{ok:true,msg:`⏪ 되돌렸어요 — ${e.label}`};
  }catch(err){return{ok:false,msg:"되돌리기 실패: "+(err.message||err)};}
}

function shareEventText(tag,list,n){

  const tot=list.reduce((s,t)=>s+(Number(t.amount)||0),0);

  const dates=list.map(t=>t.date).filter(Boolean).sort();
  const lines=[`🏷️ #${tag} 정산`,"",
    `📅 ${dates[0]||""} ~ ${dates[dates.length-1]||""} · ${list.length}건`,
    `💰 총 ${W(tot)}`,""];
  list.slice(0,12).forEach(t=>lines.push(`• ${(t.date||"").slice(5)} ${t.merchant||t.category||""} ${W(t.amount)}`));
  if(list.length>12)lines.push(`• … 외 ${list.length-12}건`);
  lines.push("","━━━━━━━━━━",`👥 ${n}명이 나눠요`,`1인당 ${W(per)}`,"",

  const text=lines.join("\n");
  if(navigator.share){navigator.share({title:`#${tag} 정산`,text}).catch(e=>{if(e&&e.name!=="AbortError")copyText(text);});}
  else copyText(text);
}

      const c=CM[t.category]||CM["기타"];
      x.fillStyle="#28251F";x.font="600 12px sans-serif";
      const nm=`${(t.date||"").slice(5)} ${c.i} ${(t.merchant||t.category||"").slice(0,14)}`;
      x.fillText(nm,34,yy);
      x.textAlign="right";x.font="700 12px sans-serif";x.fillText(W(t.amount),CW-34,yy);x.textAlign="left";
      yy+=26;
    });
    if(list.length>show.length){x.fillStyle="#B7B0A4";x.font="600 11px sans-serif";x.fillText(`… 외 ${list.length-show.length}건`,34,yy);yy+=24;}
    yy+=6;
    x.fillStyle="#EEF6F1";x.beginPath();x.roundRect(30,yy,CW-60,74,14);x.fill();
    x.fillStyle="#1E6E52";x.font="700 12px sans-serif";x.fillText(`👥 ${n}명이 나눠요`,46,yy+14);
    x.font="800 24px sans-serif";x.fillText(`1인당 ${W(per)}`,46,yy+34);
    x.fillStyle="#B7B0A4";x.font="600 10px sans-serif";x.fillText("🐾 나의 가계부",34,CH-34);
    const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
    const file=new File([blob],`${tag}_정산.png`,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:`#${tag} 정산`});return;}catch(e){if(e&&e.name==="AbortError")return;}
    }
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=file.name;a.click();URL.revokeObjectURL(url);
    toast("🖼️ 정산 이미지를 저장했어요");

}
// ── ✂️ 거래 분할: 한 번 결제한 걸 여러 카테고리·계정으로 나누기 (예: 코스트코에서 공용+개인 같이 산 경우) ──
function showSplitTxn(t,onDone){
  const total=Number(t.amount)||0;
  let parts=[{amount:Math.round(total/2),category:t.category||"기타",account:t.account||"개인"},
             {amount:total-Math.round(total/2),category:t.category||"기타",account:t.account==="공용"?"개인":"공용"}];
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"75"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"480px",background:C.w,borderRadius:"20px",padding:"18px 20px 24px",maxHeight:"88vh",overflowY:"auto"}});
  const listEl=h("div",{});
  const sumEl=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 12px",borderRadius:"11px",marginTop:"10px",fontSize:"12.5px",fontWeight:"800"}});
  const saveBtn=h("button",{style:{width:"100%",marginTop:"12px",background:C.brand,color:"#fff",fontSize:"14.5px",fontWeight:"800",padding:"13px",borderRadius:"12px",border:"none",cursor:"pointer"}},"✂️ 나누기 저장");
  const refresh=()=>{
    const sum=parts.reduce((s,p)=>s+(Number(p.amount)||0),0);
    const diff=total-sum,ok=diff===0;
    sumEl.style.background=ok?C.soft:"#FEF2EE";
    sumEl.innerHTML="";
    sumEl.append(h("span",{style:{color:ok?C.brand:C.over}},ok?"✅ 금액이 딱 맞아요":`⚠️ ${diff>0?"부족":"초과"} ${W(Math.abs(diff))}`),
      h("span",{class:"num",style:{color:ok?C.brand:C.over}},`${W(sum)} / ${W(total)}`));
    saveBtn.disabled=!ok||parts.length<2;
    saveBtn.style.opacity=(!ok||parts.length<2)?".45":"1";
    saveBtn.style.cursor=(!ok||parts.length<2)?"not-allowed":"pointer";
  };
  const draw=()=>{
    listEl.innerHTML="";
    parts.forEach((p,i)=>{
      const amtEl=h("input",{type:"number",inputmode:"numeric",value:p.amount,class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"9px",padding:"9px 10px",fontSize:"13.5px",fontWeight:"700"}});
      amtEl.oninput=()=>{parts[i].amount=Math.max(0,Math.round(Number(amtEl.value)||0));refresh();};
      const catSel=h("select",{style:{flex:"1",minWidth:"0",border:`1px solid ${C.line}`,borderRadius:"9px",padding:"9px 8px",fontSize:"12.5px",background:C.w}});
      CATS.forEach(c=>{const o=h("option",{value:c.n},c.i+" "+c.n);if(c.n===p.category)o.selected=true;catSel.append(o);});
      catSel.onchange=()=>{parts[i].category=catSel.value;};
      const accSel=h("select",{style:{width:"78px",flexShrink:"0",border:`1px solid ${C.line}`,borderRadius:"9px",padding:"9px 6px",fontSize:"12.5px",background:C.w}});
      ["개인","공용"].forEach(a=>{const o=h("option",{value:a},a);if(a===p.account)o.selected=true;accSel.append(o);});
      accSel.onchange=()=>{parts[i].account=accSel.value;};
      const rmBtn=parts.length>2?h("button",{style:{flexShrink:"0",fontSize:"14px",color:C.faint,background:"transparent",border:"none",cursor:"pointer",padding:"4px 2px"},onclick:()=>{parts.splice(i,1);draw();refresh();}},"✕"):"";
      listEl.append(h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"10px 11px",marginBottom:"8px"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},
          h("span",{style:{fontSize:"11px",fontWeight:"800",color:C.sub}},`${i+1}번째 조각`),rmBtn),
        amtEl,
        h("div",{style:{display:"flex",gap:"6px",marginTop:"6px"}},catSel,accSel)));
    });
  };
  sh.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},
    h("span",{style:{fontSize:"16px",fontWeight:"800"}},"✂️ 거래 나누기"),
    h("button",{style:{fontSize:"20px",color:C.sub,background:"transparent",border:"none",cursor:"pointer"},onclick:()=>ov.remove()},"✕")));
  sh.append(h("div",{style:{fontSize:"11.5px",color:C.sub,lineHeight:"1.6",marginBottom:"12px"}},
    `${t.merchant||t.category||"이 거래"} ${W(total)} 를 나눠요. 한 번 결제했지만 공용·개인이 섞였거나 카테고리가 여러 개일 때 써요.`));
  sh.append(listEl);
  sh.append(h("button",{style:{width:"100%",fontSize:"12.5px",fontWeight:"700",color:C.brand,background:C.w,border:`1px dashed ${C.brand}`,borderRadius:"10px",padding:"10px",cursor:"pointer"},onclick:()=>{
    const used=parts.reduce((s,p)=>s+(Number(p.amount)||0),0);
    parts.push({amount:Math.max(0,total-used),category:t.category||"기타",account:t.account||"개인"});draw();refresh();
  }},"＋ 조각 추가"));
  sh.append(sumEl,saveBtn);
  saveBtn.onclick=async()=>{
    saveBtn.disabled=true;saveBtn.textContent="저장 중…";
    try{
      const base={date:t.date,type:t.type,merchant:t.merchant,payment_method:t.payment_method,user_id:S.session.user.id};
      const tag=" #분할";
      const memoBase=(t.memo||"").replace(/\s*#분할/g,"").trim();
      // 1) 첫 조각 = 원 거래 수정 (되돌리기 위해 이전 값 보관)
      const before={id:t.id,before:{amount:t.amount,category:t.category,account:t.account,household_id:t.household_id,memo:t.memo}};
      const p0=parts[0];
      const{error:e1}=await sb.from("transactions").update({amount:p0.amount,category:p0.category,account:p0.account,
        household_id:p0.account==="공용"?(S.householdId||null):null,memo:(memoBase+tag).trim()}).eq("id",t.id);
      if(e1)throw e1;
      // 2) 나머지 조각 = 새 거래
      const ins=parts.slice(1).map(p=>({...base,amount:p.amount,category:p.category,account:p.account,
        household_id:p.account==="공용"?(S.householdId||null):null,memo:(memoBase+tag).trim()}));
      const{data:newRows,error:e2}=await sb.from("transactions").insert(ins).select();
      if(e2)throw e2;
      // 되돌리기: 새로 만든 건 삭제 대상, 원본은 값 복원 — 두 항목으로 스택에 쌓음
      if(newRows&&newRows.length)pushUndo(`분할 취소 · ${t.merchant||"거래"} (새 조각 ${newRows.length}건)`,newRows,"delete");
      pushUndo(`분할 전 금액 복원 · ${t.merchant||"거래"}`,[before],"update");
      ov.remove();toast(`✂️ ${parts.length}조각으로 나눴어요`);
      if(onDone)await onDone();
    }catch(err){toast("분할 실패: "+(err.message||err),false);saveBtn.disabled=false;saveBtn.textContent="✂️ 나누기 저장";}
  };
  draw();refresh();
  ov.append(sh);document.body.append(ov);
}
// ── 🗂️ 거래 정리함: 다중선택 + 일괄수정 (가져오기로 어질러진 거래 청소용) ──
function showCleanup(opt){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"12px",zIndex:"70"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"620px",height:"90vh",background:C.w,borderRadius:"20px",display:"flex",flexDirection:"column",overflow:"hidden"}});
  let mode=(opt&&opt.mode)||"review", q="", rows=[], sel=new Set(), touched=false, loading=false;
  const needsReview=t=>((t.category||"기타")==="기타")||!(t.merchant||"").trim()||/#단축어입력/.test(t.memo||"");
  // 헤더

    h("div",{},h("div",{style:{fontSize:"16px",fontWeight:"800"}},"🗂️ 거래 정리함"),h("div",{style:{fontSize:"11px",color:C.sub,marginTop:"2px"}},"골라서 한 번에 고쳐요")),
    h("button",{style:{fontSize:"22px",color:C.sub,background:"transparent",border:"none",cursor:"pointer"},onclick:async()=>{ov.remove();if(touched){await loadMonth();homeReload();}}},"✕")));
  const chipRow=h("div",{style:{display:"flex",gap:"6px",overflowX:"auto",paddingBottom:"8px"}});
  const modes=[["review","⚠️ 확인 필요"],["month","📅 이번 달"],["shared","🤝 공용"],["all","전체"]];
  const drawChips=()=>{chipRow.innerHTML="";modes.forEach(([k,lb])=>{const on=mode===k;chipRow.append(h("button",{style:{flexShrink:"0",fontSize:"12px",fontWeight:"700",padding:"7px 12px",borderRadius:"999px",border:`1px solid ${on?C.ink:C.line}`,background:on?C.ink:C.w,color:on?C.w:C.sub,cursor:"pointer"},onclick:()=>{mode=k;drawChips();load();}},lb));});};
  drawChips();
  const qEl=h("input",{type:"text",placeholder:"🔍 가맹점·메모 검색",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"9px 11px",fontSize:"13px",marginBottom:"8px"}});
  let qt;qEl.oninput=()=>{clearTimeout(qt);qt=setTimeout(()=>{q=qEl.value.trim();load();},350);};
  head.append(qEl,chipRow);
  const bar=h("div",{style:{display:"flex",alignItems:"center",gap:"8px",fontSize:"11.5px",color:C.sub,paddingBottom:"6px"}});
  head.append(bar);
  // 목록 + 하단 액션바
  const body=h("div",{style:{flex:"1",overflowY:"auto",padding:"6px 14px 12px"}});
  const foot=h("div",{style:{flexShrink:"0",borderTop:`1px solid ${C.line}`,padding:"10px 14px",background:"#FBFAF7",display:"none"}});
  const reload=async()=>{await load();};
  const drawFoot=()=>{
    foot.style.display=sel.size?"block":"none";
    if(!sel.size)return;
    foot.innerHTML="";
    const picked=()=>rows.filter(r=>sel.has(r.id));
    const doBulk=async(label,patch)=>{
      const list=picked();if(!list.length)return;
      const before=list.map(r=>({id:r.id,before:Object.fromEntries(Object.keys(patch).map(k=>[k,r[k]]))}));
      const ids=list.map(r=>r.id);
      const{error}=await sb.from("transactions").update(patch).in("id",ids);
      if(error){toast("실패: "+error.message,false);return;}
      touched=true;const e=pushUndo(label+` (${list.length}건)`,before,"update");
      sel.clear();await load();toastUndo(`✅ ${list.length}건 ${label}`,e,reload);
    };
    const btn=(lb,fn,col)=>h("button",{style:{flex:"1",minWidth:"0",fontSize:"12px",fontWeight:"700",padding:"10px 6px",borderRadius:"10px",border:`1px solid ${col||C.line}`,background:C.w,color:col||C.ink,cursor:"pointer"},onclick:fn},lb);
    foot.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"}},
      h("span",{style:{fontSize:"12.5px",fontWeight:"800",color:C.brand}},`${sel.size}건 선택됨`),
      h("button",{style:{fontSize:"11.5px",color:C.sub,background:"transparent",border:"none",cursor:"pointer"},onclick:()=>{sel.clear();draw();}},"선택 해제")));
    foot.append(h("div",{style:{display:"flex",gap:"6px",marginBottom:"6px"}},
      btn("🏷️ 태그 붙이기",async()=>{
        const list=picked();if(!list.length)return;
        const v=(prompt("붙일 태그 (예: 고양이병원, 제주여행, 이사)\n같은 태그끼리 '이벤트'로 묶여서 총액·N빵 정산을 할 수 있어요","")||"").trim().replace(/[#\s]/g,"");
        if(!v||SYS_TAGS.test(v))return;
        const before=list.map(r=>({id:r.id,before:{memo:r.memo}}));
        let done=0;
        for(const r of list){
          if(new RegExp("#"+v+"(?![\\w가-힣])").test(r.memo||""))continue;
          const nm=(((r.memo||"").trim())+" #"+v).trim();
          const{error}=await sb.from("transactions").update({memo:nm}).eq("id",r.id);
          if(!error)done++;
        }
        touched=true;const e=pushUndo(`태그 #${v} (${done}건)`,before,"update");
        sel.clear();await load();
        toastUndo(`🏷️ #${v} 태그 ${done}건 — 이벤트로 묶였어요`,e,reload);
      },"#8B4FB2"),
      btn("📂 이벤트 보기",()=>{ov.remove();showEventHub();},"#8B4FB2")));
    foot.append(h("div",{style:{display:"flex",gap:"6px",marginBottom:"6px"}},
      btn("🗂️ 카테고리",()=>{
        const ovc=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:"18px",zIndex:"80"}});
        const box=h("div",{style:{width:"100%",maxWidth:"420px",background:C.w,borderRadius:"18px",padding:"18px",maxHeight:"70vh",overflowY:"auto"}});

        box.append(wrap,h("button",{style:{width:"100%",marginTop:"12px",fontSize:"12.5px",color:C.sub,background:"transparent",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"10px",cursor:"pointer"},onclick:()=>ovc.remove()},"취소"));
        ovc.onclick=e=>{if(e.target===ovc)ovc.remove();};ovc.append(box);document.body.append(ovc);
      }),
      btn("👤 개인",()=>doBulk("계정 → 개인",{account:"개인",household_id:null})),
      btn("🤝 공용",()=>doBulk("계정 → 공용",{account:"공용",household_id:S.householdId||null}))));

      btn("💳 카드대금",()=>doBulk("유형 → 카드대금",{type:"카드대금"}),C.sub),
      btn("🗑️ 삭제",async()=>{
        const list=picked();if(!confirm(`${list.length}건을 삭제할까요?\n(실행 취소로 되돌릴 수 있어요)`))return;
        const ids=list.map(r=>r.id);
        const{error}=await sb.from("transactions").delete().in("id",ids);
        if(error){toast("삭제 실패: "+error.message,false);return;}
        touched=true;const e=pushUndo(`거래 삭제`,list,"delete");
        sel.clear();await load();toastUndo(`🗑️ ${list.length}건 삭제`,e,reload);
      },C.over)));
  };
  const draw=()=>{
    body.innerHTML="";
    if(loading){body.append(h("div",{class:"center"},h("div",{class:"spin"})));return;}
    if(!rows.length){body.append(empty(mode==="review"?"확인 필요한 거래가 없어요! 👍":"거래가 없어요."));bar.innerHTML="";drawFoot();return;}
    bar.innerHTML="";
    const allOn=rows.every(r=>sel.has(r.id));
    bar.append(h("button",{style:{fontSize:"11.5px",fontWeight:"700",color:C.brand,background:C.soft,border:"none",borderRadius:"7px",padding:"5px 9px",cursor:"pointer"},onclick:()=>{if(allOn)sel.clear();else rows.forEach(r=>sel.add(r.id));draw();}},allOn?"전체 해제":"전체 선택"),
      h("span",{},`${rows.length}건 표시${mode==="review"?" · 카테고리 '기타'거나 사용처 없는 거래":""}`));
    rows.forEach(t=>{
      const on=sel.has(t.id),c=CM[t.category]||CM["기타"],k=kindOf(t.type);
      const row=h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"9px 8px",borderRadius:"10px",background:on?C.soft:"transparent",border:`1px solid ${on?C.brand:"transparent"}`,cursor:"pointer",marginBottom:"2px"},
        onclick:()=>{if(on)sel.delete(t.id);else sel.add(t.id);draw();}},
        h("div",{style:{width:"19px",height:"19px",borderRadius:"6px",border:`2px solid ${on?C.brand:C.line}`,background:on?C.brand:C.w,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"12px",fontWeight:"800",flexShrink:"0"}},on?"✓":""),
        h("span",{style:{fontSize:"15px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"13px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},t.merchant||h("span",{style:{color:C.over}},"(사용처 없음)")),
          h("div",{style:{fontSize:"10.5px",color:C.sub,marginTop:"1px",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`${(t.date||"").slice(5)} · ${t.account} · ${t.category||"기타"}${t.payment_method?" · "+t.payment_method:""}`)),
        h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700",flexShrink:"0",color:k==="income"||k==="reduce"?C.brand:C.ink}},W(t.amount)),
        h("button",{title:"이 거래만 수정",style:{flexShrink:"0",fontSize:"11px",color:C.faint,background:"transparent",border:"none",cursor:"pointer",padding:"4px"},onclick:(ev)=>{ev.stopPropagation();showEditTxn(t,async()=>{touched=true;await load();});}},"✏️"));
      body.append(row);
    });
    drawFoot(); // 선택 상태 바뀔 때마다 하단 액션바 갱신
  };
  const load=async()=>{
    loading=true;draw();
    try{
      let qy=sb.from("transactions").select("*").order("date",{ascending:false}).limit(300);
      if(mode==="month"){const[s,e]=mRange(S.curYm);qy=qy.gte("date",s).lte("date",e);}
      else if(mode==="shared")qy=qy.eq("account","공용");
      if(q)qy=qy.or(`merchant.ilike.%${q}%,memo.ilike.%${q}%`);
      const{data,error}=await qy;
      if(error)throw error;
      rows=(data||[]).filter(t=>mode!=="review"||needsReview(t));
    }catch(e){rows=[];toast("불러오기 실패: "+(e.message||e),false);}
    loading=false;sel=new Set([...sel].filter(id=>rows.some(r=>r.id===id)));
    draw();drawFoot();
  };
  sh.append(head,body,foot);ov.append(sh);document.body.append(ov);
  load();
}
// ── 🧹 중복 거래 정리 (같은 날·금액·가맹점·계정이 여러 번) ──

async function downloadFullBackup(setStatus){
  setStatus&&setStatus("백업 만드는 중…");
  const tables=["transactions","fixed_costs","investment_snapshots","monthly_budgets","accounts","savings","loans","dutch_splits"];
  const out={exported_at:new Date().toISOString(),version:"v31",app:"나의 가계부"};
  for(const tb of tables){try{const{data}=await sb.from(tb).select("*");out[tb]=data||[];}catch(e){out[tb]=[];}}
  const ls={};
  ["spend_exclude","spend_fixed","cat_budgets","goal_pots","quick_favs","invest_journal","day_memos","big_checked","classify_rules","shared_cfg","excl_suggest_dismiss","taborder","nw_history","month_close","shared_tab","nw_goal","nw_milestones_seen","fcdiscover_dismiss","fcsort","portfolio_holdings"].forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)ls[k]=v;}catch{}});
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith("odraft:")||k.startsWith("savext:")||k.startsWith("cardstate:")||k.startsWith("cardorder:")||k.startsWith("stockmemo:")||k.startsWith("fcvar:")||k.startsWith("fcsub:")||k.startsWith("fcshare:")||k.startsWith("cardmoved:")||k.startsWith("revolving:")))ls[k]=localStorage.getItem(k);}}catch{}
  out.local_settings=ls;
  try{out.rules=getUserRules();}catch{}
  try{out.shared_cfg_obj=getSharedCfg();}catch{}
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`가계부백업_${td()}.json`;a.click();URL.revokeObjectURL(url);
  setStatus&&setStatus(`✅ 거래 ${(out.transactions||[]).length}건 등 전체 백업 완료`);
}

// 결제수단(카드) → 결제일
function cardBillingDay(pm){
  const a=(S.accounts||[]).find(x=>x.name===pm&&x.kind==="카드");
  return a&&a.billing_day?Number(a.billing_day):null;
}
// 메모의 원구매일 태그 (#원구매:YYYY-MM-DD)
// 실제 구매 시점 추정: 이번 회차 날짜에서 (회차-1)개월 역산
function estPurchaseDate(t){
  const base=t.date||td();const n=Number(t.installment_no)||1;
  if(n<=1)return base;
  const[y,m,d]=base.split("-").map(Number);
  const dt=new Date(y,m-1-(n-1),Math.min(d,28));
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function getOrigDate(t){const m=(t.memo||"").match(/#원구매:(\d{4}-\d{2}-\d{2})/);return m?m[1]:null;}
function withOrigDate(memo,origDate){const clean=(memo||"").replace(/\s*#원구매:\d{4}-\d{2}-\d{2}/g,"").trim();return (clean+" #원구매:"+origDate).trim();}
// 자동 할부 정렬: 결제수단이 카드+결제일 있는 할부만 조용히 이동 (안전한 것만)
async function autoSortInstallments(){
  try{
    if(!S.session)return;
    const curYm=ym(S.curYm||td());
    // 이번달 자동정렬 하루 1회 가드
    const gk="autosort:"+curYm+":"+td();
    if(localStorage.getItem(gk))return;
    const cards=(S.accounts||[]).filter(a=>a.kind==="카드"&&a.billing_day);
    if(!cards.length){return;} // 결제일 입력된 카드 없으면 skip
    const cardNames=new Set(cards.map(c=>c.name));
    const targetOf=bd=>`${curYm}-${String(Math.min(bd,28)).padStart(2,"0")}`;
    const moves=[];
    (S.txns||[]).forEach(t=>{
      if(!t.installment_total)return;
      const pm=t.payment_method||"";
      if(!cardNames.has(pm))return; // 카드 결제수단인 것만 (플랫폼은 수동)
      const bd=cardBillingDay(pm);if(!bd)return;
      const target=targetOf(bd);
      if((t.date||"")!==target)moves.push({t,target});
    });
    if(!moves.length){localStorage.setItem(gk,"1");return;}
    let ok=0;
    for(const {t,target} of moves){
      const orig=getOrigDate(t)||estPurchaseDate(t);
      const{error}=await sb.from("transactions").update({date:target,memo:withOrigDate(t.memo,orig)}).eq("id",t.id);
      if(!error)ok++;
    }
    localStorage.setItem(gk,"1");
    if(ok>0){
      await loadMonth();
      if(typeof homeReload==="function")homeReload();
      if(typeof toast==="function")toast(`🗓️ 할부 ${ok}건을 카드 결제일로 자동 정렬했어요`);
    }
  }catch(e){try{dlog("[autoSort]",e);}catch{}}
}

async function loadDbProducts(force){
  if(S.dbProducts&&!force)return S.dbProducts;
  try{
    const[p,r]=await Promise.all([
      sb.from("products").select("*").order("created_at",{ascending:false}),
      sb.from("price_records").select("*").order("date",{ascending:false})
    ]);
    if(p.error)throw p.error;
    S.dbProducts=p.data||[];S.dbPrices=r.data||[];S.dbMissing=false;
  }catch(e){S.dbProducts=S.dbProducts||[];S.dbPrices=S.dbPrices||[];S.dbMissing=true;}
  return S.dbProducts;
}
function dbNorm(x){return (x||"").toLowerCase().replace(/\s+/g,"");}
function dbBestMatch(q){
  const n=dbNorm(q);if(!n||n.length<2||!S.dbProducts||!S.dbProducts.length)return null;
  let best=null,bs=0;
  S.dbProducts.forEach(p=>{
    const names=[p.name,...((p.aliases||"").split(","))].map(dbNorm).filter(Boolean);
    names.forEach(nm=>{
      let sc=0;
      if(nm===n)sc=100;
      else if(nm.includes(n)||n.includes(nm))sc=60+Math.min(30,Math.min(nm.length,n.length)*4);
      if(sc>bs){bs=sc;best=p;}
    });
  });
  return bs>=60?best:null;
}
function dbPricesOf(pid){return (S.dbPrices||[]).filter(r=>r.product_id===pid);}
function dbLatest(pid){const a=dbPricesOf(pid);return a.length?a[0]:null;}
function dbLowest(pid){const a=dbPricesOf(pid);if(!a.length)return null;return a.reduce((m,r)=>Number(r.price)<Number(m.price)?r:m,a[0]);}

    const m=(t.merchant||"")+" "+(t.category||"");
    if(F_DELIV.test(m))b.deliv.push(t);
    else if(F_GROC.test(m))b.groc.push(t);
    else if(t.category==="장보기")b.groc.push(t);
    else if(foodCats.includes(t.category))b.eat.push(t);
  });
  return b;
}
function buildFoodAnalysis(){
  const b=foodBuckets(S.txns);
  const sum=a=>a.reduce((x,t)=>x+(Number(t.amount)||0),0);
  const g=sum(b.groc),d=sum(b.deliv),e=sum(b.eat),tot=g+d+e;
  if(!tot)return null;
  const pb=foodBuckets(S.prevTxns);const pg=sum(pb.groc),pd=sum(pb.deliv),pe=sum(pb.eat);
  const el=sec("🍚 식비 분석",h("span",{style:{fontSize:"11px",color:C.faint}},"장보기·배달·외식 자동 분류"));

  el.append(bar);

        h("div",{style:{fontSize:"10.5px",color:C.faint,marginTop:"1px"}},`${arr.length}건${extra?` · ${extra}`:""}${pv>0?` · 전월比 ${diff>=0?"+":"−"}${W(Math.abs(diff)).slice(1)}`:""}`)),
      h("div",{style:{textAlign:"right",flexShrink:"0"}},
        h("div",{class:"num",style:{fontSize:"13.5px",fontWeight:"800"}},W(v)),
        h("div",{class:"num",style:{fontSize:"10.5px",color:C.sub}},Math.round(v/tot*100)+"%")),
      arr.length?h("span",{style:{color:C.faint,fontSize:"11px"}},"›"):"");
  };
  el.append(rowF("🛒","장보기·집밥",g,b.groc,pg,g?`하루 ${W(dayCost)}꼴`:""));
  el.append(rowF("🛵","배달",d,b.deliv,pd,b.deliv.length?`회당 ${W(Math.round(d/b.deliv.length))}`:""));
  el.append(rowF("🍽️","외식·기타 식비",e,b.eat,pe,b.eat.length?`회당 ${W(Math.round(e/b.eat.length))}`:""));
  let tip="";
  if(d>0&&b.deliv.length&&g>0&&dayCost>0){const per=d/b.deliv.length;tip=`배달 1회 평균 ${W(Math.round(per))} — 장보기 기준 집밥 ${(per/dayCost).toFixed(1)}일치예요.`;}
  else if(g>0)tip=`이번 달 장보기는 하루 ${W(dayCost)}꼴이에요.`;
  else if(d>0)tip=`이번 달은 배달이 식비의 ${Math.round(d/tot*100)}%예요.`;
  if(tip)el.append(h("div",{style:{fontSize:"11.5px",color:C.sub,background:"#F6F4EF",borderRadius:"10px",padding:"9px 12px",marginTop:"10px",lineHeight:"1.6"}},"💡 "+tip));

  return el;
}

// ── 🔁 정기결제(구독) 자동 감지 ──
function buildSubscriptions(){
  // 최근 3개월 거래에서 (가맹점+금액) 반복 패턴 탐지
  const pool=[...(S.txns||[]),...(S.prevTxns||[])];
  const cons=pool.filter(t=>["소비(일시불)","소비(할부)"].includes(t.type));
  const groups={};
  cons.forEach(t=>{
    const nm=(t.merchant||t.category||"").trim();if(!nm)return;
    const amt=Number(t.amount)||0;if(amt<1000)return;
    const key=nm+"|"+Math.round(amt/100)*100; // 금액 100원 단위 반올림으로 그룹
    (groups[key]=groups[key]||{name:nm,amt,months:new Set(),cat:t.category,tx:[]});
    groups[key].months.add((t.date||"").slice(0,7));
    groups[key].tx.push(t);
  });
  // 구독 후보: 서로 다른 달에 2회 이상 같은 금액
  const subsKW=/넷플릭스|netflix|유튜브|youtube|스포티파이|spotify|디즈니|웨이브|왓챠|티빙|melon|멜론|지니|밀리|클로드|claude|chatgpt|openai|구독|프라임|아이클라우드|icloud|쿠팡\s*와우|와우\s*멤버|멤버십|membership|통신|요금제|보험|월정액/i;
  // 병원비·가전 등 우연히 2개월 반복된 큰 지출 오인 방지:
  //  - 명확한 구독 키워드가 있으면 → 금액 무관 구독
  //  - 키워드 없으면 → 소액(5만원 이하)이 3개월 이상 반복될 때만 구독으로
  const subs=Object.values(groups).filter(g=>{
    const kw=subsKW.test(g.name);
    if(kw)return g.months.size>=1;              // 키워드 있으면 1회부터 구독
    return g.amt<=30000&&g.months.size>=2;      // 키워드 없으면 3만원 이하+2개월 반복만
  }).sort((a,b)=>b.amt-a.amt);
  if(!subs.length)return null;

    diff!=null?h("div",{style:{textAlign:"right",flexShrink:"0"}},
      h("div",{class:"num",style:{fontSize:"12px",fontWeight:"800",color:diff>0?C.over:C.brand}},`${diff>0?"▲":"▼"} ${shortNum(Math.abs(diff))}`),

    const vals=months.map(m=>Math.max(0,perM[m].p-perM[m].pr)+Math.round(Math.max(0,perM[m].c-perM[m].cr)*ratio));

  }catch(e){dlog("[추이 로드실패]",e);}})();
  return s;
}

// ── 💵 월말 예상 잔액 (이대로 가면 얼마 남나) ──
function buildForecast(){
  const _t=td();if(S.curYm!==ym(_t))return null; // 이번 달만 예측
  const st=calcStatsFor(S.txns),cfg=getSharedCfg(),ratio=(cfg.ratio||50)/100;
  const spent=st.pNet+Math.round(st.cNet*ratio);
  if(spent<=0&&st.income<=0)return null;
  const dayNow=Number(_t.slice(8,10));
  const lastDay=new Date(Number(S.curYm.slice(0,4)),Number(S.curYm.slice(5,7)),0).getDate();
  const daysLeft=Math.max(0,lastDay-dayNow);
  let fixedLeft=0,fixedPassed=0;
  (S.fixedCosts||[]).filter(f=>f.is_active!==false).forEach(f=>{
    const d=Number(f.billing_day)||0;
    let amt=Number(f.amount||0);try{amt=myShareAmount(f);}catch(e){}
    if(d>dayNow)fixedLeft+=amt;else fixedPassed+=amt;
  });
  const varDaily=dayNow>0?Math.max(0,spent-fixedPassed)/dayNow:0;
  const projected=Math.round(spent+fixedLeft+varDaily*daysLeft);
  const leftover=st.income-projected-st.save;
  const pct=st.income>0?Math.min(100,Math.round(projected/st.income*100)):0;
  const ok=leftover>=0;
  const s=sec("💵 월말 예상",h("span",{style:{fontSize:"11px",color:C.faint}},daysLeft>0?`${daysLeft}일 남음`:"이번 달 마지막 날"));
  s.append(h("div",{style:{display:"flex",alignItems:"flex-end",justifyContent:"space-between",marginBottom:"10px"}},
    h("div",{},
      h("div",{style:{fontSize:"11.5px",color:C.sub,marginBottom:"4px"}},ok?"이대로 가면 월말에":"이대로 가면 월말에"),
      h("div",{class:"num",style:{fontSize:"27px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1.1",color:ok?C.brand:C.over}},`${ok?"":"−"}${W(Math.abs(leftover)).slice(1)}`),
      h("div",{style:{fontSize:"11px",color:ok?C.brand:C.over,fontWeight:"700",marginTop:"3px"}},ok?"남을 것 같아요 🌱":"부족할 것 같아요 ⚠️")),
    h("div",{style:{textAlign:"right",flexShrink:"0"}},
      h("div",{style:{fontSize:"10px",color:C.faint}},"예상 총지출"),
      h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800"}},W(projected)),
      st.income>0?h("div",{style:{fontSize:"10px",color:C.faint,marginTop:"2px"}},`수입의 ${pct}%`):"")));
  if(st.income>0){
    s.append(h("div",{style:{height:"7px",background:"#EFEDE7",borderRadius:"999px",overflow:"hidden",marginBottom:"9px"}},
      h("div",{style:{width:Math.min(100,pct)+"%",height:"100%",background:pct>=100?C.over:pct>=85?C.warn:C.brand,borderRadius:"999px"}})));
  }
  const cell=(lbl,v,col)=>h("div",{style:{flex:"1",textAlign:"center",background:"#F6F4EF",borderRadius:"10px",padding:"8px 4px"}},h("div",{style:{fontSize:"9.5px",color:C.faint,marginBottom:"2px"}},lbl),h("div",{class:"num",style:{fontSize:"12px",fontWeight:"800",color:col||C.ink}},v));
  s.append(h("div",{style:{display:"flex",gap:"6px"}},
    cell("지금까지",W(spent)),
    cell("남은 고정비",W(Math.round(fixedLeft)),fixedLeft>0?C.warn:C.ink),
    cell("하루 평균",W(Math.round(varDaily)))));
  if(daysLeft>0&&st.income>0){
    const budgetLeft=st.income-st.save-spent-fixedLeft;
    const perDay=Math.floor(budgetLeft/Math.max(1,daysLeft));
    s.append(h("div",{style:{fontSize:"11.5px",color:perDay>=0?C.sub:C.over,marginTop:"9px",lineHeight:"1.5",background:perDay>=0?"#F6F4EF":"#FEF2EE",borderRadius:"9px",padding:"9px 11px"}},
      perDay>=0?`💡 남은 ${daysLeft}일 동안 하루 ${W(perDay)} 이하로 쓰면 흑자예요`:`⚠️ 이미 예산을 넘겨서, 남은 ${daysLeft}일은 최대한 아껴야 해요`));
  }
  return s;
}

function buildInsight(st,prevSt){
  const insights=[];
  const cur=st.pNet,prev=prevSt.pNet;
  // 1. 전월 대비 개인소비
  if(prev>0){
    const diff=cur-prev,pct=Math.round(Math.abs(diff)/prev*100);
    const inf=()=>showInsightInfo("📊 전월 대비 개인소비",[`이번 달 개인소비 ${W(cur)}`,`지난 달 개인소비 ${W(prev)}`,`차이 ${diff>=0?"+":"−"}${W(Math.abs(diff))} (${pct}%)`,"개인 계정의 소비 합계를 전월과 비교한 값이에요."]);
    if(Math.abs(pct)>=10){
      if(diff>0)insights.push({icon:"📈",tone:"warn",text:`개인 소비가 지난달보다 ${pct}% 늘었어요 (${W(Math.abs(diff))} 증가)`,act:inf});
      else insights.push({icon:"📉",tone:"good",text:`개인 소비가 지난달보다 ${pct}% 줄었어요 (${W(Math.abs(diff))} 절약). 잘하고 있어요!`,act:inf});
    }else insights.push({icon:"➡️",tone:"neutral",text:`개인 소비가 지난달과 비슷해요 (${W(cur)})`,act:inf});
  }
  // 2. 카테고리 TOP
  const cagg={};
  for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;cagg[t.category]=(cagg[t.category]||0)+(Number(t.amount)||0);}
  const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]);
  if(crows.length){
    const[topCat,topAmt]=crows[0];const pct=cur>0?Math.round(topAmt/cur*100):0;const c=CM[topCat]||CM["기타"];
    insights.push({icon:c.i,tone:"neutral",text:`이번 달 가장 많이 쓴 곳은 ${topCat} (${W(topAmt)}, 전체의 ${pct}%)`,act:()=>showCatDetail(topCat)});
  }
  // 3. 카테고리 급증
  const prevCagg={};
  for(const t of S.prevTxns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;prevCagg[t.category]=(prevCagg[t.category]||0)+(Number(t.amount)||0);}
  let maxJump=null;
  for(const[cat,amt] of crows){const pAmt=prevCagg[cat]||0;if(pAmt>10000&&amt>pAmt*1.5){const jump=amt-pAmt;if(!maxJump||jump>maxJump.jump)maxJump={cat,jump,amt,pAmt};}}
  if(maxJump){insights.push({icon:"⚠️",tone:"warn",text:`${maxJump.cat} 지출이 지난달의 ${Math.round(maxJump.amt/maxJump.pAmt*10)/10}배로 늘었어요 (${W(maxJump.pAmt)}→${W(maxJump.amt)})`,act:()=>showCatDetail(maxJump.cat)});}
  // 4. 수입 대비 지출
  if(st.income>0){
    const rate=Math.round((cur+st.cNet)/st.income*100);
    const inf=()=>showInsightInfo("💼 수입 대비 지출",[`이번 달 수입 ${W(st.income)}`,`개인소비 ${W(cur)} + 공용소비 ${W(st.cNet)}`,`= 수입의 ${rate}%`,"소비(개인+공용)가 수입에서 차지하는 비율이에요."]);
    if(rate>100)insights.push({icon:"🔴",tone:"warn",text:`이번 달 수입보다 지출이 많아요 (지출이 수입의 ${rate}%)`,act:inf});
    else if(rate<=60)insights.push({icon:"💰",tone:"good",text:`수입의 ${rate}%만 썼어요. 저축 여력이 좋아요!`,act:inf});
  }
  // 5. 예산 경고
  if(S.budget>0){
    const bSpend=cur-personalFixedExp(S.txns);const used=bSpend/S.budget;const isCur=S.curYm===ym(td());
    const dl=isCur?new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate():0;
    const inf=()=>showInsightInfo("🎯 예산 현황",[`예산 ${W(S.budget)}`,`예산 대상 지출 ${W(bSpend)} (고정비 제외)`,`${Math.round(used*100)}% 사용${dl>0?` · ${dl}일 남음`:""}`]);
    if(used>=1)insights.push({icon:"🚨",tone:"warn",text:`예산을 ${W(bSpend-S.budget)} 초과했어요`,act:inf});
    else if(used>=0.8&&dl>5)insights.push({icon:"⏰",tone:"warn",text:`예산의 ${Math.round(used*100)}%를 썼는데 아직 ${dl}일 남았어요. 페이스 조절이 필요해요`,act:inf});
  }
  try{
    const cb=getCatBudgets(),cagg2={};
    for(const t of (S.txns||[]))if(kindOf(t.type)==="spend"&&t.account==="개인"&&!isExcludedSpend(t))cagg2[t.category]=(cagg2[t.category]||0)+(Number(t.amount)||0);
    Object.keys(cb).filter(c=>cb[c]>0&&(cagg2[c]||0)>cb[c]).sort((a,b)=>((cagg2[b]||0)-cb[b])-((cagg2[a]||0)-cb[a])).slice(0,2).forEach(c=>insights.push({icon:"⚠️",tone:"warn",text:`${c} 예산을 ${W((cagg2[c]||0)-cb[c])} 초과했어요`,act:()=>showCatDetail(c)}));
  }catch{}
  // 6. 저축률
  if(st.income>0&&st.save>0){const sr=Math.round(st.save/st.income*100);if(sr>=5)insights.push({icon:"🏦",tone:"good",text:`이번 달 수입의 ${sr}%를 저축했어요 (${W(st.save)})`,act:()=>showInsightInfo("🏦 저축률",[`저축·투자 ${W(st.save)}`,`수입 ${W(st.income)}`,`= 저축률 ${sr}%`,"수입에서 저축·투자로 넣은 비율이에요. 보통 20% 이상이면 좋아요."])});}
  // 7. 카테고리 절약
  {let bestCut=null;for(const cat in prevCagg){const pAmt=prevCagg[cat]||0,nAmt=cagg[cat]||0;if(pAmt>=20000&&nAmt<pAmt){const cut=pAmt-nAmt,cpct=Math.round(cut/pAmt*100);if(cpct>=15&&(!bestCut||cut>bestCut.cut))bestCut={cat,cut,cpct};}}if(bestCut)insights.push({icon:"👍",tone:"good",text:`${bestCut.cat} 지출을 지난달보다 ${bestCut.cpct}% 줄였어요 (${W(bestCut.cut)} 절약)`,act:()=>showCatDetail(bestCut.cat)});}
  // 8. 최다 지출일
  {const dagg={};for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인"||isExcludedSpend(t))continue;dagg[t.date]=(dagg[t.date]||0)+(Number(t.amount)||0);}const drows=Object.entries(dagg).sort((a,b)=>b[1]-a[1]);if(drows.length&&drows[0][1]>0){const dnum=Number(drows[0][0].slice(8,10)),dkey=drows[0][0];insights.push({icon:"📅",tone:"neutral",text:`가장 많이 쓴 날은 ${dnum}일 (${W(drows[0][1])})`,act:()=>showTxnListModal(`📅 ${dnum}일 지출 내역`,S.txns.filter(t=>t.date===dkey&&kindOf(t.type)==="spend"&&t.account==="개인"))});}}
  // 9. 가장 큰 단일 지출
  {let big=null;for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인"||isExcludedSpend(t))continue;const a=Number(t.amount)||0;if(!big||a>big.a)big={a,t};}if(big&&big.a>0){const m=big.t.merchant||big.t.category||"지출";insights.push({icon:"💸",tone:"neutral",text:`가장 큰 한 건은 ${m} ${W(big.a)}`,act:()=>showTxnListModal("💸 가장 큰 단일 지출",[big.t])});}}

  if(!insights.length)return null;
  const el=sec("💡 이번 달 인사이트",h("span",{style:{fontSize:"10.5px",color:C.faint}},"탭하면 근거 보기"));
  const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});
  const toneBg={good:"#F2FAF6",warn:"#FEF6F3",neutral:"#FAF8F4"};
  const toneIcon={good:"#D2F0E1",warn:"#FADFD7",neutral:"#ECE7DD"};
  const toneBar={good:C.brand,warn:C.over,neutral:C.faint};
  insights.slice(0,8).forEach(ins=>{
    list.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"12px 13px",borderRadius:"13px",background:toneBg[ins.tone]||"#FAF8F4",borderLeft:`3px solid ${toneBar[ins.tone]||C.faint}`,cursor:ins.act?"pointer":"default"},onclick:ins.act||null},
      h("div",{style:{width:"32px",height:"32px",borderRadius:"9px",background:toneIcon[ins.tone]||"#ECE7DD",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"15px",flexShrink:"0"}},ins.icon),
      h("div",{style:{flex:"1",minWidth:"0",fontSize:"13.5px",lineHeight:"1.55",color:"#2C2A25",fontWeight:"500",wordBreak:"keep-all"}},ins.text),
      ins.act?h("span",{style:{fontSize:"16px",color:C.faint,flexShrink:"0"}},"›"):""
    ));
  });
  el.append(list);
  return el;
}


// ── 달력 뷰 ──
function buildCalendarView(){
  const calYm=S.calYm||S.curYm;const[yr,mo]=calYm.split("-").map(Number);
  const firstDay=new Date(yr,mo-1,1).getDay();
  const lastDate=new Date(yr,mo,0).getDate();
  const todayStr=td();
  const isCurMonth=calYm===ym(todayStr);
  const todayD=isCurMonth?new Date().getDate():0;
  const offset=(firstDay===0?6:firstDay-1);
  const pad=d=>`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const dayMemos=getDayMemos();
  const byDate={};
  for(const t of (S.calTxns||S.txns)){
    if(!byDate[t.date])byDate[t.date]={spend:0,income:0,txns:[]};
    if(isInternalTransfer(t)){byDate[t.date].txns.push(t);continue;}
    const k=kindOf(t.type);
    if(k==="spend")byDate[t.date].spend+=Number(t.amount)||0;
    else if(k==="income"||k==="reduce")byDate[t.date].income+=Number(t.amount)||0;
    byDate[t.date].txns.push(t);

  const fcByDay={};
  (S.fixedCosts||[]).forEach(fc=>{
    if(fc.is_active===false)return;
    try{if(getFcFreq(fc)!=="월")return;}catch{}

  const elapsed=isCurMonth?todayD:lastDate;

    h("div",{style:{background:"#FFF1EF",borderRadius:"12px",padding:"12px 13px"}},h("div",{style:{fontSize:"11px",color:C.over,marginBottom:"4px",fontWeight:"600"}},"💸 지출"),h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.over}},W(totalSpend))),
    h("div",{style:{background:"#EDFBF4",borderRadius:"12px",padding:"12px 13px"}},h("div",{style:{fontSize:"11px",color:C.brand,marginBottom:"4px",fontWeight:"600"}},"💼 수입"),h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(totalIncome))),
    h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"12px 13px"}},h("div",{style:{fontSize:"11px",color:C.sub,marginBottom:"4px",fontWeight:"600"}},net>=0?"잔여":"적자"),h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:net>=0?C.brand:C.over}},W(Math.abs(net)))));

  // 무지출일 + 남은 고정비
  const statRow=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"12px"}},
    h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px"}},h("div",{style:{fontSize:"11px",color:C.sub,marginBottom:"4px",fontWeight:"600"}},"🎉 무지출일"),h("div",{},h("span",{class:"num",style:{fontSize:"18px",fontWeight:"800",color:C.brand}},noSpendDays),h("span",{style:{fontSize:"12px",color:C.sub}},`일 / ${elapsed}일`))),
    h("div",{style:{background:"#F4F0FB",borderRadius:"12px",padding:"12px 14px"}},h("div",{style:{fontSize:"11px",color:"#7A5BC0",marginBottom:"4px",fontWeight:"600"}},"📌 남은 고정비"),h("div",{},h("span",{class:"num",style:{fontSize:"16px",fontWeight:"800",color:"#7A5BC0"}},remainFcCnt?W(remainFc):"없음"),remainFcCnt?h("span",{style:{fontSize:"11px",color:C.sub}},` · ${remainFcCnt}건`):"")));

  // 달력 그리드 (큰 글자 + 히트맵 + 색)
  const cal=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"14px 12px"}});
  const hdr=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"5px"}});
  ["월","화","수","목","금","토","일"].forEach((d,i)=>hdr.append(h("div",{style:{textAlign:"center",fontSize:"12px",color:i>=5?"#B23A5C":C.faint,fontWeight:"700",padding:"3px 0"}},d)));

    const heat=data&&data.spend>0?Math.min(0.24,0.05+data.spend/maxDaySpend*0.24):0;

    const cell=h("div",{style:{padding:"4px 2px",borderRadius:"9px",textAlign:"center",cursor:clickable?"pointer":"default",background:bg,minHeight:"68px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",gap:"2px"},onclick:clickable?()=>showDayDetail(dateStr,data?data.txns:[],fcByDay[d]||[]):null},
      h("div",{style:{fontSize:"16.5px",fontWeight:isToday?"800":"700",lineHeight:"1.45",color:isToday?C.w:isSun?"#B23A5C":isSat?"#4169B1":C.ink}},d),
      data&&data.spend>0?h("div",{class:"num",style:{fontSize:"11px",color:isToday?"rgba(255,255,255,.9)":C.over,lineHeight:"1.3",fontWeight:"700"}},"-"+shortNum(data.spend)):"",
      data&&data.income>0?h("div",{class:"num",style:{fontSize:"11px",color:isToday?"rgba(255,255,255,.9)":C.brand,lineHeight:"1.3",fontWeight:"700"}},"+"+shortNum(data.income)):"",
      fcByDay[d]?h("div",{style:{width:"6px",height:"6px",borderRadius:"50%",background:isToday?"rgba(255,255,255,.9)":"#9B7BD4"}}):"",
      dayMemos[dateStr]?h("div",{style:{fontSize:"8.5px",lineHeight:"1"}},"📝"):"");
    grid.append(cell);

  cal.append(hdr,grid);

  const weeks={};
  for(let d=1;d<=lastDate;d++){const ds=pad(d);const wi=Math.floor((offset+d-1)/7);weeks[wi]=(weeks[wi]||0)+(byDate[ds]?byDate[ds].spend:0);}
  const wEntries=Object.entries(weeks),wMax=Math.max(1,...wEntries.map(([,v])=>v));
  const weekCard=sec("📅 주차별 지출","");
  wEntries.forEach(([wi,v])=>weekCard.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"6px 2px"}},
    h("span",{style:{fontSize:"12px",color:C.sub,width:"42px",flexShrink:"0"}},`${Number(wi)+1}주차`),
    h("div",{style:{flex:"1",height:"8px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden"}},h("div",{style:{width:`${Math.round(v/wMax*100)}%`,height:"100%",background:C.over+"AA",borderRadius:"999px"}})),
    h("span",{class:"num",style:{fontSize:"12px",fontWeight:"700",width:"72px",textAlign:"right",flexShrink:"0"}},v>0?W(v):"—"))));

  let topCard=null;

      h("span",{style:{flex:"1",fontSize:"12.5px",fontWeight:"600"}},`${Number(ds.slice(5,7))}월 ${dd}일`),
      h("span",{class:"num",style:{fontSize:"13px",fontWeight:"800",color:C.over}},W(d.spend)),
      h("span",{style:{fontSize:"11px",color:C.faint}},`${d.txns.filter(t=>kindOf(t.type)==="spend").length}건`)));});
  }

  // 요일별 지출 패턴

  const peakIdx=dowSum.indexOf(Math.max(...dowSum));
  let dowCard=null;

    dowCard=sec("📆 요일별 지출 패턴",dowSum[peakIdx]>0?`${dowNames[peakIdx]}요일 최다`:"");

      h("div",{style:{width:"100%",height:hpct+"%",background:i===peakIdx?C.over:C.over+"55",borderRadius:"3px 3px 0 0",minHeight:v>0?"3px":"0"}}),
      h("div",{style:{fontSize:"10.5px",color:i===peakIdx?C.ink:C.faint,fontWeight:i===peakIdx?"800":"400"}},dowNames[i])));});
    dowCard.append(barRow);
    dowCard.append(h("div",{style:{fontSize:"10.5px",color:C.faint,textAlign:"center",marginTop:"6px"}},"이번 달 요일별 지출 합계예요"));
  }

  // 범례
  const legend=h("div",{style:{display:"flex",gap:"14px",justifyContent:"center",flexWrap:"wrap",marginTop:"10px",fontSize:"11.5px",color:C.sub}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{background:"rgba(194,85,61,.5)",width:"12px",height:"12px",borderRadius:"3px",display:"inline-block"}}),"많이 쓴 날"),

  const monthNav=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",gap:"12px",marginBottom:"12px"}},
    h("button",{style:{width:"34px",height:"34px",borderRadius:"999px",border:`1px solid ${C.line}`,background:C.w,fontSize:"17px",color:C.sub,cursor:"pointer"},onclick:()=>goCal(-1)},"‹"),
    h("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",lineHeight:"1.2"}},
      h("div",{style:{fontSize:"16px",fontWeight:"800"}},`${yr}년 ${mo}월`),
      isCalCur?"":h("button",{style:{fontSize:"10.5px",color:C.brand,fontWeight:"700",background:"transparent",border:"none",cursor:"pointer",marginTop:"2px"},onclick:()=>{S.calYm=ym(td());goCal(0);}},"↩ 현재로")),
    h("button",{style:{width:"34px",height:"34px",borderRadius:"999px",border:`1px solid ${C.line}`,background:C.w,fontSize:"17px",color:C.sub,cursor:"pointer"},onclick:()=>goCal(1)},"›"));
  return reorderCards("calendar",[monthNav,summary,statRow,cal,weekCard,topCard,dowCard,legend].filter(Boolean));
}

// ── 하루 상세 시트 ──
function showTxnListModal(title,list){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"55"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px",padding:"18px 20px 26px",maxHeight:"85vh",display:"flex",flexDirection:"column",overflow:"hidden"}});
  const full=(list||[]).slice();
  const reload=async()=>{await loadMonth();ov.remove();homeReload();};
  // 종류 판별
  const kindTag=t=>isInternalTransfer(t)?"transfer":(["income","reduce"].includes(kindOf(t.type))?"income":kindOf(t.type)==="spend"?"spend":"flow");
  const cnt={all:full.length,income:0,spend:0,transfer:0};
  full.forEach(t=>{const g=kindTag(t);if(g==="income")cnt.income++;else if(g==="spend")cnt.spend++;else if(g==="transfer")cnt.transfer++;});
  let filt="all";
  const head=h("div",{style:{flexShrink:"0"}});
  head.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},
    h("span",{style:{fontSize:"17px",fontWeight:"800"}},title),
    h("button",{style:{fontSize:"20px",color:C.sub,background:"transparent",border:"none",cursor:"pointer"},onclick:()=>ov.remove()},"✕")));
  // 필터 탭 (건수 있는 것만)
  const tabWrap=h("div",{style:{display:"flex",gap:"6px",marginBottom:"12px",flexWrap:"wrap"}});
  const summary=h("div",{style:{fontSize:"12px",color:C.sub,marginBottom:"12px"}});
  const listWrap=h("div",{style:{flex:"1",overflowY:"auto"}});
  const TABS=[["all","전체",cnt.all],["spend","소비",cnt.spend],["income","수입",cnt.income],["transfer","⇄ 이체",cnt.transfer]];
  const drawTabs=()=>{tabWrap.innerHTML="";TABS.forEach(([k,lb,c])=>{if(k!=="all"&&c===0)return;
    tabWrap.append(h("button",{style:{fontSize:"12.5px",fontWeight:"700",padding:"7px 13px",borderRadius:"999px",border:`1px solid ${filt===k?C.brand:C.line}`,background:filt===k?C.brand:C.w,color:filt===k?"#fff":C.sub,cursor:"pointer"},onclick:()=>{filt=k;draw();}},`${lb} ${c}`));});};
  const draw=()=>{
    drawTabs();
    const arr=full.filter(t=>filt==="all"||kindTag(t)===filt).sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:0)||Number(b.amount)-Number(a.amount));
    // 요약: 소비/수입/이체 합
    let sp=0,inc=0,tr=0;full.forEach(t=>{const g=kindTag(t);const a=Number(t.amount)||0;if(g==="spend")sp+=a;else if(g==="income")inc+=a;else if(g==="transfer")tr+=a;});
    summary.innerHTML="";
    const parts=[];
    if(cnt.spend)parts.push(`소비 ${W(sp)}`);
    if(cnt.income)parts.push(`수입 ${W(inc)}`);
    if(cnt.transfer)parts.push(`⇄ 이체 ${W(tr)}`);
    summary.textContent=parts.join(" · ");
    listWrap.innerHTML="";
    if(!arr.length){listWrap.append(empty("해당 내역이 없어요."));return;}
    arr.forEach(t=>{const c=CM[t.category]||CM["기타"],tag=kindTag(t);
      const sg=tag==="transfer"?"⇄ ":tag==="income"?"+":tag==="spend"?"−":"";
      const cl=tag==="transfer"?C.faint:tag==="income"?C.brand:C.ink;
      listWrap.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",borderRadius:"4px"},onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},onmouseleave:e=>{e.currentTarget.style.background="transparent";},onclick:()=>showEditTxn(t,reload)},
        h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0",opacity:tag==="transfer"?"0.6":"1"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")+(tag==="transfer"?" · 이체":"")),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.account} · ${t.category}`)),
        h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`)));
    });
  };
  head.append(tabWrap,summary);
  sh.append(head,listWrap);
  draw();
  ov.append(sh);document.body.append(ov);
}
function showWeekdayDetail(idx){
  const names=["월","화","수","목","금","토","일"];
  const list=(S.txns||[]).filter(t=>{const wd=new Date(t.date+"T00:00:00").getDay();const ii=wd===0?6:wd-1;return ii===idx&&kindOf(t.type)==="spend";}).sort((a,b)=>(a.date<b.date?1:-1)||Number(b.amount)-Number(a.amount));
  const tot=list.reduce((a,t)=>a+(Number(t.amount)||0),0);
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"55"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px",padding:"18px 20px 26px",maxHeight:"85vh",overflowY:"auto"}});
  sh.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}},
    h("span",{style:{fontSize:"18px",fontWeight:"800"}},`${names[idx]}요일 지출`),
    h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"14px"}},`이번 달 ${names[idx]}요일 · ${list.length}건 · `,h("span",{class:"num",style:{fontWeight:"800",color:C.over}},W(tot))));
  if(!list.length)sh.append(empty(`이번 달 ${names[idx]}요일엔 지출이 없어요.`));
  else list.forEach(t=>{const c=CM[t.category]||CM["기타"];
    sh.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`}},
      h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},t.merchant||t.category||t.type),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.account} · ${t.category}`)),
      h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:C.ink,whiteSpace:"nowrap"}},"−"+W(t.amount).slice(1))));
  });
  ov.append(sh);document.body.append(ov);
}
function showDayDetail(dateStr,txns,fcs){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"50"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px",padding:"18px 20px 26px",maxHeight:"85vh",overflowY:"auto"}});
  const[,mo,d]=dateStr.split("-");
  const spend=txns.filter(t=>kindOf(t.type)==="spend"&&!isInternalTransfer(t)).reduce((s,t)=>s+Number(t.amount),0);
  const income=txns.filter(t=>["income","reduce"].includes(kindOf(t.type))&&!isInternalTransfer(t)).reduce((s,t)=>s+Number(t.amount),0);
  const reloadCal=async()=>{await loadMonth();ov.remove();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildCalendarView().forEach(n=>ct.append(n));}};

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px"}},
      h("div",{},
        h("div",{style:{fontSize:"18px",fontWeight:"800"}},`${Number(mo)}월 ${Number(d)}일`),
        h("div",{style:{display:"flex",gap:"12px",marginTop:"4px"}},
          spend>0?h("span",{class:"num",style:{fontSize:"12.5px",color:C.over,fontWeight:"700"}},"−"+W(spend).slice(1)):"",
          income>0?h("span",{class:"num",style:{fontSize:"12.5px",color:C.brand,fontWeight:"700"}},"+"+W(income).slice(1)):""
        )
      ),
      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    h("div",{style:{fontSize:"11.5px",color:C.faint,marginBottom:"10px",textAlign:"right"}},"탭하면 수정")
  );
  const memoWrap=h("div",{style:{background:"#FFFBF0",border:"1px solid #EAD9A8",borderRadius:"12px",padding:"12px 14px",marginBottom:"12px"}});
  const renderMemo=()=>{
    memoWrap.innerHTML="";
    const mtext=getDayMemos()[dateStr]||"";
    memoWrap.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:mtext?"7px":"0"}},
      h("span",{style:{fontSize:"12px",fontWeight:"800",color:"#A8842C"}},"📝 이 날의 메모"),
      h("button",{style:{fontSize:"11.5px",color:C.brand,fontWeight:"700",background:"transparent",border:"none",cursor:"pointer"},onclick:()=>{const v=prompt("이 날의 메모 (특별한 일·월급 등):",mtext);if(v===null)return;const mm=getDayMemos();const tt=v.trim();if(tt)mm[dateStr]=tt;else delete mm[dateStr];setDayMemos(mm);renderMemo();}},mtext?"수정":"＋ 추가")));
    if(mtext)memoWrap.append(h("div",{style:{fontSize:"13px",color:C.ink,lineHeight:"1.6",whiteSpace:"pre-wrap"}},mtext));
  };
  renderMemo();sh.append(memoWrap);
  if(fcs&&fcs.length){
    const fcTotal=fcs.reduce((a,fc)=>a+Number(fc.amount||fc.expected_amount||0),0);
    const fcBox=h("div",{style:{background:"#F4F0FB",border:"1px solid #C9B8E8",borderRadius:"12px",padding:"12px 14px",marginBottom:"12px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"7px"}},
        h("span",{style:{fontSize:"12px",fontWeight:"800",color:"#7A5BC0"}},"📌 이 날 빠지는 고정비"),
        h("span",{class:"num",style:{fontSize:"12px",fontWeight:"800",color:"#7A5BC0"}},W(fcTotal))));
    fcs.forEach(fc=>fcBox.append(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:"12.5px"}},
      h("span",{style:{color:C.ink}},fc.name),
      h("span",{class:"num",style:{fontWeight:"700",color:C.ink}},W(Number(fc.amount||fc.expected_amount||0))))));
    sh.append(fcBox);
  }

  txns.sort((a,b)=>Number(b.amount)-Number(a.amount)).forEach(t=>{
    const c=CM[t.category]||CM["기타"],k=kindOf(t.type);
    const sg=isInternalTransfer(t)?"⇄ ":k==="income"||k==="reduce"?"+":k==="spend"?"−":"";
    const cl=isInternalTransfer(t)?C.faint:k==="income"||k==="reduce"?C.brand:C.ink;
    sh.append(h("div",{
      style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .1s",borderRadius:"4px"},
      onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
      onmouseleave:e=>{e.currentTarget.style.background="transparent";},
      onclick:()=>showEditTxn(t,reloadCal)
    },
      h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${t.account} · ${t.category}${t.memo?" · "+t.memo:""}`)
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
        h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`),
        h("span",{style:{fontSize:"12px",color:C.faint}},"›")
      )
    ));
  });
  ov.append(sh);document.body.append(ov);
}

// ── 다음 달 카드 대금 예측 ──
// 실제 카드 청구 확정 (예상값 프리필 → 숫자만 고쳐 저장)
function getRevolving(pm,ym2){try{return JSON.parse(localStorage.getItem("revolving:"+pm+":"+ym2)||"null");}catch{return null;}}
function setRevolving(pm,ym2,v){try{if(v)localStorage.setItem("revolving:"+pm+":"+ym2,JSON.stringify(v));else localStorage.removeItem("revolving:"+pm+":"+ym2);}catch{}}
function showBillConfirm(pm,estAmt,bym,onDone){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.45)",display:"flex",alignItems:"center",justifyContent:"center",padding:"18px",zIndex:"70"}});
  const inp={width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"12px",fontSize:"15px",marginBottom:"9px"};
  const amtEl=h("input",{type:"number",value:estAmt||"",style:{...inp,fontWeight:"800"}});
  const defDate=ym(td())===bym?td():bym+"-15";
  const dtEl2=h("input",{type:"date",value:defDate,style:inp});
  // 리볼빙 이월 옵션
  let revOn=false;
  const carryEl=h("input",{type:"number",placeholder:"다음 달로 넘긴 금액(이월)",style:{...inp,marginBottom:"4px"}});
  const revWrap=h("div",{style:{display:"none",background:"#FFF6E8",borderRadius:"10px",padding:"11px 12px",marginBottom:"9px"}},
    h("div",{style:{fontSize:"11px",color:"#9A6B00",marginBottom:"7px",lineHeight:"1.55"}},"이번 달 실제로 낸 금액은 위에, 다음 달로 넘긴 금액은 아래에 적어요. 이월분은 다음 달 청구에 참고로 표시돼요."),
    carryEl);
  const revToggle=h("button",{style:{width:"100%",fontSize:"12.5px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer",marginBottom:"9px"},onclick:()=>{revOn=!revOn;revWrap.style.display=revOn?"block":"none";revToggle.textContent=revOn?"🔄 리볼빙 이월 사용 중 (끄기)":"🔄 리볼빙으로 일부 이월했어요";revToggle.style.background=revOn?"#FFF6E8":C.w;revToggle.style.color=revOn?"#9A6B00":C.sub;if(revOn)setTimeout(()=>carryEl.focus(),50);}},"🔄 리볼빙으로 일부 이월했어요");
  const save=async()=>{
    const a=Number(amtEl.value)||0;if(!a){amtEl.focus();return;}
    const carry=revOn?(Number(carryEl.value)||0):0;
    const memo=carry>0?`${yml(bym)} 청구 확정 · 🔄리볼빙 이월 ${W(carry)}`:`${yml(bym)} 청구 확정`;
    const{error}=await sb.from("transactions").insert({user_id:S.session.user.id,date:dtEl2.value,account:"개인",type:"카드대금",amount:a,category:"금융/이체",merchant:pm,memo,payment_method:pm});
    if(error){toast("저장 실패: "+error.message,false);return;}
    // 이월분 → 다음 청구월에 참고 기록
    if(carry>0){const nextYm=shYm(bym,1);setRevolving(pm,nextYm,{amount:carry,from:bym});}
    else setRevolving(pm,bym,null);
    ov.remove();await loadMonth();
    toast(carry>0?`✓ ${pm} 청구 ${W(a)} 확정 · 🔄이월 ${W(carry)}`:`✓ ${pm} ${yml(bym)} 청구 ${W(a)} 확정!`);
    if(onDone)onDone();
  };
  // 이 청구월에 지난달에서 넘어온 이월분 안내
  const carryIn=getRevolving(pm,bym);
  const sh=h("div",{style:{width:"100%",maxWidth:"400px",background:C.w,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"}},
      h("span",{style:{fontSize:"15px",fontWeight:"800"}},`💳 ${pm} · ${yml(bym)} 실제 청구`),
      h("button",{style:{fontSize:"20px",color:C.sub,background:"transparent",border:"none",cursor:"pointer"},onclick:()=>ov.remove()},"✕")),
    carryIn&&carryIn.amount>0?h("div",{style:{fontSize:"11.5px",color:"#9A6B00",background:"#FFF6E8",borderRadius:"9px",padding:"9px 11px",marginBottom:"9px",lineHeight:"1.55"}},`🔄 지난달(${yml(carryIn.from)})에서 이월된 ${W(carryIn.amount)}이 이번 청구에 더해졌을 수 있어요.`):"",
    h("div",{style:{fontSize:"11.5px",color:C.sub,marginBottom:"8px",lineHeight:"1.6"}},`예상 ${W(estAmt)}이 미리 들어있어요. 명세서 보고 실제 낸 금액으로 고쳐서 확정하세요.`),
    h("div",{style:{fontSize:"10.5px",fontWeight:"700",color:C.sub,marginBottom:"4px"}},"이번 달 실제 청구액(낸 돈)"),
    amtEl,
    h("div",{style:{fontSize:"10.5px",fontWeight:"700",color:C.sub,marginBottom:"4px"}},"결제일"),
    dtEl2,
    revToggle,revWrap,
    h("button",{style:{width:"100%",fontSize:"14px",fontWeight:"800",padding:"13px",borderRadius:"12px",border:"none",background:C.brand,color:"#fff",cursor:"pointer"},onclick:save},"✓ 청구 확정 저장"));
  ov.append(sh);document.body.append(ov);setTimeout(()=>{amtEl.focus();if(amtEl.select)amtEl.select();},60);
}
function buildNextMonthBill(){
  // 보고 있는 청구월 (기본=다음 달). 카드 안에서 ‹ › 로 바꿀 수 있음
  if(!S.billYm)S.billYm=shYm(S.curYm,1);
  const isCardPm=pm=>isCreditCard(pm); // 신용카드만 청구 대상

  // 청구월 카드 합산 = (전월 사용분: 일시불+할부 그 달 찍힌 것) + (당월 날짜 할부 분할분)
  // 데이터를 비동기로 가져오므로 빈 카드 먼저 만들고 채움
  const wrap=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"16px",padding:"16px 18px",marginTop:"12px"}});
  const body=h("div",{});
  wrap.append(body);
  const render=async()=>{
    const bym=S.billYm;
    const useYm=shYm(bym,-1);               // 이 청구월에 청구될 "사용분"은 전월
    const[us,ue]=mRange(useYm);             // 전월 범위 (사용분)
    const[bs,be]=mRange(bym);               // 당월 범위 (할부 분할분 등)
    body.innerHTML="";
    body.append(h("div",{class:"center"},h("div",{class:"spin"})));
    // 두 구간 거래 로드 + 공용 할부통합 건(산 날 전액 1건)은 청구에서만 가상 회차로 분할
    let useTx=[],billTx=[],actualTx=[],lumpTx=[];
    try{
      const[a,b,l]=await Promise.all([
        sb.from("transactions").select("amount,type,payment_method,merchant,date,installment_no,installment_total,category,account").gte("date",us).lte("date",ue),
        sb.from("transactions").select("amount,type,payment_method,merchant,date,installment_no,installment_total,category,account").gte("date",bs).lte("date",be),
        sb.from("transactions").select("amount,type,payment_method,merchant,date,category,account,memo").ilike("memo","%#할부통합%").gte("date",shYm(bym,-25)+"-01")
      ]);
      const isLump=t=>/#할부통합/.test(t.memo||"");
      useTx=(a.data||[]).filter(t=>["소비(일시불)","소비(할부)"].includes(t.type)&&isCardPm(t.payment_method)&&!isLump(t));
      // 당월에 찍힌 할부 분할분만 (일시불 중복 방지: 당월 사용분은 '다음달' 청구라 여기선 제외)
      billTx=(b.data||[]).filter(t=>t.type==="소비(할부)"&&isCardPm(t.payment_method));
      actualTx=(b.data||[]).filter(t=>t.type==="카드대금");
      // 할부통합: 구매월 기준 k회차(1..N)가 이 청구월에 해당하면 원금/N 만큼 반영
      const mDiff=(y1,y2)=>{const[a1,b1]=y1.split("-").map(Number),[a2,b2]=y2.split("-").map(Number);return (a1-a2)*12+(b1-b2);};
      (l.data||[]).forEach(t=>{
        if(!isCardPm(t.payment_method))return;
        const n=Math.max(2,Number(((t.memo||"").match(/(\d+)개월\s*할부/)||[])[1])||3); // 회차수 (메모에 없으면 3)
        const k=mDiff(bym,ym(t.date||""));
        if(k>=1&&k<=n){
          const per=Math.round(Number(t.amount)/n);
          lumpTx.push({...t,amount:per,installment_no:k,installment_total:n,merchant:(t.merchant||"")+"",type:"소비(할부)"});
        }
      });
    }catch(e){dlog("[청구로드실패]",e);}

    // 합산: 전월 사용분 전체 + 당월 할부분 + 할부통합 가상회차
    const all=[...useTx,...billTx,...lumpTx];
    const amtOf=t=>(Number(t.amount)||0)*accountShare(t.payment_method); // 공용은 절반만 내 청구
    const total=all.reduce((x,t)=>x+amtOf(t),0);
    const byCard={};
    // 카드사 단위로 그룹핑 (세부 카드는 subs에 보관 → 상세에서 카드별 탭)
    all.forEach(t=>{const raw=t.payment_method||"기타";const pm=cardGroupOf(raw);const g=byCard[pm]||(byCard[pm]={total:0,cnt:0,installCnt:0,tx:[],shared:false,subs:{}});g.total+=amtOf(t);g.cnt++;if(t.installment_total)g.installCnt++;g.tx.push(t);g.subs[raw]=(g.subs[raw]||0)+amtOf(t);if(/공용/.test(raw))g.shared=true;});
    const rows=Object.entries(byCard).sort((a,b)=>b[1].total-a[1].total);
    const byActual={};actualTx.forEach(t=>{const k=(t.merchant||"").trim();if(k)byActual[k]=(byActual[k]||0)+(Number(t.amount)||0);});
    const actualFor=(pm,d)=>{let s2=0;const names=[pm,...(d?Object.keys(d.subs):[])];Object.entries(byActual).forEach(([k,v])=>{if(names.some(n=>n.includes(k)||k.includes(n)))s2+=v;});return s2;};

    body.innerHTML="";
    // 헤더 + 월 네비
    const isNext=bym===shYm(S.curYm,1);
    const nav=h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:"3px",background:"#F6F4EF",borderRadius:"999px",padding:"3px 4px"}},
        h("button",{style:{width:"26px",height:"26px",borderRadius:"999px",color:C.sub,fontSize:"15px",cursor:"pointer",background:"transparent",border:"none"},onclick:()=>{S.billYm=shYm(bym,-1);render();}},"‹"),
        h("button",{style:{fontSize:"13px",fontWeight:"800",color:C.ink,padding:"2px 8px",background:"transparent",border:"none",cursor:"pointer"},onclick:()=>{S.billYm=shYm(S.curYm,1);render();}},`💳 ${yml(bym)} 청구`),
        h("button",{style:{width:"26px",height:"26px",borderRadius:"999px",color:C.sub,fontSize:"15px",cursor:"pointer",background:"transparent",border:"none"},onclick:()=>{S.billYm=shYm(bym,1);render();}},"›")),
      h("span",{style:{fontSize:"10.5px",color:C.faint}},isNext?"예상 · 할부반영":"청구 내역"));
    body.append(nav);
    body.append(h("div",{style:{fontSize:"10.5px",color:C.faint,marginBottom:"10px"}},`${yml(useYm)} 사용분 + ${yml(bym)} 할부분`));

    if(!rows.length){
      body.append(empty(`${yml(bym)}에 청구될 카드 사용 내역이 없어요.`));
      return;
    }
    body.append(h("div",{class:"num",style:{fontSize:"26px",fontWeight:"800",marginBottom:"14px",letterSpacing:"-.03em"}},W(total)));
    const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});
    rows.forEach(([pm,d])=>{
      const act=actualFor(pm,d);
      const confirmed=act>0;
      const diffV=confirmed?act-d.total:0;
      const near=confirmed&&Math.abs(diffV)<=Math.max(act,d.total)*0.05;
      const subKeys=Object.keys(d.subs);
      const wrapR=h("div",{style:{padding:"11px 13px",borderRadius:"11px",background:"#F6F4EF",cursor:"pointer"},onclick:()=>{if(subKeys.length>1)showCardGroupSheet(pm,d,bym,render);else showCardStatement(subKeys[0]||pm,{bym,estimate:d.total,onConfirmed:render});}});
      wrapR.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
        h("div",{style:{minWidth:"0"}},
          h("div",{style:{fontSize:"13.5px",fontWeight:"700",display:"flex",alignItems:"center",gap:"6px"}},pm,
            confirmed?h("span",{title:near?"실제 청구가 예상과 거의 같아요":"예상과 실제 청구가 달라요. 할부 이월·연회비·마감일 차이 등 자연스러운 차이일 수 있어요. 소비 내역을 실제와 맞추면 예상이 정확해져요.",style:{fontSize:"10px",fontWeight:"800",color:near?C.brand:C.warn,background:near?"#EAF4EE":"#FBF3E2",borderRadius:"6px",padding:"2px 6px",cursor:"help"}},near?"✓ 확정":"✓ 확정(차이)"):""),
          h("div",{style:{fontSize:"11px",color:C.sub,marginTop:"2px"}},`${d.cnt}건${d.installCnt?` (할부 ${d.installCnt})`:""}${subKeys.length>1?` · 카드 ${subKeys.length}개 합침`:""}${d.shared?" · 공용 50%":""}${(getRevolving(pm,bym)&&getRevolving(pm,bym).amount>0)?" · 🔄이월분 있음":""} · 명세 ›`)),
        h("div",{style:{textAlign:"right",flexShrink:"0"}},
          h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"800"}},W(confirmed?act:d.total)),
          confirmed&&!near?h("div",{class:"num",style:{fontSize:"10.5px",color:C.sub,marginTop:"1px"}},`예상 ${W(d.total)}`):(!confirmed?h("div",{style:{fontSize:"10px",color:C.faint,marginTop:"1px"}},"예상"):""))));
      list.append(wrapR);
    });
    body.append(list);
    const actAll=Object.values(byActual).reduce((a2,b2)=>a2+b2,0);
    if(actAll>0){
      // 확정된 카드들의 '예상액'만 합산해서 비교 (전체total과 비교하면 미확정분 때문에 왜곡)
      let estOfConfirmed=0,confirmedCnt=0;
      rows.forEach(([pm,d])=>{if(actualFor(pm,d)>0){estOfConfirmed+=d.total;confirmedCnt++;}});
      const dA=actAll-estOfConfirmed;
      const near=Math.abs(dA)<=Math.max(actAll,estOfConfirmed)*0.05;
      body.append(h("div",{style:{marginTop:"10px",padding:"10px 12px",borderRadius:"10px",background:near?"#EEF6F1":"#F6F4EF"}},
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"12px",fontWeight:"700"}},
          h("span",{style:{color:C.sub}},`확정 ${confirmedCnt}개 실제 청구 합계`),
          h("span",{class:"num"},W(actAll))),
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"10.5px",color:C.faint,marginTop:"3px"}},
          h("span",{},`같은 카드 예상 ${W(estOfConfirmed)}`),
          h("span",{class:"num",style:{color:near?C.brand:C.over,fontWeight:"700"}},near?"거의 일치 ✓":`차이 ${dA>=0?"+":"−"}${W(Math.abs(dA)).slice(1)}`))));
    }
    body.append(h("div",{style:{display:"flex",gap:"8px",marginTop:"12px"}},
      h("button",{style:{flex:"1",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"11px",border:`1px solid ${C.line}`,background:C.w,color:C.ink,cursor:"pointer"},onclick:()=>showBillCapture()},"📷 실제 카드대금 입력"),
      h("button",{style:{fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"11px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer"},onclick:()=>showApiKeySetting()},"⚙️")));
    {const insts=(S.txns||[]).filter(t=>t.installment_total);
     const cardNm=new Set((S.accounts||[]).filter(a=>a.kind==="카드"&&a.billing_day).map(a=>a.name));
     const pending=insts.filter(t=>!cardNm.has(t.payment_method||"")).length; // 플랫폼 등 수동 필요
     if(insts.length>0)body.append(h("button",{style:{width:"100%",marginTop:"10px",fontSize:"12.5px",fontWeight:"700",padding:"11px",borderRadius:"11px",border:`1px solid ${pending>0?C.warn:C.brand}`,background:pending>0?"#FFFBEE":"#EEF6F1",color:pending>0?C.warn:C.brand,cursor:"pointer"},onclick:()=>showBillDateSort()},
       pending>0?`🗓️ 카드 지정 필요한 할부 ${pending}건 (탭해서 카드 선택)`:`🗓️ 할부 날짜 정렬 (자동 정렬됨 ✓)`));}
    body.append(h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"8px",lineHeight:"1.6"}},
      `전월 사용분이 이 달에 청구되는 구조예요. 카드사 마감일에 따라 일부는 다음 달로 넘어갈 수 있어요. 카드를 탭하면 지난 명세도 볼 수 있어요.`));
  };
  render();
  return wrap;
}

// 카드 그룹 상세: 세부 카드별 탭 + 그룹 관리 (합치기/분리)

  const drawBody=()=>{

    txs.forEach(t=>{const c=CM[t.category]||CM["기타"];
      body.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"9px 2px",borderBottom:`1px solid ${C.line}`}},
        h("span",{style:{fontSize:"15px"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"13px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},t.merchant||t.category),
          h("div",{style:{fontSize:"10.5px",color:C.sub}},`${(t.date||"").slice(5)}${t.installment_total?` · 할부 ${t.installment_no}/${t.installment_total}`:""}${selSub==="__all"?` · ${t.payment_method||""}`:""}`)),
        h("span",{class:"num",style:{fontSize:"13px",fontWeight:"700"}},W((Number(t.amount)||0)*accountShare(t.payment_method)))));
    });
    // 🔧 그룹 관리
    const mng=h("div",{style:{marginTop:"14px",background:"#F6F4EF",borderRadius:"12px",padding:"12px 13px"}});
    mng.append(h("div",{style:{fontSize:"11.5px",fontWeight:"800",color:C.sub,marginBottom:"8px"}},"🔧 카드 그룹 관리 — 세부 카드를 다른 그룹으로 옮기거나 분리해요"));
    subs.forEach(s=>{
      const sel=h("select",{style:{fontSize:"11.5px",border:`1px solid ${C.line}`,borderRadius:"8px",padding:"5px 6px",background:C.w,maxWidth:"150px"}});
      const groups=[...new Set([grp,s,"롯데카드","삼성카드","KB국민카드","현대카드","우리카드","신한카드","하나카드"])];
      groups.forEach(g2=>{const o=h("option",{value:g2},g2===s?`${g2} (따로 보기)`:g2);if(cardGroupOf(s)===g2)o.selected=true;sel.append(o);});
      sel.append(h("option",{value:"__new"},"➕ 새 그룹명…"));

// 카드별 월간 명세서 (과거 청구 이력)
function showCardStatement(pm,opt){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"55"}});
