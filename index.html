// 가맹점명으로 카테고리 자동 추론
function autoClassify(merchant){
  if(!merchant)return null;
  const m=merchant.trim();
  const rules=allRules();
  // 키워드 길이 긴 순으로 매칭 (더 구체적인 규칙 우선)
  const keys=Object.keys(rules).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    if(m.includes(k)||k.includes(m.split("(")[0].split("*")[0].trim())){
      return rules[k];
    }
  }
  return null;
}

async function imgToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({b64:r.result.split(",")[1],mime:file.type||"image/jpeg"});
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function claudeVision(file,prompt){
  const key=getApiKey();
  if(!key)throw new Error("no_key");
  const{b64,mime}=await imgToB64(file);
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:mime,data:b64}},
      {type:"text",text:prompt}
    ]}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  const data=await resp.json();
  let txt=data.content?.find(c=>c.type==="text")?.text||"{}";
  console.log("[AI원본응답]",txt);
  const _a=txt.indexOf("{"),_b=txt.lastIndexOf("}");
  if(_a>=0&&_b>_a)txt=txt.slice(_a,_b+1);
  txt=txt.replace(/(\d),(?=\d)/g,"$1");
  try{const _o=JSON.parse(txt);console.log("[AI결과]",_o);return _o;}
  catch(err){console.log("[AI파싱실패]",err,txt);return{_raw:txt};}
}
async function claudeVisionMulti(files,prompt){
  const key=getApiKey();
  if(!key)throw new Error("no_key");
  const imgs=[];
  for(const f of files){const{b64,mime}=await imgToB64(f);imgs.push({type:"image",source:{type:"base64",media_type:mime,data:b64}});}
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:[...imgs,{type:"text",text:prompt}]}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  const data=await resp.json();
  let txt=data.content?.find(c=>c.type==="text")?.text||"{}";
  console.log("[AI원본응답-멀티]",txt);
  const _a=txt.indexOf("{"),_b=txt.lastIndexOf("}");
  if(_a>=0&&_b>_a)txt=txt.slice(_a,_b+1);
  txt=txt.replace(/(\d),(?=\d)/g,"$1");
  try{const _o=JSON.parse(txt);console.log("[AI결과-멀티]",_o);return _o;}
  catch(err){console.log("[AI파싱실패-멀티]",err,txt);return{_raw:txt};}
}

async function fetchFxRate(){
  // 환율 전용 무료 API (CORS 허용, 키 불필요)
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const d=await r.json();
    const krw=d?.rates?.KRW;
    if(krw)return{price:krw,currency:"KRW",name:"USD/KRW",ticker:"USDKRW=X"};
  }catch{}
  return null;
}
async function fetchPrice(ticker){
  if(ticker==="USDKRW=X")return await fetchFxRate();
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`,{mode:"cors"});
    const d=await r.json();
    const m=d.chart?.result?.[0]?.meta;
    if(!m)return null;
    return{price:m.regularMarketPrice,currency:m.currency,name:m.shortName||ticker,ticker};
  }catch{return null;}
}

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(p)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{if(k==null||k===false)return;e.append(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);});
  return e;
}

// ── STATS ──
function calcStatsFor(txns){
  let pS=0,pR=0,cS=0,cR=0,inc=0,sav=0;
  for(const t of txns){
    const k=kindOf(t.type),a=Number(t.amount)||0;
    // 공용 우선: account가 공용이거나, 공용통장/공용카드로 결제했으면 공용으로 집계
    const isShared=t.account==="공용"||t.payment_method==="공용통장"||t.payment_method==="공용카드"||t.payment_method==="공용통장 자동출금"||t.payment_method==="공용통장 지로출금";
    if(isShared){if(k==="spend")cS+=a;else if(k==="reduce")cR+=a;}
    else{if(k==="spend")pS+=a;else if(k==="reduce")pR+=a;}
    if(k==="income")inc+=a;if(k==="save")sav+=a;
  }
  return{pNet:pS-pR,cNet:cS-cR,income:inc,save:sav,balance:inc-(pS-pR)-(cS-cR)-sav};
}

// ── 월간 인사이트 (말로 된 분석) ──
function buildInsight(st,prevSt){
  const insights=[];
  const cur=st.pNet,prev=prevSt.pNet;

  // 1. 전월 대비 개인소비
  if(prev>0){
    const diff=cur-prev,pct=Math.round(Math.abs(diff)/prev*100);
    if(Math.abs(pct)>=10){
      if(diff>0)insights.push({icon:"📈",tone:"warn",text:`개인 소비가 지난달보다 ${pct}% 늘었어요 (${W(Math.abs(diff))} 증가)`});
      else insights.push({icon:"📉",tone:"good",text:`개인 소비가 지난달보다 ${pct}% 줄었어요 (${W(Math.abs(diff))} 절약). 잘하고 있어요!`});
    }else{
      insights.push({icon:"➡️",tone:"neutral",text:`개인 소비가 지난달과 비슷해요 (${W(cur)})`});
    }
  }

  // 2. 카테고리 TOP + 비중
  const cagg={};
  for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;cagg[t.category]=(cagg[t.category]||0)+(Number(t.amount)||0);}
  const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]);
  if(crows.length){
    const[topCat,topAmt]=crows[0];
    const pct=cur>0?Math.round(topAmt/cur*100):0;
    const c=CM[topCat]||CM["기타"];
    insights.push({icon:c.i,tone:"neutral",text:`이번 달 가장 많이 쓴 곳은 ${topCat} (${W(topAmt)}, 전체의 ${pct}%)`});
  }

  // 3. 카테고리별 전월 대비 급증 감지
  const prevCagg={};
  for(const t of S.prevTxns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;prevCagg[t.category]=(prevCagg[t.category]||0)+(Number(t.amount)||0);}
  let maxJump=null;
  for(const[cat,amt] of crows){
    const pAmt=prevCagg[cat]||0;
    if(pAmt>10000&&amt>pAmt*1.5){
      const jump=amt-pAmt;
      if(!maxJump||jump>maxJump.jump)maxJump={cat,jump,amt,pAmt};
    }
  }
  if(maxJump){
    const c=CM[maxJump.cat]||CM["기타"];
    insights.push({icon:"⚠️",tone:"warn",text:`${maxJump.cat} 지출이 지난달의 ${Math.round(maxJump.amt/maxJump.pAmt*10)/10}배로 늘었어요 (${W(maxJump.pAmt)}→${W(maxJump.amt)})`});
  }

  // 4. 수입 대비 지출
  if(st.income>0){
    const rate=Math.round((cur+st.cNet)/st.income*100);
    if(rate>100)insights.push({icon:"🔴",tone:"warn",text:`이번 달 수입보다 지출이 많아요 (지출이 수입의 ${rate}%)`});
    else if(rate<=60)insights.push({icon:"💰",tone:"good",text:`수입의 ${rate}%만 썼어요. 저축 여력이 좋아요!`});
  }

  // 5. 예산 경고
  if(S.budget>0){
    const used=cur/S.budget;
    const isCur=S.curYm===ym(td());
    const dl=isCur?new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate():0;
    if(used>=1)insights.push({icon:"🚨",tone:"warn",text:`예산을 ${W(cur-S.budget)} 초과했어요`});
    else if(used>=0.8&&dl>5)insights.push({icon:"⏰",tone:"warn",text:`예산의 ${Math.round(used*100)}%를 썼는데 아직 ${dl}일 남았어요. 페이스 조절이 필요해요`});
  }

  if(!insights.length)return null;

  const el=sec("💡 이번 달 인사이트","");
  const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"9px"}});
  const toneColor={good:C.brand,warn:C.over,neutral:C.sub};
  const toneBg={good:"#EDFBF4",warn:"#FFF4F1",neutral:"#F6F4EF"};
  insights.forEach(ins=>{
    list.append(h("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:toneBg[ins.tone]||"#F6F4EF"}},
      h("span",{style:{fontSize:"15px",flexShrink:"0"}},ins.icon),
      h("span",{style:{fontSize:"13px",lineHeight:"1.5",color:C.ink}},ins.text)
    ));
  });
  el.append(list);
  return el;
}

  );

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px"}});
  
  // 시작 오프셋 (월요일 기준)
  const offset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<offset;i++)grid.append(h("div",{}));

  for(let d=1;d<=lastDate;d++){
    const dateStr=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const data=byDate[dateStr]||null;
    const isToday=dateStr===todayStr;
    const dow=(offset+d-1)%7;
    const isSun=dow===6,isSat=dow===5;

    const cell=h("div",{
      style:{
        padding:"3px 2px",borderRadius:"8px",textAlign:"center",
        cursor:data?"pointer":"default",
        background:isToday?C.brand:"transparent",
        minHeight:"55px",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"flex-start",gap:"2px"
      },
      onclick:data?()=>showDayDetail(dateStr,data.txns):null
    },
      h("div",{style:{
        fontSize:"13px",fontWeight:isToday?"800":"500",lineHeight:"1.6",
        color:isToday?C.w:isSun?"#B23A5C":isSat?"#4169B1":C.ink
      }},d),
      data&&data.spend>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.over,lineHeight:"1.2",fontWeight:"600"}},"-"+shortNum(data.spend)):"",
      data&&data.income>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.brand,lineHeight:"1.2",fontWeight:"600"}},"+"+shortNum(data.income)):""
    );
    if(!isToday&&data){
      cell.addEventListener("mouseenter",e=>{e.currentTarget.style.background="#F0EDE5";});
      cell.addEventListener("mouseleave",e=>{e.currentTarget.style.background="transparent";});
    }
    grid.append(cell);
  }
  cal.append(hdr,grid);

  // 범례
  const legend=h("div",{style:{display:"flex",gap:"16px",justifyContent:"center",marginTop:"10px",fontSize:"11.5px",color:C.sub}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.over,fontWeight:"700"}},"-"),"지출"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.brand,fontWeight:"700"}},"+"),"수입"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{background:C.brand,width:"10px",height:"10px",borderRadius:"50%",display:"inline-block"}}),"오늘")
  );

  return[summary,cal,legend];
}

  txns.sort((a,b)=>Number(b.amount)-Number(a.amount)).forEach(t=>{

      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${t.account} · ${t.category}${t.memo?" · "+t.memo:""}`)
      ),

// ── 다음 달 카드 대금 예측 ──
function buildNextMonthBill(){
  const nym=shYm(S.curYm,1);
  const txns=S.nextTxns.filter(t=>["소비(일시불)","소비(할부)"].includes(t.type));
  if(!txns.length)return null;
  const total=txns.reduce((s,t)=>s+Number(t.amount),0);
  // 카드사별 집계
  const byCard={};
  txns.forEach(t=>{
    const pm=t.payment_method||"기타";

  const rows=Object.entries(byCard).sort((a,b)=>b[1].total-a[1].total);

    h("div",{class:"num",style:{fontSize:"26px",fontWeight:"800",marginBottom:"14px",letterSpacing:"-.03em"}},W(total)),

      ...rows.map(([pm,d])=>h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",borderRadius:"10px",background:"#F6F4EF"}},
        h("div",{},
          h("div",{style:{fontSize:"13px",fontWeight:"600"}},pm||"기타"),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},`${d.cnt}건${d.installCnt?` (할부 ${d.installCnt}건 포함)`:""}`)
        ),
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(d.total))
      ))
    ),
    h("div",{style:{display:"flex",gap:"8px",marginTop:"12px"}},
      h("button",{
        style:{flex:"1",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"11px",border:`1px solid ${C.line}`,background:C.w,color:C.ink,cursor:"pointer"},
        onclick:()=>showBillCapture()
      },"📷 실제 카드대금 입력"),

        style:{fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"11px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer"},

// ── 연간 막대 차트 ──
function barChart(data,hl){
  const max=Math.max(...data,1);
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:"4px",height:"110px"}},
    ...data.map((v,i)=>{
      const pct=v>0?Math.max((v/max)*100,4):0;
      const isHL=i===hl;
      return h("div",{style:{flex:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",gap:"5px",height:"100%"}},
        v>0
          ?h("div",{style:{width:"100%",height:pct+"%",background:isHL?C.brand:C.brand+"55",borderRadius:"3px 3px 0 0",minHeight:"3px",transition:"height .4s"}})
          :h("div",{style:{width:"100%",height:"2px",background:C.line,borderRadius:"1px"}}),
        h("div",{style:{fontSize:"9.5px",color:isHL?C.ink:C.faint,fontWeight:isHL?"800":"400",lineHeight:"1"}},String(i+1))
      );
    })
  );
}

// ── 연간 탭 ──
function buildYearly(){
  const yr=S.curYm.slice(0,4);
  const curM=parseInt(S.curYm.split("-")[1])-1;
  let mode="개인소비"; // 개인소비 | 공용소비 | 수입

  const kindForMode=m=>({"개인소비":"spend","공용소비":"spend","수입":"income"})[m];
  const accForMode=m=>({"개인소비":"개인","공용소비":"공용","수입":null})[m];

  const getMonthly=()=>{
    const arr=Array(12).fill(0);
    const kind=kindForMode(mode),acc=accForMode(mode);
    for(const t of S.yearTxns){
      if(kindOf(t.type)!==kind)continue;
      if(acc&&t.account!==acc)continue;
      const m=parseInt(t.date.slice(5,7))-1;
      if(m>=0&&m<12)arr[m]+=Number(t.amount)||0;
    }
    return arr;
  };

  const container=h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}});
  const draw=()=>{
    container.innerHTML="";
    const monthly=getMonthly();
    const total=monthly.reduce((s,v)=>s+v,0);
    const avg=monthly.filter(v=>v>0).length?Math.round(total/monthly.filter(v=>v>0).length):0;
    const maxM=monthly.indexOf(Math.max(...monthly));

    // 헤더 카드
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"18px 18px 14px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px"}},
        h("div",{},
          h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"4px"}},yr+"년 "+mode+" 합계"),
          h("div",{class:"num",style:{fontSize:"28px",fontWeight:"800",letterSpacing:"-.03em"}},W(total))
        ),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:"11.5px",color:C.sub}},"월평균"),
          h("div",{class:"num",style:{fontSize:"16px",fontWeight:"700",marginTop:"3px"}},W(avg))
        )
      ),
      barChart(monthly,curM),
      h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"10px",textAlign:"center"}},
        maxM>=0&&monthly[maxM]>0?`최대 지출: ${maxM+1}월 (${W(monthly[maxM])})`:""
      )
    ));

    // 모드 토글
    const toggleRow=h("div",{style:{display:"flex",gap:"8px"}});
    ["개인소비","공용소비","수입"].forEach(m=>{
      const sel=mode===m;
      toggleRow.append(h("button",{
        style:{flex:"1",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${sel?C.ink:C.line}`,background:sel?C.ink:C.w,color:sel?C.w:C.sub,cursor:"pointer"},
        onclick:()=>{mode=m;draw();}
      },m));
    });
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"14px",padding:"14px"}},toggleRow));

    // 월별 리스트
    const listSec=sec("월별 내역","");
    const listEl=h("div",{style:{display:"flex",flexDirection:"column",gap:"2px"}});
    monthly.forEach((v,i)=>{
      if(v===0&&i>curM)return;
      const isHL=i===curM;
      listEl.append(h("div",{
        style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 4px",borderBottom:`1px solid ${C.line}`,background:isHL?C.soft:"transparent",borderRadius:isHL?"6px":"0",paddingLeft:isHL?"8px":"4px"}},
        h("span",{style:{fontSize:"13px",color:isHL?C.brand:C.ink,fontWeight:isHL?"700":"400"}},(i+1)+"월"+(isHL?" (이번달)":"")),
        h("span",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:v>0?(isHL?C.brand:C.ink):C.faint}},v>0?W(v):"—")
      ));
    });
    listSec.append(listEl);
    container.append(listSec);

    // 카테고리 연간 순위 (개인소비만)
    if(mode==="개인소비"){
      const cagg={};
      for(const t of S.yearTxns){
        if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;
        cagg[t.category]=(cagg[t.category]||0)+Number(t.amount);
      }
      const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(crows.length){
        const cSec=sec(yr+"년 지출 TOP 카테고리","");
        const cmax=crows[0][1];
        crows.forEach(([n,v])=>{
          const c=CM[n]||CM["기타"];
          cSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 4px"}},
            h("span",{style:{fontSize:"14px",width:"20px",textAlign:"center"}},c.i),
            h("div",{style:{flex:"1"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}},
                h("span",{style:{fontSize:"12.5px"}},n),
                h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700"}},W(v))
              ),
              h("div",{style:{height:"6px",borderRadius:"999px",background:"#F2EEE6",overflow:"hidden"}},
                h("div",{style:{width:Math.max(5,(v/cmax)*100)+"%",height:"100%",background:c.c,borderRadius:"999px"}})
              )
            )
          ));
        });
        container.append(cSec);
      }
    }
  };
  draw();
  return[container];
}

// ── 거래 검색 ──
function showSearch(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"50"},onclick:e=>{if(e.target===ov)ov.remove();}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"90vh",overflowY:"auto"}});
  const resultEl=h("div",{style:{marginTop:"12px"}});
  let timer=null;

  const inp=h("input",{type:"text",placeholder:"가맹점, 카테고리, 메모 검색…",autocomplete:"off",style:{width:"100%",border:`1px solid ${C.brand}`,borderRadius:"12px",padding:"12px 14px",fontSize:"15px",outline:"none"}});
  inp.oninput=e=>{
    clearTimeout(timer);
    const q=e.target.value.trim();
    if(q.length<2){resultEl.innerHTML="";return;}
    resultEl.innerHTML='<div class="center"><div class="spin"></div></div>';
    timer=setTimeout(async()=>{
      const{data}=await sb.from("transactions").select("*").or(`merchant.ilike.%${q}%,memo.ilike.%${q}%,category.ilike.%${q}%`).order("date",{ascending:false}).limit(60);
      const results=data||[];
      resultEl.innerHTML="";
      if(!results.length){resultEl.append(empty(`"${q}" 검색 결과 없음`));return;}
      const total=results.reduce((s,t)=>s+Number(t.amount),0);
      resultEl.append(h("div",{style:{fontSize:"12.5px",color:C.sub,padding:"0 2px 8px",display:"flex",justifyContent:"space-between"}},
        h("span",{},`${results.length}건`),h("span",{class:"num"},`합계 ${W(total)}`)
      ));
      const reloadSearch=async()=>{
        const q2=inp.value.trim();
        if(q2.length<2)return;
        const{data:d2}=await sb.from("transactions").select("*").or(`merchant.ilike.%${q2}%,memo.ilike.%${q2}%,category.ilike.%${q2}%`).order("date",{ascending:false}).limit(60);
        resultEl.innerHTML="";
        (d2||[]).forEach(drawRow);
        await loadMonth();
        const ct=document.getElementById("ct");
        if(ct){ct.innerHTML="";buildHome().forEach(n=>ct.append(n));}
      };
      const drawRow=t=>{
        const c=CM[t.category]||CM["기타"],k=kindOf(t.type);
        const cl=k==="income"||k==="reduce"?C.brand:C.ink;
        const sg=k==="income"||k==="reduce"?"+":k==="spend"?"−":"";
        resultEl.append(h("div",{
          style:{display:"flex",alignItems:"center",gap:"11px",padding:"10px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .12s",borderRadius:"4px"},
          onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
          onmouseleave:e=>{e.currentTarget.style.background="transparent";},
          onclick:()=>showEditTxn(t,reloadSearch)
        },
          h("div",{style:{width:"32px",height:"32px",borderRadius:"9px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",flexShrink:"0"}},c.i),
          h("div",{style:{flex:"1",minWidth:"0"}},
            h("div",{style:{fontSize:"13.5px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
            h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.account} · ${t.category}`)
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
            h("div",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`),
            h("span",{style:{fontSize:"12px",color:C.faint}},"›")
          )
        ));
      };
      results.forEach(drawRow);
    },300);
  };

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},
      h("span",{style:{fontSize:"17px",fontWeight:"800"}},"🔍 거래 검색"),
      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    inp,
    h("div",{style:{fontSize:"12px",color:C.faint,marginTop:"6px",paddingLeft:"2px"}},"가맹점 · 카테고리 · 메모 검색 · 2자 이상 입력"),
    resultEl
  );
  ov.append(sh);document.body.append(ov);
  setTimeout(()=>inp.focus(),100);
}

// ── 전월비교 ──
function buildComparison(cur,prev){
  const pym=shYm(S.curYm,-1);
  const hasPrev=S.prevTxns.length>0;
  const el=sec("전월 비교",hasPrev?yml(pym)+" 대비":"데이터 없음");
  if(!hasPrev){el.append(h("div",{style:{textAlign:"center",color:C.faint,fontSize:"13px",padding:"10px 0",lineHeight:"1.7"}},"전달 거래내역이 없어요.",h("br"),"데이터가 쌓이면 자동으로 표시돼요 📈"));return el;}
  const items=[{lbl:"개인 소비",cur:cur.pNet,prev:prev.pNet,icon:"💸",goodUp:false},{lbl:"공용 소비",cur:cur.cNet,prev:prev.cNet,icon:"🤝",goodUp:false},{lbl:"수입",cur:cur.income,prev:prev.income,icon:"💼",goodUp:true}];
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}});
  items.forEach(({lbl,cur:c,prev:p,icon,goodUp})=>{
    const diff=c-p,pct=p>0?Math.round((diff/p)*100):null,up=diff>0;
    const good=diff===0?null:(goodUp?up:!up);
    const tc=good===null?C.sub:good?C.brand:C.over;
    const arrow=diff===0?"─":up?"↑":"↓";
    const diffStr=diff===0?"변화없음":W(Math.abs(diff)).slice(1)+(pct!==null?` (${Math.abs(pct)}%)`:"");
    grid.append(h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10.5px",color:C.sub,marginBottom:"5px"}},icon+"  "+lbl),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.ink,marginBottom:"4px"}},W(c)),
      h("div",{style:{fontSize:"11px",fontWeight:"700",color:tc}},h("span",{style:{marginRight:"3px"}},arrow),diffStr)
    ));
  });
  el.append(grid);return el;
}



// ── 카드 대금 스크린샷 분석 ──
function showBillCapture(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"50"},onclick:e=>{if(e.target===ov)ov.remove();}});

  const lbl=t=>h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.sub,marginBottom:"6px"}},t);
  const resultEl=h("div");

  // 스크린샷 업로드 영역
  const fileInp=h("input",{type:"file",accept:"image/*",style:{display:"none"}});
  const uploadArea=h("button",{style:{width:"100%",border:`2px dashed ${C.line}`,borderRadius:"14px",padding:"22px",fontSize:"14px",color:C.sub,background:"transparent",cursor:"pointer",textAlign:"center",marginBottom:"14px"},onclick:()=>fileInp.click()},
    h("div",{style:{fontSize:"26px",marginBottom:"6px"}},"📷"),
    h("div",{style:{fontWeight:"600"}},"카드앱 청구 화면 스크린샷 업로드"),
    h("div",{style:{fontSize:"12px",marginTop:"4px",color:C.faint}},getApiKey()?"AI가 금액을 자동 추출해요":"⚙️ API 키 없음 → 직접 입력 가능")
  );

  fileInp.onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    uploadArea.textContent="🔍 분석 중…";uploadArea.disabled=true;
    try{
      const BILL_PROMPT=`이 카드 청구서/이용내역 이미지에서 카드 정보를 추출하세요. JSON만 반환:
{"card_name":"카드사명","amount":청구금액숫자,"billing_date":"YYYY-MM-DD","period":"청구기간"}
청구 예정액 또는 이번달 청구액 기준. 금액은 원화 숫자만.`;
      const result=await claudeVision(file,BILL_PROMPT);
      resultEl.innerHTML="";
      // 이미지 미리보기
      const imgUrl=URL.createObjectURL(file);
      resultEl.append(h("img",{src:imgUrl,style:{width:"100%",borderRadius:"12px",marginBottom:"12px",maxHeight:"200px",objectFit:"contain",background:"#f0f0f0"}}));
      if(result.amount){
        // 추출 결과 표시 + 확인 폼
        const cardEl=h("input",{type:"text",value:result.card_name||"",placeholder:"카드사명",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"10px"}});
        const amtEl=h("input",{type:"number",value:result.amount||"",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"10px"}});
        const dateEl=h("input",{type:"date",value:result.billing_date||shYm(S.curYm,1)+"-01",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"14px"}});
        const saveBtn=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"13px",borderRadius:"12px",border:"none",cursor:"pointer"}},"실제 카드대금 저장");
        saveBtn.onclick=async()=>{
          const a=Number(amtEl.value);if(!a)return;
          saveBtn.disabled=true;saveBtn.textContent="저장 중…";
          await sb.from("transactions").insert({user_id:S.session.user.id,date:dateEl.value,account:"개인",type:"카드대금",amount:a,category:"금융/이체",merchant:cardEl.value.trim()||"카드대금",memo:"실제 청구액 (스크린샷)"});
          ov.remove();await loadMonth();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildHome().forEach(n=>ct.append(n));}
        };
        resultEl.append(
          h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px",marginBottom:"12px",fontSize:"13px",color:C.brand,fontWeight:"700"}},"✅ AI 추출 완료 — 확인 후 저장해주세요"),
          lbl("카드사"),cardEl,lbl("청구 금액 (원)"),amtEl,lbl("청구일"),dateEl,saveBtn
        );
      }else{
        resultEl.append(h("div",{style:{color:C.warn,fontSize:"13px",padding:"10px"}},"AI 추출 실패. 아래에서 직접 입력해주세요."));
        renderManualForm();
      }
    }catch(err){
      uploadArea.style.borderColor=C.over;
      if(err.message==="no_key"){
        uploadArea.innerHTML="⚠️ API 키가 없어요. ⚙️ 버튼으로 설정 후 다시 시도하거나, 아래에서 직접 입력해주세요.";
      }else{
        uploadArea.textContent="📷 다시 시도";
      }
      uploadArea.disabled=false;
      renderManualForm();
    }
  };

  const renderManualForm=()=>{
    if(resultEl.querySelector(".manual-form"))return;
    const wrap=h("div",{class:"manual-form"});
    let isFx=false;
    const cardEl=h("input",{type:"text",placeholder:"카드사명 (예: 삼성카드)",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"10px"}});
    // 통화 토글
    const currRow=h("div",{style:{display:"flex",gap:"8px",marginBottom:"10px"}});
    const drawCurr=()=>{currRow.innerHTML="";["원화 (₩)","달러 ($)"].forEach((lbTxt,i)=>{
      const b=h("button",{style:{flex:"1",fontSize:"13px",fontWeight:"600",padding:"10px",borderRadius:"10px",border:`1px solid ${(i===1)===isFx?C.brand:C.line}`,background:(i===1)===isFx?C.soft:C.w,color:(i===1)===isFx?C.brand:C.sub,cursor:"pointer"},onclick:()=>{isFx=i===1;drawCurr();updatePreview();}},lbTxt);
      currRow.append(b);
    });};
    drawCurr();
    const amtEl=h("input",{type:"number",placeholder:"청구 금액",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"6px"}});
    const fxRow=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"10px",display:"none"}});
    const fxEl=h("input",{type:"number",value:"1380",placeholder:"환율 (₩/$)",style:{border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
    const previewEl=h("div",{style:{fontSize:"12px",color:C.brand,fontWeight:"700",padding:"6px 12px",background:C.soft,borderRadius:"8px",display:"none"}});
    fxRow.append(h("div",{style:{fontSize:"12px",color:C.sub,alignSelf:"center"}},"환율 (원/$)"),fxEl);
    const updatePreview=()=>{
      fxRow.style.display=isFx?"grid":"none";
      previewEl.style.display=(isFx&&amtEl.value)?"":"none";
      if(isFx&&amtEl.value){const krw=Math.round(Number(amtEl.value)*Number(fxEl.value||1380));previewEl.textContent=`→ 원화 환산: ${W(krw)}`;}
    };
    amtEl.oninput=updatePreview;fxEl.oninput=updatePreview;
    const dateEl=h("input",{type:"date",value:shYm(S.curYm,1)+"-14",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"14px"}});
    const saveBtn=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"13px",borderRadius:"12px",border:"none",cursor:"pointer"}},"저장");
    saveBtn.onclick=async()=>{
      let a=Number(amtEl.value);if(!a)return;

      await sb.from("transactions").insert({user_id:S.session.user.id,date:dateEl.value,account:"개인",type:"카드대금",amount:a,category:"금융/이체",merchant:cardEl.value.trim()||"카드대금",memo});

  drawAcc();

  const catWrap=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"7px"}});
  const drawCats=()=>{catWrap.innerHTML="";CATS.forEach(c=>{const b=h("button",{style:{fontSize:"12.5px",padding:"7px 11px",borderRadius:"999px",border:`1px solid ${selCat===c.n?c.c:C.line}`,background:selCat===c.n?c.c+"1A":C.w,color:selCat===c.n?c.c:C.ink,fontWeight:selCat===c.n?"700":"500",cursor:"pointer"},onclick:()=>{selCat=c.n;drawCats();}},c.i+" "+c.n);catWrap.append(b);});};
  drawCats();

  // 결제수단
  let selPayE=t.payment_method||"현금";

  const payListE=()=>{const names=["현금",...S.accounts.map(a=>a.name)];if(selPayE&&!names.includes(selPayE))names.push(selPayE);return names;};
  const drawPayE=()=>{payWrapE.innerHTML="";payListE().forEach(nm=>{const on=selPayE===nm;const a=S.accounts.find(x=>x.name===nm);const icon=nm==="현금"?"💵":(a?(ACC_ICON[a.kind]||"🏦"):"💳");payWrapE.append(h("button",{style:{fontSize:"12.5px",padding:"7px 11px",borderRadius:"999px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selPayE=nm;drawPayE();}},icon+" "+nm));});};
  drawPayE();

    installHint,
    dutchSlot,
    h("div",{style:{marginBottom:"14px"}},lbl("금액"),h("div",{style:{display:"flex",alignItems:"center",border:`1px solid ${C.line}`,borderRadius:"12px",padding:"10px 14px"}},h("span",{style:{fontSize:"22px",fontWeight:"700",color:C.faint,marginRight:"6px"}},"₩"),amtEl)),
    lbl("계정"),h("div",{style:{marginBottom:"13px"}},accRow),
    lbl("결제수단"),h("div",{style:{marginBottom:"13px"}},payWrapE),
    lbl("유형"),h("div",{style:{marginBottom:"13px"}},typ),
    lbl("카테고리"),h("div",{style:{marginBottom:"13px"}},catWrap),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"13px"}},h("div",{},lbl("사용처"),mer),h("div",{},lbl("날짜"),dt)),
    h("div",{style:{marginBottom:"16px"}},lbl("메모"),mo),
    h("div",{style:{display:"flex",gap:"10px"}},saveBtn,delBtn)

  ov.append(sh);document.body.append(ov);

// ── 고정비 탭 ──
function detectPaid(fc){
  // 이번 달 transactions에서 카테고리+금액+계정으로 납부 여부 감지
  // 고정비 등록은 소비 집계에 영향 없음 — transactions에 실제 거래가 있을 때만 납부됨
  return S.txns.some(t=>{
    const a=Number(t.amount),fa=Number(fc.amount);
    const catMatch=t.category===fc.category;
    const amtMatch=fa>0&&Math.abs(a-fa)/fa<0.45;// 45% 허용 (관리비처럼 변동 있는 것도 감지)
    const accMatch=t.account===fc.account;
    return catMatch&&amtMatch&&accMatch;
  });
}

function buildFixed(){
  const fcs=S.fixedCosts;
  const withStatus=fcs.map(fc=>({...fc,paid:detectPaid(fc)}));
  const total=withStatus.reduce((s,fc)=>s+Number(fc.amount),0);
  const paidAmt=withStatus.filter(fc=>fc.paid).reduce((s,fc)=>s+Number(fc.amount),0);
  const unpaidAmt=total-paidAmt;
  const paidPct=total>0?Math.round(paidAmt/total*100):0;
  const unpaidList=withStatus.filter(fc=>!fc.paid);
  const paidList=withStatus.filter(fc=>fc.paid);

  // 헤더 카드
  const hero=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 고정비 합계"),
    h("div",{class:"num",style:{fontSize:"36px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1",marginBottom:"16px"}},W(total)),
    h("div",{style:{height:"11px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden",marginBottom:"10px"}},
      h("div",{style:{width:`${paidPct}%`,height:"100%",background:C.brand,borderRadius:"999px",transition:"width .5s"}})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}},
      h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"✅ 납부 완료"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(paidAmt)),
        h("div",{style:{fontSize:"11.5px",color:C.brand,marginTop:"2px"}},`${paidList.length}건 · ${paidPct}%`)
      ),
      h("div",{style:{background:unpaidAmt>0?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:unpaidAmt>0?C.over:C.faint,fontWeight:"700",marginBottom:"4px"}},unpaidAmt>0?"⏳ 미납":"🎉 전액 납부"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:unpaidAmt>0?C.over:C.faint}},W(unpaidAmt)),
        h("div",{style:{fontSize:"11.5px",color:unpaidAmt>0?C.over:C.faint,marginTop:"2px"}},`${unpaidList.length}건`)
      )
    )
  );

  // 고정비 없을 때 → 추천 목록 클릭 추가
  if(!fcs.length){
    const emptySec=sec("고정비 목록","");
    emptySec.append(
      h("div",{style:{textAlign:"center",padding:"16px 0 10px",color:C.sub}},
        h("div",{style:{fontSize:"28px",marginBottom:"6px"}},"📋"),
        h("div",{style:{fontSize:"14px",fontWeight:"700"}},"등록된 고정비가 없어요"),
        h("div",{style:{fontSize:"12px",color:C.faint,marginTop:"3px"}},"아래 추천 항목을 탭하면 바로 추가돼요")
      ),
      // 작동 방식 안내
      h("div",{style:{background:"#EEF5F1",borderRadius:"12px",padding:"13px 15px",margin:"10px 0 14px",fontSize:"12.5px",lineHeight:"1.8",color:"#1A5E44"}},
        "💡 ",h("strong",{},"고정비 탭은 소비를 잡지 않아요"),h("br"),
        "실제 소비는 카드/은행 거래가 들어올 때 잡히고,",h("br"),
        "여기서는 그 거래가 납부됐는지 자동으로 감지해줘요.",h("br"),h("br"),
        "• ",h("strong",{},"공용 고정비"),": 공용통장 출금 → 납부됨 감지",h("br"),
        "• ",h("strong",{},"개인 고정비"),": 카드/카카오뱅크 출금 → 납부됨 감지",h("br"),
        "• 내통장→공용통장 이체는 이체(제외)로 처리돼요 ✅"
      )
    );
    // 추천 항목 클릭 카드
    const sugList=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    const existingNames=fcs.map(f=>f.name);
    SUGGESTED_FC.forEach(sg=>{
      if(existingNames.includes(sg.name))return;
      const c=CM[sg.category]||CM["기타"];
      const card=h("div",{
        style:{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",borderRadius:"12px",background:"#F6F4EF",border:`1px solid ${C.line}`,cursor:"pointer",transition:"all .12s"},
        onmouseenter:e=>{e.currentTarget.style.background=C.soft;e.currentTarget.style.borderColor=C.brand;},
        onmouseleave:e=>{e.currentTarget.style.background="#F6F4EF";e.currentTarget.style.borderColor=C.line;},
        onclick:()=>showAddFixed(sg)
      },
        h("div",{style:{width:"36px",height:"36px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"17px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"13.5px",fontWeight:"700"}},sg.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},
            W(sg.amount)+" · "+sg.account+(sg.billing_day?" · 매월 "+sg.billing_day+"일":"")
          )
        ),
        h("div",{style:{fontSize:"11.5px",fontWeight:"700",color:C.brand,padding:"5px 10px",borderRadius:"8px",background:C.soft,whiteSpace:"nowrap"}},"＋ 추가")
      );
      sugList.append(card);
    });
    emptySec.append(sugList);
    return[hero,emptySec];
  }

  // 고정비 있을 때도 추가 안 된 추천 항목 보여주기
  const existingNames=withStatus.map(f=>f.name);
  const remainingSug=SUGGESTED_FC.filter(sg=>!existingNames.includes(sg.name));

  const reloadFixed=async()=>{
    await Promise.all([loadFixed(),loadMonth()]);
    const ct=document.getElementById("ct");
    if(ct){ct.innerHTML="";buildFixed().forEach(n=>ct.append(n));}
  };

  const buildRow=(fc)=>{
    const c=CM[fc.category]||CM["기타"];
    const paid=fc.paid;
    const dayStr=fc.billing_day?`매월 ${fc.billing_day}일`:"";
    const delBtn=h("button",{style:{color:C.faint,fontSize:"14px",padding:"6px",flexShrink:"0"},onclick:async(e)=>{
      e.stopPropagation();
      if(!confirm(`'${fc.name}' 고정비를 삭제할까요?`))return;
      await sb.from("fixed_costs").update({is_active:false}).eq("id",fc.id);
      await reloadFixed();
    }},"✕");

    return h("div",{class:"fcrow",style:{
      display:"flex",alignItems:"center",gap:"12px",
      padding:"13px 4px",borderBottom:`1px solid ${C.line}`,
      cursor:"pointer",borderRadius:"4px",transition:"background .12s"
    },onclick:()=>showEditFixed(fc,reloadFixed)},
      h("div",{style:{width:"38px",height:"38px",borderRadius:"11px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600"}},fc.name),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},
          [fc.account==="공용"?"공용":"개인",fc.payment_method,dayStr,fc.memo].filter(Boolean).join(" · ")
        )
      ),
      h("div",{style:{textAlign:"right",marginRight:"4px"}},
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(fc.amount)),
        h("div",{style:{fontSize:"11px",marginTop:"3px",fontWeight:"700",color:paid?C.brand:C.over}},paid?"✅ 납부됨":"⏳ 미납")
      ),
      delBtn
    );
  };

  // 미납 섹션 먼저
  const sections=[];
  if(unpaidList.length){
    const unSec=sec(h("span",{style:{color:C.over}},"⏳ 미납"),`${unpaidList.length}건 · ${W(unpaidAmt).slice(1)}`);
    unpaidList.forEach(fc=>unSec.append(buildRow(fc)));
    sections.push(unSec);
  }
  if(paidList.length){
    const pSec=sec("✅ 납부 완료",`${paidList.length}건 · ${W(paidAmt).slice(1)}`);
    paidList.forEach(fc=>pSec.append(buildRow(fc)));
    sections.push(pSec);
  }

  // 더 추가할 추천 항목
  if(remainingSug.length){
    const moreSec=sec("빠른 추가","탭하면 바로 추가");
    const moreList=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    remainingSug.forEach(sg=>{
      const c=CM[sg.category]||CM["기타"];
      moreList.append(h("div",{
        style:{display:"flex",alignItems:"center",gap:"11px",padding:"10px 4px",borderRadius:"10px",cursor:"pointer",transition:"background .12s"},
        onmouseenter:e=>{e.currentTarget.style.background="#F0EDE5";},
        onmouseleave:e=>{e.currentTarget.style.background="transparent";},
        onclick:()=>showAddFixed(sg)
      },
        h("span",{style:{fontSize:"16px",width:"22px",textAlign:"center",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1"}},
          h("div",{style:{fontSize:"13px",fontWeight:"600"}},sg.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},W(sg.amount)+" · "+sg.account)
        ),
        h("span",{style:{fontSize:"12px",fontWeight:"700",color:C.brand,padding:"4px 9px",borderRadius:"7px",background:C.soft}},"＋")
      ));
    });
    moreSec.append(moreList);
    sections.push(moreSec);
  }
  return[hero,...sections];
}

  const sh=h("div",{style:{width:"100%",maxWidth:"720px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"92vh",overflowY:"auto"}});
  let importData=[];
  const tableEl=h("div");
  const countEl=h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"10px",display:"none"}});
  const saveBtn=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"12px",display:"none"}},"저장하기");
  const drawTable=()=>{
    tableEl.innerHTML="";
    if(!importData.length)return;
    countEl.style.display="";saveBtn.style.display="";
    const nr_count=importData.filter(r=>r.needs_review||r.confidence==="low").length;
    countEl.textContent=`${importData.length}건 불러옴${nr_count?` · ⚠️ ${nr_count}건 확인 필요`:""}`;
    saveBtn.textContent=`${importData.length}건 전체 저장하기`;
    const legend=h("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"10px"}});
    [["spend","소비"],["income","수입"],["save","투자"],["reduce","환급"],["flow","이체"]].forEach(([k,lbl])=>{const kc=KTYPE[k];legend.append(h("div",{style:{display:"flex",alignItems:"center",gap:"4px",fontSize:"11.5px",color:kc.color,fontWeight:"600"}},h("div",{style:{width:"10px",height:"10px",borderRadius:"2px",background:kc.color,opacity:".7"}}),lbl));});
    tableEl.append(legend);
    const grid=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    importData.forEach((row,i)=>{
      const nr=row.needs_review||row.confidence==="low";
      const k=kindOf(row.type||"소비(일시불)");
      const kc=KTYPE[k]||KTYPE.spend;
      const catSel=h("select",{style:{border:`1px solid ${nr?C.warn:C.line}`,borderRadius:"8px",padding:"5px 6px",fontSize:"11.5px",background:C.w,color:C.ink,minWidth:"0",maxWidth:"130px"}});
      CATS.forEach(ct=>{const o=h("option",{value:ct.n},ct.i+" "+ct.n);if(ct.n===(row.category||"기타"))o.selected=true;catSel.append(o);});
      catSel.onchange=()=>{importData[i].category=catSel.value;};
      const accSel=h("select",{style:{border:`1px solid ${C.line}`,borderRadius:"8px",padding:"5px 6px",fontSize:"11.5px",background:C.w,color:C.ink,maxWidth:"60px"}});
      ["개인","공용"].forEach(a=>{const o=h("option",{value:a},a);if(a===(row.account||"개인"))o.selected=true;accSel.append(o);});
      accSel.onchange=()=>{importData[i].account=accSel.value;};
      const db=h("button",{style:{color:C.faint,fontSize:"14px",padding:"4px",flexShrink:"0"},onclick:()=>{importData.splice(i,1);drawTable();}},"✕");
      const amtColor=k==="income"?C.brand:k==="save"?"#4169B1":k==="reduce"?C.warn:C.ink;
      const badge=h("span",{style:{fontSize:"10.5px",fontWeight:"700",padding:"2px 7px",borderRadius:"5px",background:kc.bg,color:kc.color,whiteSpace:"nowrap",flexShrink:"0"}},kc.lbl);
      grid.append(h("div",{style:{display:"grid",gridTemplateColumns:"50px 60px 80px 1fr 130px 56px 20px",gap:"7px",alignItems:"center",padding:"9px 12px 9px 14px",borderRadius:"10px",background:nr?"#FFFBEE":kc.bg,border:`1px solid ${nr?C.warn+"88":C.line}`,borderLeft:`3px solid ${kc.color}`}},
        h("span",{style:{fontSize:"11.5px",color:C.sub}},(row.date||"").slice(5)),badge,
        h("span",{class:"num",style:{fontSize:"13px",fontWeight:"700",color:amtColor}},W(row.amount)),
        h("span",{style:{fontSize:"12.5px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},(row.merchant||"(미상)")),
        catSel,accSel,db
      ));
    });
    tableEl.append(countEl,grid);
  };
  saveBtn.onclick=async()=>{
    saveBtn.disabled=true;saveBtn.textContent="저장 중…";
    const rows=importData.filter(t=>Number(t.amount)>0&&t.date).map(t=>({user_id:S.session.user.id,date:t.date,account:t.account||"개인",type:t.type||"소비(일시불)",amount:Number(t.amount),category:t.category||"기타",merchant:t.merchant||null,memo:t.memo||null,payment_method:t.payment_method||null}));
    const{error}=await sb.from("transactions").insert(rows);
    if(error){alert("저장 실패: "+error.message);saveBtn.disabled=false;saveBtn.textContent=`${importData.length}건 전체 저장하기`;return;}
    ov.remove();S.tab="home";await loadMonth();renderDash();
  };
  const fileInp=h("input",{type:"file",accept:".json",style:{display:"none"}});
  fileInp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const data=JSON.parse(await f.text());const txns=Array.isArray(data)?data:(data.transactions||[]);importData=txns.map(t=>({...t,category:t.category||"기타",account:t.account||"개인",type:t.type||"소비(일시불)"}));drawTable();}catch{alert("파일 형식 오류.");}
  };
  const upBtn=h("button",{style:{width:"100%",border:`2px dashed ${C.line}`,borderRadius:"14px",padding:"26px",fontSize:"14px",color:C.sub,cursor:"pointer",background:"transparent",textAlign:"center"},onclick:()=>fileInp.click()},h("div",{style:{fontSize:"28px",marginBottom:"8px"}},"📄"),h("div",{},"Claude가 분류한 JSON 파일을 선택해주세요"),h("div",{style:{fontSize:"12px",marginTop:"4px",color:C.faint}},".json 파일 · 드래그 또는 클릭"));
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"📥 카드내역 가져오기"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{background:"#EEF5F1",borderRadius:"12px",padding:"14px 16px",marginBottom:"16px",fontSize:"13px",lineHeight:"1.9",color:"#1A5E44"}},h("strong",{},"사용 방법"),h("br"),"① 카드사 앱/홈페이지 → 이용내역 → 엑셀(.xlsx) 다운로드",h("br"),"② 이 클로드 대화창에 엑셀 업로드 → ",h("strong",{},'"이거 분류해줘"'),h("br"),"③ 클로드가 내려주는 JSON 파일 저장",h("br"),"④ 아래에서 JSON 파일 선택 → 틀린 것만 수정 → 전체 저장"),
    upBtn,fileInp,tableEl,saveBtn
  );
  ov.append(sh);document.body.append(ov);
}


// ════════════════════ 🤝 공용 탭 ════════════════════
function sharedKindOf(t){
  const ty=t.type;
  if(ty==="공용입금")return "deposit";
  if(["소비(일시불)","소비(할부)"].includes(ty))return "spend";
  if(["정산환급","환불/취소"].includes(ty))return "reduce";
  if(ty==="이체")return "flow";
  return "spend";
}
// 고정비 납부 자동 감지: 같은 카테고리+비슷한 금액의 공용 소비가 이번달에 있으면 납부됨
function sfcPaidAuto(sfc){
  return S.sharedTxns.some(t=>{
    if(sharedKindOf(t)!=="spend")return false;
    const a=Number(t.amount),fa=Number(sfc.amount);
    return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
  });
}
// 고양이 한 마디 (랜덤이 아니라 인덱스 순환 → 안정적)
function catSay(idx,text){
  const cat=CATS_MASCOT[idx%CATS_MASCOT.length];
  return h("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px"}},
    h("div",{style:{fontSize:"26px",flexShrink:"0",lineHeight:"1"}},cat.emoji),
    h("div",{style:{fontSize:"13px",lineHeight:"1.6"}},h("span",{style:{fontWeight:"800",color:cat.color}},cat.name+" "),text)
  );
}

function buildShared(){
  const st=getSharedTab();
  const spend=S.sharedTxns.filter(t=>sharedKindOf(t)==="spend").reduce((s,t)=>s+Number(t.amount),0);
  const reduce=S.sharedTxns.filter(t=>sharedKindOf(t)==="reduce").reduce((s,t)=>s+Number(t.amount),0);
  const netSpend=Math.max(0,spend-reduce);
  const deposits=S.sharedTxns.filter(t=>sharedKindOf(t)==="deposit");
  const depByPerson={"정근":0,"여친":0};
  deposits.forEach(t=>{const who=(t.merchant||"").includes("여친")?"여친":"정근";depByPerson[who]+=Number(t.amount);});
  const totalDep=depByPerson["정근"]+depByPerson["여친"];

  const out=[];

  // ① 상단 요약 + 고양이 인사
  const hero=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"4px"}},
      h("div",{},h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 공용 지출"),h("div",{class:"num",style:{fontSize:"34px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1"}},W(netSpend))),
      h("div",{style:{fontSize:"30px",display:"flex",gap:"-6px"}},
        h("span",{style:{}},"🐈‍⬛"),h("span",{style:{marginLeft:"-8px"}},"🐈")
      )
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"16px"}},
      h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"💰 통장에 모인 돈"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(totalDep)),
        h("div",{style:{fontSize:"11px",color:C.brand,marginTop:"2px"}},`정근 ${shortNum(depByPerson["정근"])} · 여친 ${shortNum(depByPerson["여친"])}`)
      ),
      h("div",{style:{background:netSpend>totalDep?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:netSpend>totalDep?C.over:C.sub,fontWeight:"700",marginBottom:"4px"}},netSpend>totalDep?"⚠️ 통장 부족":"통장 잔액"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:netSpend>totalDep?C.over:C.ink}},W(Math.abs(totalDep-netSpend))),
        h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"2px"}},netSpend>totalDep?"입금이 더 필요해요":"여유분")
      )
    )
  );
  out.push(hero);

  // ② 공용 고정비 (Supabase, 클릭수정·추가·삭제)
  const fcSec=sec("📋 공용 고정비",h("button",{style:{fontSize:"11.5px",color:C.brand,fontWeight:"700",cursor:"pointer"},onclick:()=>showSharedFcEdit(null)},"＋ 추가"));
  if(!SHARED_FC.length){
    fcSec.append(empty("등록된 공용 고정비가 없어요.\n오른쪽 위 ＋ 추가로 만들어보세요."));
  }else{
    const fcTotal=SHARED_FC.reduce((s,f)=>s+Number(f.amount),0);
    SHARED_FC.forEach(sfc=>{
      const c=CM[sfc.category]||CM["기타"];
      const pm=PAY_META[sfc.pay]||PAY_META["공용통장"];
      const autoPaid=sfcPaidAuto(sfc);
      const manualPaid=!!st.paidManual[sfc.id];
      const paid=autoPaid||manualPaid;
      fcSec.append(h("div",{class:"fcrow",style:{display:"flex",alignItems:"center",gap:"11px",padding:"12px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",borderRadius:"6px",transition:"background .12s"},
        onclick:()=>showSharedFcDetail(sfc)},
        h("div",{style:{width:"38px",height:"38px",borderRadius:"11px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"14px",fontWeight:"600"}},sfc.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},`${pm.icon} ${pm.label}${sfc.billing_day?` · 매월 ${sfc.billing_day}일`:""}`)
        ),
        h("div",{style:{textAlign:"right",marginRight:"2px"}},
          h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(sfc.amount)),
          h("div",{style:{fontSize:"11px",marginTop:"3px",fontWeight:"700",color:paid?C.brand:C.over}},paid?"✅ 납부됨":"⏳ 미납")
        ),
        h("span",{style:{fontSize:"12px",color:C.faint,marginLeft:"2px"}},"›")
      ));
    });
    fcSec.append(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"11px 4px 2px",fontSize:"13px",fontWeight:"800"}},
      h("span",{style:{color:C.sub}},"고정비 합계"),h("span",{class:"num"},W(fcTotal))));
  }
  out.push(fcSec);

  // ③ 정산 도우미
  out.push(buildSettlement());

  // ④ 생활비 입금
  out.push(buildDepositSection(depByPerson,st));

  // ⑤ 이번 달 공용 내역
  const txSec=sec("이번 달 공용 내역",`${S.sharedTxns.length}건`);
  if(!S.sharedTxns.length)txSec.append(empty("아직 공용 거래가 없어요.\n아래 ＋ 버튼으로 추가해보세요."));
  else{
    txSec.append(h("div",{style:{fontSize:"11.5px",color:C.faint,padding:"0 2px 6px",textAlign:"right"}},"탭하면 수정"));
    const reloadShared=async()=>{await loadShared();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}};
    S.sharedTxns.slice(0,20).forEach(t=>{
      const c=CM[t.category]||CM["기타"];
      const sk=sharedKindOf(t);
      const isDep=sk==="deposit";
      const sg=isDep||sk==="reduce"?"+":sk==="spend"?"−":"";
      const cl=isDep?C.brand:sk==="reduce"?C.warn:C.ink;
      const pmTxt=t.payment_method&&PAY_META[t.payment_method]?` · ${PAY_META[t.payment_method].icon}${PAY_META[t.payment_method].label}`:"";
      txSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .12s",borderRadius:"4px"},
        onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
        onmouseleave:e=>{e.currentTarget.style.background="transparent";},
        onclick:()=>showEditTxn(t,reloadShared)},
        h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0"}},isDep?"💰":c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.type}${pmTxt}${t.memo?` · ${t.memo}`:""}`)
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
          h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},sg+W(t.amount).slice(1)),
          h("span",{style:{fontSize:"12px",color:C.faint}},"›")
        )
      ));
    });
  }
  out.push(txSec);
  return out;
}

// ── 정산 도우미 (개인이 낸 것만) ──
function buildSettlement(){
  const st=getSharedTab();
  const items=[];
  // (A) 고정비 중 개인 결제(settle:true)이고 납부 감지된 것
  SHARED_FC.forEach(sfc=>{
    const pm=PAY_META[sfc.pay];
    if(!pm||!pm.settle)return;
    const matched=S.sharedTxns.find(t=>{
      if(sharedKindOf(t)!=="spend")return false;
      const a=Number(t.amount),fa=Number(sfc.amount);
      return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
    });
    if(!matched)return;
    items.push({key:"fc_"+sfc.id+"_"+S.curYm,who:pm.who,name:sfc.name,amount:Number(matched.amount)});
  });
  // (B) 공용 변동 지출 중 결제수단이 개인(settle:true)인 거래
  S.sharedTxns.forEach(t=>{
    if(sharedKindOf(t)!=="spend")return;
    const pm=PAY_META[t.payment_method];
    if(!pm||!pm.settle)return;
    items.push({key:"tx_"+t.id,who:pm.who,name:t.merchant||t.category||"공용 지출",amount:Number(t.amount)});
  });

  const el=sec("🐈 정산 도우미","");
  const pending=items.filter(it=>!st.settled[it.key]);
  const done=items.filter(it=>st.settled[it.key]);

  if(!items.length){
    el.append(catSay(0,"아직 정산할 게 없다냥~ 공용통장이나 카드로 잘 쓰고 있다냥! 🐾"));
    return el;
  }

  pending.forEach((it,idx)=>{
    const half=Math.round(it.amount/2);
    const who=it.who||"정근";
    const card=h("div",{style:{background:"#FFFBEE",border:`1px solid ${C.warn}55`,borderRadius:"14px",padding:"14px",marginBottom:"10px"}});
    const opt=(icon,label,sub,val)=>h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:C.w,border:`1px solid ${C.line}`,marginBottom:"7px"}},
      h("span",{style:{fontSize:"17px"}},icon),
      h("div",{style:{flex:"1"}},h("div",{style:{fontSize:"13px",fontWeight:"700"}},label),h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"1px"}},sub)),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},val));
    card.append(
      h("div",{style:{marginBottom:"12px"}},catSay(idx,`${who}이가 ${it.name} ${W(it.amount)} 대신 냈다냥! 둘 중 하나로 정산하라냥~`)),
      opt("🏦","공용통장에 입금","상대도 똑같이 채우기",W(it.amount)),
      opt("💸",`${who}에게 직접 송금`,"절반만 정산",W(half)),
      h("button",{style:{width:"100%",marginTop:"4px",fontSize:"13px",fontWeight:"700",padding:"11px",borderRadius:"11px",border:`1px solid ${C.brand}`,background:C.soft,color:C.brand,cursor:"pointer"},
        onclick:()=>{const s2=getSharedTab();s2.settled[it.key]=true;saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"✅ 정산 완료로 표시")
    );
    el.append(card);
  });
  if(done.length){
    done.forEach(it=>{
      el.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 10px",borderRadius:"10px",background:C.soft,marginBottom:"6px"}},
        h("div",{style:{fontSize:"12.5px",color:C.brand,fontWeight:"600"}},`✅ ${it.name} 정산 완료`),
        h("button",{style:{fontSize:"11px",color:C.faint,cursor:"pointer"},onclick:()=>{const s2=getSharedTab();delete s2.settled[it.key];saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"되돌리기")
      ));
    });
  }
  return el;
}

// ── 생활비 입금 섹션 ──
function buildDepositSection(depByPerson,st){
  const el=sec("💰 생활비 입금",h("button",{style:{fontSize:"11.5px",color:C.brand,fontWeight:"700",cursor:"pointer"},onclick:()=>showDepositGoal()},"목표 설정 ✎"));
  const goal=st.depositGoal||{"정근":0,"여친":0};
  ["정근","여친"].forEach(who=>{
    const g=Number(goal[who])||0,cur=depByPerson[who]||0;
    const pct=g>0?Math.min(100,Math.round(cur/g*100)):0,done=g>0&&cur>=g;
    el.append(h("div",{style:{marginBottom:"14px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"6px"}},
        h("span",{style:{fontSize:"13px",fontWeight:"700"}},(who==="정근"?"🧑 ":"👩 ")+who),
        h("span",{class:"num",style:{fontSize:"12.5px",color:C.sub}},g>0?`${W(cur)} / ${W(g)}`:W(cur))
      ),
      g>0?h("div",{style:{height:"9px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden"}},h("div",{style:{width:pct+"%",height:"100%",background:done?C.brand:C.warn,borderRadius:"999px",transition:"width .4s"}})):"",

  const drawKind=()=>{kindWrap.innerHTML="";SAV_KINDS.forEach(k=>{const on=kind===k;kindWrap.append(h("button",{style:{fontSize:"13px",padding:"8px 14px",borderRadius:"999px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{kind=k;drawKind();}},(SAV_ICON[k]||"")+" "+k));});};
  drawKind();
  const sv=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"8px"}},isEdit?"수정 저장":"추가하기");
  sv.onclick=async()=>{
    if(!nameEl.value.trim()){alert("이름을 입력해주세요.");return;}
    sv.disabled=true;sv.textContent="저장 중…";
    const payload={name:nameEl.value.trim(),kind,current_amount:Number(curEl.value)||0,target_amount:Number(tgtEl.value)||0,monthly_amount:Number(monEl.value)||0};
    let error;
    if(isEdit)({error}=await sb.from("savings").update(payload).eq("id",sv0.id));
    else({error}=await sb.from("savings").insert({...payload,is_active:true}));
    if(error){alert("저장 실패: "+error.message);sv.disabled=false;sv.textContent=isEdit?"수정 저장":"추가하기";return;}
    ov.remove();reloadAssets();
  };
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},isEdit?"저축 수정":"저축 추가"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{marginBottom:"13px"}},lbl("이름"),nameEl),
    h("div",{style:{marginBottom:"13px"}},lbl("종류"),kindWrap),
    h("div",{style:{marginBottom:"13px"}},lbl("현재 모은 금액"),curEl),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"4px"}},h("div",{},lbl("목표액"),tgtEl),h("div",{},lbl("매월 납입"),monEl)),
    isEdit?h("button",{style:{width:"100%",marginTop:"12px",fontSize:"13px",color:C.over,fontWeight:"700",padding:"11px",border:`1px solid ${C.over}`,borderRadius:"11px",background:C.w,cursor:"pointer"},onclick:async()=>{if(!confirm(`'${sv0.name}'을 삭제할까요?`))return;await sb.from("savings").update({is_active:false}).eq("id",sv0.id);ov.remove();reloadAssets();}},"🗑️ 삭제"):"",
    sv
  );
  ov.append(sh);document.body.append(ov);nameEl.focus();
}

// ── 더치페이 추가 (B방식: 전체 긁고 받을돈 빼기) ──
function showDutchAdd(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"55"},onclick:e=>{if(e.target===ov)ov.remove();}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"92vh",overflowY:"auto"}});
  const lbl=t=>h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.sub,marginBottom:"6px"}},t);
  let shareMode="인원",isShared=false,selCat="외식/배달";
  const totEl=h("input",{type:"number",inputmode:"numeric",placeholder:"총 결제액",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"15px",fontWeight:"700"}});
  const nEl=h("input",{type:"number",inputmode:"numeric",value:"2",min:"2",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const myEl=h("input",{type:"number",inputmode:"numeric",placeholder:"내 몫 직접 입력",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const placeEl=h("input",{type:"text",placeholder:"예: OO식당 회식",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const dt=h("input",{type:"date",value:(ym(td())===S.curYm?td():S.curYm+"-15"),style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const result=h("div",{style:{background:C.soft,borderRadius:"12px",padding:"13px 15px",marginTop:"4px",fontSize:"13px",lineHeight:"1.8"}});
  const modeRow=h("div",{style:{display:"flex",gap:"8px"}});
  const nBlock=h("div",{style:{marginBottom:"13px"}});
  const myBlock=h("div",{style:{marginBottom:"13px"}});
  const tgtRow=h("div",{style:{display:"flex",gap:"8px"}});
  const catWrap=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"7px"}});
  const calc=()=>{
    const tot=Number(totEl.value)||0;let my=0;
    if(shareMode==="인원"){const n=Math.max(2,Number(nEl.value)||2);my=Math.round(tot/n);}
    else my=Math.min(tot,Number(myEl.value)||0);
    const recv=Math.max(0,tot-my);
    result.innerHTML="";
    result.append(
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.sub}},"총 결제액"),h("span",{class:"num",style:{fontWeight:"700"}},W(tot))),
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.sub}},"내 몫 (실제 내 지출)"),h("span",{class:"num",style:{fontWeight:"800",color:C.ink}},W(my))),
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.brand,fontWeight:"700"}},"📥 받을 돈"),h("span",{class:"num",style:{fontWeight:"800",color:C.brand}},W(recv)))
    );
    return{tot,my,recv};
  };
  const drawMode=()=>{modeRow.innerHTML="";["인원","내몫직접"].forEach(m=>{const on=shareMode===m;modeRow.append(h("button",{style:{flex:"1",fontSize:"13.5px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:()=>{shareMode=m;refresh();}},m==="인원"?"➗ 인원수로 1/N":"✏️ 내 몫 직접"));});};
  const drawTgt=()=>{tgtRow.innerHTML="";[["개인","🧑 친구들과"],["공용","👫 여친과(공용)"]].forEach(([v,t])=>{const on=(v==="공용")===isShared;tgtRow.append(h("button",{style:{flex:"1",fontSize:"13px",fontWeight:"600",padding:"10px",borderRadius:"10px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:()=>{isShared=(v==="공용");drawTgt();}},t));});};
  const drawCats=()=>{catWrap.innerHTML="";CATS.forEach(c=>{const on=selCat===c.n;catWrap.append(h("button",{style:{fontSize:"12.5px",padding:"7px 11px",borderRadius:"999px",border:`1px solid ${on?c.c:C.line}`,background:on?c.c+"1A":C.w,color:on?c.c:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selCat=c.n;drawCats();}},c.i+" "+c.n));});};
  const refresh=()=>{drawMode();if(shareMode==="인원"){nBlock.style.display="";myBlock.style.display="none";}else{nBlock.style.display="none";myBlock.style.display="";}calc();};
  [totEl,nEl,myEl].forEach(el=>el.addEventListener("input",calc));
  drawTgt();drawCats();refresh();
  const sv=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"10px"}},"저장하기");
  sv.onclick=async()=>{
    const{tot,my,recv}=calc();
    if(!tot||tot<=0){alert("총 결제액을 입력해주세요.");return;}
    sv.disabled=true;sv.textContent="저장 중…";
    const hid=isShared?S.householdId:null;
    // 1) 전체 지출 기록 (카드값과 맞춰짐)
    const{error:e1}=await sb.from("transactions").insert({user_id:S.session.user.id,household_id:hid,date:dt.value,account:isShared?"공용":"개인",type:"소비(일시불)",amount:tot,category:selCat,merchant:placeEl.value.trim()||"더치페이",memo:`더치페이 총액(내몫 ${W(my)})`});
    // 2) 받을 돈 기록
    const{error:e2}=await sb.from("dutch_splits").insert({user_id:S.session.user.id,household_id:hid,date:dt.value,place:placeEl.value.trim()||"나눠내기",total:tot,my_share:my,to_receive:recv,is_shared:isShared,received:false});
    if(e1||e2){alert("저장 실패: "+((e1||e2).message));sv.disabled=false;sv.textContent="저장하기";return;}
    ov.remove();reloadAssets();
  };
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"🧾 나눠내기"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{fontSize:"12px",color:C.sub,marginBottom:"15px",lineHeight:"1.6"}},"내가 전체를 결제하고, 나중에 일부를 돌려받을 때 써요. 전체 금액은 기록되고, 내 소비엔 '내 몫'만 잡혀요."),
    h("div",{style:{marginBottom:"13px"}},lbl("총 결제액"),totEl),
    h("div",{style:{marginBottom:"13px"}},lbl("나누는 방식"),modeRow),
    nBlock.append(lbl("총 인원수 (나 포함)"),nEl)||nBlock,
    myBlock.append(lbl("내 몫"),myEl)||myBlock,
    h("div",{style:{marginBottom:"13px"}},lbl("누구랑?"),tgtRow),
    h("div",{style:{marginBottom:"13px"}},lbl("카테고리"),catWrap),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"13px"}},h("div",{},lbl("장소/메모"),placeEl),h("div",{},lbl("날짜"),dt)),
    lbl("정산 미리보기"),result,
    sv
  );
  ov.append(sh);document.body.append(ov);totEl.focus();
}

// ── 더치페이 받음 처리 ──
function showDutchReceive(d){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"60"},onclick:e=>{if(e.target===ov)ov.remove();}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"85vh",overflowY:"auto"}});
  const lbl=t=>h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.sub,marginBottom:"6px"}},t);
  let selAccId=S.accounts[0]?.id||null;
  const accWrap=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px"}});
  const drawAcc=()=>{accWrap.innerHTML="";if(!S.accounts.length){accWrap.append(h("div",{style:{fontSize:"12.5px",color:C.over}},"먼저 계좌를 추가해주세요."));return;}S.accounts.forEach(a=>{const on=selAccId===a.id;accWrap.append(h("button",{style:{fontSize:"13px",padding:"9px 14px",borderRadius:"11px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selAccId=a.id;drawAcc();}},(ACC_ICON[a.kind]||"🏦")+" "+a.name));});};
  drawAcc();
  const sv=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"10px"}},"받음 처리하기");
  sv.onclick=async()=>{
    if(!selAccId){alert("받은 계좌를 선택해주세요.");return;}
    sv.disabled=true;sv.textContent="처리 중…";
    const acc=S.accounts.find(a=>a.id===selAccId);
    // 1) 더치페이 받음 표시
    const{error:e1}=await sb.from("dutch_splits").update({received:true,received_account_id:selAccId}).eq("id",d.id);
    // 2) 계좌 잔액 +받을돈
    const{error:e2}=await sb.from("accounts").update({balance:Number(acc.balance||0)+Number(d.to_receive)}).eq("id",selAccId);
    // 3) 정산환급 기록 → 내 소비가 내 몫으로 줄어듦
    const{error:e3}=await sb.from("transactions").insert({user_id:S.session.user.id,household_id:d.is_shared?S.householdId:null,date:td(),account:d.is_shared?"공용":"개인",type:"정산환급",amount:Number(d.to_receive),category:"정산환급",merchant:(d.place||"더치페이")+" 정산받음",memo:"더치페이 환급"});
    if(e1||e2||e3){alert("처리 실패: "+((e1||e2||e3).message));sv.disabled=false;sv.textContent="받음 처리하기";return;}
    ov.remove();reloadAssets();
  };
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"📥 받음 처리"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{background:C.soft,borderRadius:"12px",padding:"13px 15px",marginBottom:"16px",fontSize:"13px",lineHeight:"1.7"}},h("div",{style:{fontWeight:"700",marginBottom:"4px"}},d.place||"나눠내기"),`받을 돈 `,h("span",{class:"num",style:{fontWeight:"800",color:C.brand}},W(d.to_receive)),`이 들어왔어요. 어느 계좌로 받았나요?`),
    lbl("받은 계좌"),accWrap,
    h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"10px",lineHeight:"1.6"}},"선택한 계좌 잔액이 늘어나고, 이번 달 소비에서 이 금액만큼 빠져서 '내 몫'만 남아요."),
    sv
  );
  ov.append(sh);document.body.append(ov);
}
