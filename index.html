// 가맹점명으로 카테고리 자동 추론
function autoClassify(merchant){
  if(!merchant)return null;
  const m=merchant.trim();
  const rules=allRules();
  // 키워드 길이 긴 순으로 매칭 (더 구체적인 규칙 우선)
  const keys=Object.keys(rules).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    if(m.includes(k)||k.includes(m.split("(")[0].split("*")[0].trim())){
      return rules[k];
    }
  }
  return null;
}

async function imgToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({b64:r.result.split(",")[1],mime:file.type||"image/jpeg"});
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function claudeVision(file,prompt){
  const key=getApiKey();
  if(!key)throw new Error("no_key");
  const{b64,mime}=await imgToB64(file);
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:mime,data:b64}},
      {type:"text",text:prompt}
    ]}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  const data=await resp.json();
  const txt=data.content?.find(c=>c.type==="text")?.text||"{}";
  try{return JSON.parse(txt.replace(/```json|```/g,"").trim());}
  catch{return{_raw:txt};}
}

// ── Yahoo Finance 주가 ──
async function fetchPrice(ticker){
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`,{mode:"cors"});
    const d=await r.json();
    const m=d.chart?.result?.[0]?.meta;
    if(!m)return null;
    return{price:m.regularMarketPrice,currency:m.currency,name:m.shortName||ticker,ticker};
  }catch{return null;}
}

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(p)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{if(k==null||k===false)return;e.append(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);});
  return e;
}

function calcStatsFor(txns){
  let pS=0,pR=0,cS=0,cR=0,inc=0,sav=0;
  for(const t of txns){const k=kindOf(t.type),a=Number(t.amount)||0;if(t.account==="공용"){if(k==="spend")cS+=a;else if(k==="reduce")cR+=a;}else{if(k==="spend")pS+=a;else if(k==="reduce")pR+=a;}if(k==="income")inc+=a;if(k==="save")sav+=a;}
  return{pNet:pS-pR,cNet:cS-cR,income:inc,save:sav,balance:inc-(pS-pR)-(cS-cR)-sav};
}

  return[hero,chips,insightSec,sharedSec,compSec,billSec,catSec,recSec];
}




// ── 월간 인사이트 (말로 된 분석) ──
function buildInsight(st,prevSt){
  const insights=[];
  const cur=st.pNet,prev=prevSt.pNet;

  // 1. 전월 대비 개인소비
  if(prev>0){
    const diff=cur-prev,pct=Math.round(Math.abs(diff)/prev*100);
    if(Math.abs(pct)>=10){
      if(diff>0)insights.push({icon:"📈",tone:"warn",text:`개인 소비가 지난달보다 ${pct}% 늘었어요 (${W(Math.abs(diff))} 증가)`});
      else insights.push({icon:"📉",tone:"good",text:`개인 소비가 지난달보다 ${pct}% 줄었어요 (${W(Math.abs(diff))} 절약). 잘하고 있어요!`});
    }else{
      insights.push({icon:"➡️",tone:"neutral",text:`개인 소비가 지난달과 비슷해요 (${W(cur)})`});
    }
  }

  // 2. 카테고리 TOP + 비중
  const cagg={};
  for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;cagg[t.category]=(cagg[t.category]||0)+(Number(t.amount)||0);}
  const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]);
  if(crows.length){
    const[topCat,topAmt]=crows[0];
    const pct=cur>0?Math.round(topAmt/cur*100):0;
    const c=CM[topCat]||CM["기타"];
    insights.push({icon:c.i,tone:"neutral",text:`이번 달 가장 많이 쓴 곳은 ${topCat} (${W(topAmt)}, 전체의 ${pct}%)`});
  }

  // 3. 카테고리별 전월 대비 급증 감지
  const prevCagg={};
  for(const t of S.prevTxns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;prevCagg[t.category]=(prevCagg[t.category]||0)+(Number(t.amount)||0);}
  let maxJump=null;
  for(const[cat,amt] of crows){
    const pAmt=prevCagg[cat]||0;
    if(pAmt>10000&&amt>pAmt*1.5){
      const jump=amt-pAmt;
      if(!maxJump||jump>maxJump.jump)maxJump={cat,jump,amt,pAmt};
    }
  }
  if(maxJump){
    const c=CM[maxJump.cat]||CM["기타"];
    insights.push({icon:"⚠️",tone:"warn",text:`${maxJump.cat} 지출이 지난달의 ${Math.round(maxJump.amt/maxJump.pAmt*10)/10}배로 늘었어요 (${W(maxJump.pAmt)}→${W(maxJump.amt)})`});
  }

  // 4. 수입 대비 지출
  if(st.income>0){
    const rate=Math.round((cur+st.cNet)/st.income*100);
    if(rate>100)insights.push({icon:"🔴",tone:"warn",text:`이번 달 수입보다 지출이 많아요 (지출이 수입의 ${rate}%)`});
    else if(rate<=60)insights.push({icon:"💰",tone:"good",text:`수입의 ${rate}%만 썼어요. 저축 여력이 좋아요!`});
  }

  // 5. 예산 경고
  if(S.budget>0){
    const used=cur/S.budget;
    const isCur=S.curYm===ym(td());
    const dl=isCur?new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate():0;
    if(used>=1)insights.push({icon:"🚨",tone:"warn",text:`예산을 ${W(cur-S.budget)} 초과했어요`});
    else if(used>=0.8&&dl>5)insights.push({icon:"⏰",tone:"warn",text:`예산의 ${Math.round(used*100)}%를 썼는데 아직 ${dl}일 남았어요. 페이스 조절이 필요해요`});
  }

  if(!insights.length)return null;

  const el=sec("💡 이번 달 인사이트","");
  const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"9px"}});
  const toneColor={good:C.brand,warn:C.over,neutral:C.sub};
  const toneBg={good:"#EDFBF4",warn:"#FFF4F1",neutral:"#F6F4EF"};
  insights.forEach(ins=>{
    list.append(h("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:toneBg[ins.tone]||"#F6F4EF"}},
      h("span",{style:{fontSize:"15px",flexShrink:"0"}},ins.icon),
      h("span",{style:{fontSize:"13px",lineHeight:"1.5",color:C.ink}},ins.text)
    ));
  });
  el.append(list);
  return el;
}

        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},
          h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700"}},W(fc.amount)),
          h("span",{style:{fontSize:"11px",color:paid?C.brand:C.faint}},paid?"✅":"⏳")
        )

    });
    fixedRows.append(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"7px 4px",fontSize:"12.5px",fontWeight:"700"}},
      h("span",{style:{color:C.sub}},"고정비 합계"),
      h("span",{class:"num"},W(fixedTotal))

    el.append(fixedRows);

    // 변동비

  }

  // 예산 게이지
  if(budget>0){
    el.append(

// ── 달력 뷰 ──
function buildCalendarView(){
  const[yr,mo]=S.curYm.split("-").map(Number);
  const firstDay=new Date(yr,mo-1,1).getDay();// 0=일
  const lastDate=new Date(yr,mo,0).getDate();
  const todayStr=td();

  // 날짜별 거래 집계
  const byDate={};
  for(const t of S.txns){
    if(!byDate[t.date])byDate[t.date]={spend:0,income:0,txns:[]};
    const k=kindOf(t.type);
    if(k==="spend")byDate[t.date].spend+=Number(t.amount)||0;
    else if(k==="income"||k==="reduce")byDate[t.date].income+=Number(t.amount)||0;
    byDate[t.date].txns.push(t);
  }

  // 월간 요약
  const totalSpend=Object.values(byDate).reduce((s,d)=>s+d.spend,0);
  const totalIncome=Object.values(byDate).reduce((s,d)=>s+d.income,0);
  const net=totalIncome-totalSpend;

  const summary=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}},
    h("div",{style:{background:"#FFF1EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.over,marginBottom:"3px",fontWeight:"600"}},"💸 이달 지출"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.over}},W(totalSpend))
    ),
    h("div",{style:{background:"#EDFBF4",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.brand,marginBottom:"3px",fontWeight:"600"}},"💼 이달 수입"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},W(totalIncome))
    ),
    h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.sub,marginBottom:"3px",fontWeight:"600"}},net>=0?"잔여":"적자"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:net>=0?C.brand:C.over}},W(Math.abs(net)))
    )
  );

  // 달력 그리드
  const cal=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"14px 12px"}});
  
  // 요일 헤더
  const hdr=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",marginBottom:"4px"}});
  ["월","화","수","목","금","토","일"].forEach((d,i)=>
    hdr.append(h("div",{style:{textAlign:"center",fontSize:"11px",color:i>=5?"#B23A5C":C.faint,fontWeight:"700",padding:"3px 0"}},d))
  );

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px"}});
  
  // 시작 오프셋 (월요일 기준)
  const offset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<offset;i++)grid.append(h("div",{}));

  for(let d=1;d<=lastDate;d++){
    const dateStr=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const data=byDate[dateStr]||null;
    const isToday=dateStr===todayStr;
    const dow=(offset+d-1)%7;
    const isSun=dow===6,isSat=dow===5;

    const cell=h("div",{
      style:{
        padding:"3px 2px",borderRadius:"8px",textAlign:"center",
        cursor:data?"pointer":"default",
        background:isToday?C.brand:"transparent",
        minHeight:"55px",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"flex-start",gap:"2px"
      },
      onclick:data?()=>showDayDetail(dateStr,data.txns):null
    },
      h("div",{style:{
        fontSize:"13px",fontWeight:isToday?"800":"500",lineHeight:"1.6",
        color:isToday?C.w:isSun?"#B23A5C":isSat?"#4169B1":C.ink
      }},d),
      data&&data.spend>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.over,lineHeight:"1.2",fontWeight:"600"}},"-"+shortNum(data.spend)):"",
      data&&data.income>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.brand,lineHeight:"1.2",fontWeight:"600"}},"+"+shortNum(data.income)):""
    );
    if(!isToday&&data){
      cell.addEventListener("mouseenter",e=>{e.currentTarget.style.background="#F0EDE5";});
      cell.addEventListener("mouseleave",e=>{e.currentTarget.style.background="transparent";});
    }
    grid.append(cell);
  }
  cal.append(hdr,grid);

  // 범례
  const legend=h("div",{style:{display:"flex",gap:"16px",justifyContent:"center",marginTop:"10px",fontSize:"11.5px",color:C.sub}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.over,fontWeight:"700"}},"-"),"지출"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.brand,fontWeight:"700"}},"+"),"수입"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{background:C.brand,width:"10px",height:"10px",borderRadius:"50%",display:"inline-block"}}),"오늘")
  );

  return[summary,cal,legend];
}

  const max=Math.max(...data,1);
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:"4px",height:"110px"}},
    ...data.map((v,i)=>{
      const pct=v>0?Math.max((v/max)*100,4):0;

        v>0
          ?h("div",{style:{width:"100%",height:pct+"%",background:isHL?C.brand:C.brand+"55",borderRadius:"3px 3px 0 0",minHeight:"3px",transition:"height .4s"}})
          :h("div",{style:{width:"100%",height:"2px",background:C.line,borderRadius:"1px"}}),
        h("div",{style:{fontSize:"9.5px",color:isHL?C.ink:C.faint,fontWeight:isHL?"800":"400",lineHeight:"1"}},String(i+1))
      );
    })
  );
}

// ── 연간 탭 ──
function buildYearly(){
  const yr=S.curYm.slice(0,4);
  const curM=parseInt(S.curYm.split("-")[1])-1;
  let mode="개인소비"; // 개인소비 | 공용소비 | 수입

  const kindForMode=m=>({"개인소비":"spend","공용소비":"spend","수입":"income"})[m];
  const accForMode=m=>({"개인소비":"개인","공용소비":"공용","수입":null})[m];

  const getMonthly=()=>{
    const arr=Array(12).fill(0);
    const kind=kindForMode(mode),acc=accForMode(mode);
    for(const t of S.yearTxns){
      if(kindOf(t.type)!==kind)continue;
      if(acc&&t.account!==acc)continue;
      const m=parseInt(t.date.slice(5,7))-1;
      if(m>=0&&m<12)arr[m]+=Number(t.amount)||0;
    }
    return arr;
  };

  const container=h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}});
  const draw=()=>{
    container.innerHTML="";
    const monthly=getMonthly();
    const total=monthly.reduce((s,v)=>s+v,0);
    const avg=monthly.filter(v=>v>0).length?Math.round(total/monthly.filter(v=>v>0).length):0;
    const maxM=monthly.indexOf(Math.max(...monthly));

    // 헤더 카드
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"18px 18px 14px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px"}},
        h("div",{},
          h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"4px"}},yr+"년 "+mode+" 합계"),
          h("div",{class:"num",style:{fontSize:"28px",fontWeight:"800",letterSpacing:"-.03em"}},W(total))
        ),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:"11.5px",color:C.sub}},"월평균"),
          h("div",{class:"num",style:{fontSize:"16px",fontWeight:"700",marginTop:"3px"}},W(avg))
        )
      ),
      barChart(monthly,curM),
      h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"10px",textAlign:"center"}},
        maxM>=0&&monthly[maxM]>0?`최대 지출: ${maxM+1}월 (${W(monthly[maxM])})`:""
      )
    ));

    // 모드 토글
    const toggleRow=h("div",{style:{display:"flex",gap:"8px"}});
    ["개인소비","공용소비","수입"].forEach(m=>{
      const sel=mode===m;
      toggleRow.append(h("button",{
        style:{flex:"1",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${sel?C.ink:C.line}`,background:sel?C.ink:C.w,color:sel?C.w:C.sub,cursor:"pointer"},
        onclick:()=>{mode=m;draw();}
      },m));
    });
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"14px",padding:"14px"}},toggleRow));

    // 월별 리스트
    const listSec=sec("월별 내역","");
    const listEl=h("div",{style:{display:"flex",flexDirection:"column",gap:"2px"}});
    monthly.forEach((v,i)=>{
      if(v===0&&i>curM)return;
      const isHL=i===curM;
      listEl.append(h("div",{
        style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 4px",borderBottom:`1px solid ${C.line}`,background:isHL?C.soft:"transparent",borderRadius:isHL?"6px":"0",paddingLeft:isHL?"8px":"4px"}},
        h("span",{style:{fontSize:"13px",color:isHL?C.brand:C.ink,fontWeight:isHL?"700":"400"}},(i+1)+"월"+(isHL?" (이번달)":"")),
        h("span",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:v>0?(isHL?C.brand:C.ink):C.faint}},v>0?W(v):"—")
      ));
    });
    listSec.append(listEl);
    container.append(listSec);

    // 카테고리 연간 순위 (개인소비만)
    if(mode==="개인소비"){
      const cagg={};
      for(const t of S.yearTxns){
        if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;
        cagg[t.category]=(cagg[t.category]||0)+Number(t.amount);
      }
      const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(crows.length){
        const cSec=sec(yr+"년 지출 TOP 카테고리","");
        const cmax=crows[0][1];
        crows.forEach(([n,v])=>{
          const c=CM[n]||CM["기타"];
          cSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 4px"}},
            h("span",{style:{fontSize:"14px",width:"20px",textAlign:"center"}},c.i),
            h("div",{style:{flex:"1"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}},
                h("span",{style:{fontSize:"12.5px"}},n),
                h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700"}},W(v))
              ),
              h("div",{style:{height:"6px",borderRadius:"999px",background:"#F2EEE6",overflow:"hidden"}},
                h("div",{style:{width:Math.max(5,(v/cmax)*100)+"%",height:"100%",background:c.c,borderRadius:"999px"}})
              )
            )
          ));
        });
        container.append(cSec);
      }
    }
  };
  draw();
  return[container];
}

// ── 거래 검색 ──
function showSearch(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"50"},onclick:e=>{if(e.target===ov)ov.remove();}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"90vh",overflowY:"auto"}});
  const resultEl=h("div",{style:{marginTop:"12px"}});

  const inp=h("input",{type:"text",placeholder:"가맹점, 카테고리, 메모 검색…",autocomplete:"off",style:{width:"100%",border:`1px solid ${C.brand}`,borderRadius:"12px",padding:"12px 14px",fontSize:"15px",outline:"none"}});
  inp.oninput=e=>{
    clearTimeout(timer);
    const q=e.target.value.trim();
    if(q.length<2){resultEl.innerHTML="";return;}
    resultEl.innerHTML='<div class="center"><div class="spin"></div></div>';
    timer=setTimeout(async()=>{
      const{data}=await sb.from("transactions").select("*").or(`merchant.ilike.%${q}%,memo.ilike.%${q}%,category.ilike.%${q}%`).order("date",{ascending:false}).limit(60);

      resultEl.innerHTML="";

      const total=results.reduce((s,t)=>s+Number(t.amount),0);
      resultEl.append(h("div",{style:{fontSize:"12.5px",color:C.sub,padding:"0 2px 8px",display:"flex",justifyContent:"space-between"}},
        h("span",{},`${results.length}건`),h("span",{class:"num"},`합계 ${W(total)}`)
      ));
      const reloadSearch=async()=>{
        const q2=inp.value.trim();
        if(q2.length<2)return;
        const{data:d2}=await sb.from("transactions").select("*").or(`merchant.ilike.%${q2}%,memo.ilike.%${q2}%,category.ilike.%${q2}%`).order("date",{ascending:false}).limit(60);
        resultEl.innerHTML="";
        (d2||[]).forEach(drawRow);
        await loadMonth();
        const ct=document.getElementById("ct");
        if(ct){ct.innerHTML="";buildHome().forEach(n=>ct.append(n));}
      };
      const drawRow=t=>{
        const c=CM[t.category]||CM["기타"],k=kindOf(t.type);
        const cl=k==="income"||k==="reduce"?C.brand:C.ink;
        const sg=k==="income"||k==="reduce"?"+":k==="spend"?"−":"";
        resultEl.append(h("div",{
          style:{display:"flex",alignItems:"center",gap:"11px",padding:"10px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .12s",borderRadius:"4px"},
          onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
          onmouseleave:e=>{e.currentTarget.style.background="transparent";},
          onclick:()=>showEditTxn(t,reloadSearch)
        },
          h("div",{style:{width:"32px",height:"32px",borderRadius:"9px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",flexShrink:"0"}},c.i),
          h("div",{style:{flex:"1",minWidth:"0"}},
            h("div",{style:{fontSize:"13.5px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
            h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.account} · ${t.category}`)
          ),
          h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
            h("div",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`),
            h("span",{style:{fontSize:"12px",color:C.faint}},"›")
          )
        ));
      };
      results.forEach(drawRow);
    },300);
  };

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},
      h("span",{style:{fontSize:"17px",fontWeight:"800"}},"🔍 거래 검색"),
      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    inp,
    h("div",{style:{fontSize:"12px",color:C.faint,marginTop:"6px",paddingLeft:"2px"}},"가맹점 · 카테고리 · 메모 검색 · 2자 이상 입력"),
    resultEl
  );
  ov.append(sh);document.body.append(ov);
  setTimeout(()=>inp.focus(),100);
}

// ── 전월비교 ──
function buildComparison(cur,prev){
  const pym=shYm(S.curYm,-1);
  const hasPrev=S.prevTxns.length>0;
  const el=sec("전월 비교",hasPrev?yml(pym)+" 대비":"데이터 없음");
  if(!hasPrev){el.append(h("div",{style:{textAlign:"center",color:C.faint,fontSize:"13px",padding:"10px 0",lineHeight:"1.7"}},"전달 거래내역이 없어요.",h("br"),"데이터가 쌓이면 자동으로 표시돼요 📈"));return el;}
  const items=[{lbl:"개인 소비",cur:cur.pNet,prev:prev.pNet,icon:"💸",goodUp:false},{lbl:"공용 소비",cur:cur.cNet,prev:prev.cNet,icon:"🤝",goodUp:false},{lbl:"수입",cur:cur.income,prev:prev.income,icon:"💼",goodUp:true}];
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}});
  items.forEach(({lbl,cur:c,prev:p,icon,goodUp})=>{
    const diff=c-p,pct=p>0?Math.round((diff/p)*100):null,up=diff>0;
    const good=diff===0?null:(goodUp?up:!up);
    const tc=good===null?C.sub:good?C.brand:C.over;
    const arrow=diff===0?"─":up?"↑":"↓";
    const diffStr=diff===0?"변화없음":W(Math.abs(diff)).slice(1)+(pct!==null?` (${Math.abs(pct)}%)`:"");
    grid.append(h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10.5px",color:C.sub,marginBottom:"5px"}},icon+"  "+lbl),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.ink,marginBottom:"4px"}},W(c)),
      h("div",{style:{fontSize:"11px",fontWeight:"700",color:tc}},h("span",{style:{marginRight:"3px"}},arrow),diffStr)
    ));
  });
  el.append(grid);return el;
}

청구 예정액 또는 이번달 청구액 기준. 금액은 원화 숫자만.`;

      // 이미지 미리보기

      if(result.amount){
        // 추출 결과 표시 + 확인 폼

        const amtEl=h("input",{type:"number",value:result.amount||"",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px",marginBottom:"10px"}});

        saveBtn.onclick=async()=>{
          const a=Number(amtEl.value);if(!a)return;

    fxRow.append(h("div",{style:{fontSize:"12px",color:C.sub,alignSelf:"center"}},"환율 (원/$)"),fxEl);

    resultEl.append(wrap);
  };

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
      h("span",{style:{fontSize:"17px",fontWeight:"800"}},"💳 실제 카드대금 입력"),
      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    uploadArea,fileInp,resultEl
  );
  // 처음에 직접입력 폼도 바로 보여주기
  renderManualForm();
  ov.append(sh);document.body.append(ov);
}

// ── 고정비 탭 ──
function detectPaid(fc){
  // 이번 달 transactions에서 카테고리+금액+계정으로 납부 여부 감지
  // 고정비 등록은 소비 집계에 영향 없음 — transactions에 실제 거래가 있을 때만 납부됨
  return S.txns.some(t=>{
    const a=Number(t.amount),fa=Number(fc.amount);
    const catMatch=t.category===fc.category;
    const amtMatch=fa>0&&Math.abs(a-fa)/fa<0.45;// 45% 허용 (관리비처럼 변동 있는 것도 감지)
    const accMatch=t.account===fc.account;
    return catMatch&&amtMatch&&accMatch;
  });
}

function buildFixed(){
  const fcs=S.fixedCosts;
  const withStatus=fcs.map(fc=>({...fc,paid:detectPaid(fc)}));
  const total=withStatus.reduce((s,fc)=>s+Number(fc.amount),0);
  const paidAmt=withStatus.filter(fc=>fc.paid).reduce((s,fc)=>s+Number(fc.amount),0);
  const unpaidAmt=total-paidAmt;
  const paidPct=total>0?Math.round(paidAmt/total*100):0;
  const unpaidList=withStatus.filter(fc=>!fc.paid);
  const paidList=withStatus.filter(fc=>fc.paid);

  // 헤더 카드
  const hero=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 고정비 합계"),
    h("div",{class:"num",style:{fontSize:"36px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1",marginBottom:"16px"}},W(total)),
    h("div",{style:{height:"11px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden",marginBottom:"10px"}},
      h("div",{style:{width:`${paidPct}%`,height:"100%",background:C.brand,borderRadius:"999px",transition:"width .5s"}})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}},
      h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"✅ 납부 완료"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(paidAmt)),
        h("div",{style:{fontSize:"11.5px",color:C.brand,marginTop:"2px"}},`${paidList.length}건 · ${paidPct}%`)
      ),
      h("div",{style:{background:unpaidAmt>0?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:unpaidAmt>0?C.over:C.faint,fontWeight:"700",marginBottom:"4px"}},unpaidAmt>0?"⏳ 미납":"🎉 전액 납부"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:unpaidAmt>0?C.over:C.faint}},W(unpaidAmt)),
        h("div",{style:{fontSize:"11.5px",color:unpaidAmt>0?C.over:C.faint,marginTop:"2px"}},`${unpaidList.length}건`)
      )
    )
  );

  // 고정비 없을 때 → 추천 목록 클릭 추가
  if(!fcs.length){
    const emptySec=sec("고정비 목록","");
    emptySec.append(
      h("div",{style:{textAlign:"center",padding:"16px 0 10px",color:C.sub}},
        h("div",{style:{fontSize:"28px",marginBottom:"6px"}},"📋"),
        h("div",{style:{fontSize:"14px",fontWeight:"700"}},"등록된 고정비가 없어요"),
        h("div",{style:{fontSize:"12px",color:C.faint,marginTop:"3px"}},"아래 추천 항목을 탭하면 바로 추가돼요")
      ),
      // 작동 방식 안내
      h("div",{style:{background:"#EEF5F1",borderRadius:"12px",padding:"13px 15px",margin:"10px 0 14px",fontSize:"12.5px",lineHeight:"1.8",color:"#1A5E44"}},
        "💡 ",h("strong",{},"고정비 탭은 소비를 잡지 않아요"),h("br"),
        "실제 소비는 카드/은행 거래가 들어올 때 잡히고,",h("br"),
        "여기서는 그 거래가 납부됐는지 자동으로 감지해줘요.",h("br"),h("br"),
        "• ",h("strong",{},"공용 고정비"),": 공용통장 출금 → 납부됨 감지",h("br"),
        "• ",h("strong",{},"개인 고정비"),": 카드/카카오뱅크 출금 → 납부됨 감지",h("br"),
        "• 내통장→공용통장 이체는 이체(제외)로 처리돼요 ✅"
      )
    );
    // 추천 항목 클릭 카드
    const sugList=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    const existingNames=fcs.map(f=>f.name);
    SUGGESTED_FC.forEach(sg=>{
      if(existingNames.includes(sg.name))return;
      const c=CM[sg.category]||CM["기타"];
      const card=h("div",{
        style:{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",borderRadius:"12px",background:"#F6F4EF",border:`1px solid ${C.line}`,cursor:"pointer",transition:"all .12s"},
        onmouseenter:e=>{e.currentTarget.style.background=C.soft;e.currentTarget.style.borderColor=C.brand;},
        onmouseleave:e=>{e.currentTarget.style.background="#F6F4EF";e.currentTarget.style.borderColor=C.line;},
        onclick:()=>showAddFixed(sg)
      },
        h("div",{style:{width:"36px",height:"36px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"17px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"13.5px",fontWeight:"700"}},sg.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},
            W(sg.amount)+" · "+sg.account+(sg.billing_day?" · 매월 "+sg.billing_day+"일":"")
          )
        ),
        h("div",{style:{fontSize:"11.5px",fontWeight:"700",color:C.brand,padding:"5px 10px",borderRadius:"8px",background:C.soft,whiteSpace:"nowrap"}},"＋ 추가")
      );
      sugList.append(card);
    });
    emptySec.append(sugList);
    return[hero,emptySec];
  }

  // 고정비 있을 때도 추가 안 된 추천 항목 보여주기
  const existingNames=withStatus.map(f=>f.name);
  const remainingSug=SUGGESTED_FC.filter(sg=>!existingNames.includes(sg.name));

  const reloadFixed=async()=>{
    await Promise.all([loadFixed(),loadMonth()]);
    const ct=document.getElementById("ct");
    if(ct){ct.innerHTML="";buildFixed().forEach(n=>ct.append(n));}
  };

  const buildRow=(fc)=>{
    const c=CM[fc.category]||CM["기타"];
    const paid=fc.paid;
    const dayStr=fc.billing_day?`매월 ${fc.billing_day}일`:"";
    const delBtn=h("button",{style:{color:C.faint,fontSize:"14px",padding:"6px",flexShrink:"0"},onclick:async(e)=>{

        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(fc.amount)),
        h("div",{style:{fontSize:"11px",marginTop:"3px",fontWeight:"700",color:paid?C.brand:C.over}},paid?"✅ 납부됨":"⏳ 미납")
      ),
      delBtn
    );
  };

  // 미납 섹션 먼저
  const sections=[];
  if(unpaidList.length){
    const unSec=sec(h("span",{style:{color:C.over}},"⏳ 미납"),`${unpaidList.length}건 · ${W(unpaidAmt).slice(1)}`);
    unpaidList.forEach(fc=>unSec.append(buildRow(fc)));
    sections.push(unSec);
  }
  if(paidList.length){
    const pSec=sec("✅ 납부 완료",`${paidList.length}건 · ${W(paidAmt).slice(1)}`);
    paidList.forEach(fc=>pSec.append(buildRow(fc)));
    sections.push(pSec);
  }

  // 더 추가할 추천 항목
  if(remainingSug.length){
    const moreSec=sec("빠른 추가","탭하면 바로 추가");
    const moreList=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    remainingSug.forEach(sg=>{

      ));
    });

    sections.push(moreSec);
  }
  return[hero,...sections];
}

function showHoldingsCalc(onResult){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"60"},onclick:e=>{if(e.target===ov)ov.remove();}});

  let holdings=getHoldings();
  const listEl=h("div",{style:{display:"flex",flexDirection:"column",gap:"8px",marginBottom:"12px"}});
  const totalEl=h("div",{style:{fontSize:"13px",color:C.sub,padding:"8px 0"}});

  const drawList=()=>{
    listEl.innerHTML="";
    holdings.forEach((hld,i)=>{
      const row=h("div",{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 80px 30px",gap:"6px",alignItems:"center"}},
        h("div",{style:{fontSize:"13px",fontWeight:"600"}},hld.name||hld.ticker),
        h("div",{class:"num",style:{fontSize:"12px",color:C.sub}},`${hld.qty}주`),
        h("div",{class:"num",style:{fontSize:"12px",color:hld.curPrice?C.ink:C.faint}},hld.curPrice?("$"+hld.curPrice.toFixed(2)):"—"),
        h("div",{class:"num",style:{fontSize:"12px",fontWeight:"700",color:hld.curKrw?C.ink:C.faint}},hld.curKrw?W(Math.round(hld.curKrw)):"—"),
        h("button",{style:{color:C.faint,fontSize:"14px"},onclick:()=>{holdings.splice(i,1);saveHoldings(holdings);drawList();}},"✕")
      );
      listEl.append(row);
    });
    const total=holdings.reduce((s,hld)=>s+(hld.curKrw||0),0);
    const invested=holdings.reduce((s,hld)=>s+(hld.qty*(hld.avgPrice||0)*(hld.fx||1)),0);
    const pl=total-invested;
    const rate=invested>0?((pl/invested)*100):0;
    totalEl.innerHTML="";
    if(total>0){
      totalEl.append(
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginTop:"8px"}},
          h("div",{style:{background:"#F6F4EF",borderRadius:"10px",padding:"10px"}},h("div",{style:{fontSize:"10px",color:C.sub}},"총평가액"),h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800"}},W(Math.round(total)))),
          h("div",{style:{background:"#F6F4EF",borderRadius:"10px",padding:"10px"}},h("div",{style:{fontSize:"10px",color:C.sub}},"손익"),h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800",color:pl>=0?C.brand:C.over}},W(Math.round(pl)))),
          h("div",{style:{background:"#F6F4EF",borderRadius:"10px",padding:"10px"}},h("div",{style:{fontSize:"10px",color:C.sub}},"수익률"),h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800",color:rate>=0?C.brand:C.over}},rate.toFixed(1)+"%"))
        )
      );
    }
  };
  drawList();

  // 종목 추가 폼
  const tkEl=h("input",{type:"text",placeholder:"티커 (예: AAPL, 005930.KS)",style:{flex:"2",border:`1px solid ${C.line}`,borderRadius:"8px",padding:"9px 10px",fontSize:"13px"}});
  const qEl=h("input",{type:"number",placeholder:"수량",style:{flex:"1",border:`1px solid ${C.line}`,borderRadius:"8px",padding:"9px 10px",fontSize:"13px"}});
  const avgEl=h("input",{type:"number",placeholder:"평단(달러/원)",style:{flex:"1",border:`1px solid ${C.line}`,borderRadius:"8px",padding:"9px 10px",fontSize:"13px"}});
  const addBtn=h("button",{style:{fontSize:"13px",fontWeight:"700",padding:"9px 14px",borderRadius:"8px",background:C.brand,color:C.w,border:"none",cursor:"pointer"}},"추가");
  addBtn.onclick=()=>{
    const tk=tkEl.value.trim().toUpperCase(),qty=Number(qEl.value);
    if(!tk||!qty)return;
    holdings.push({ticker:tk,name:tk,qty,avgPrice:Number(avgEl.value)||0,curPrice:null,curKrw:null,fx:1});
    saveHoldings(holdings);tkEl.value="";qEl.value="";avgEl.value="";drawList();
  };

  const fetchBtn=h("button",{style:{width:"100%",border:`1px solid ${C.brand}`,borderRadius:"11px",padding:"11px",fontSize:"14px",fontWeight:"700",color:C.brand,background:C.soft,cursor:"pointer",marginBottom:"10px"}},"📈 현재 주가 가져오기");
  fetchBtn.onclick=async()=>{
    fetchBtn.textContent="불러오는 중…";fetchBtn.disabled=true;
    // 환율 먼저 가져오기
    let usdKrw=1380;
    try{const fx=await fetchPrice("USDKRW=X");if(fx?.price)usdKrw=fx.price;}catch{}
    
    for(const hld of holdings){
      const r=await fetchPrice(hld.ticker);
      if(r){
        hld.curPrice=r.price;
        hld.name=r.name||hld.ticker;
        // USD면 원화 환산, KRW면 그대로
        hld.fx=r.currency==="KRW"?1:usdKrw;
        hld.curKrw=r.price*(hld.fx)*hld.qty;
        // 평단도 같은 통화 기준으로 원화 환산
        if(hld.avgPrice)hld.avgPriceKrw=hld.avgPrice*(r.currency==="KRW"?1:usdKrw);
      }
    }
    saveHoldings(holdings);drawList();
    fetchBtn.textContent="📈 현재 주가 가져오기";fetchBtn.disabled=false;
    
    // CORS 실패 시 안내
    const hasData=holdings.some(hld=>hld.curPrice);
