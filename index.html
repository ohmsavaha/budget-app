// ── 더치페이 추가 (B방식: 전체 긁고 받을돈 빼기) ──
function showDutchAdd(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"55"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"92vh",overflowY:"auto"}});
  const lbl=t=>h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.sub,marginBottom:"6px"}},t);
  let shareMode="인원",isShared=false,selCat="외식/배달";
  const totEl=h("input",{type:"number",inputmode:"numeric",placeholder:"총 결제액",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"15px",fontWeight:"700"}});
  const nEl=h("input",{type:"number",inputmode:"numeric",value:"2",min:"2",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const myEl=h("input",{type:"number",inputmode:"numeric",placeholder:"내 몫 직접 입력",class:"num",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const placeEl=h("input",{type:"text",placeholder:"예: OO식당 회식",style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const dt=h("input",{type:"date",value:(ym(td())===S.curYm?td():S.curYm+"-15"),style:{width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"11px 12px",fontSize:"14px"}});
  const result=h("div",{style:{background:C.soft,borderRadius:"12px",padding:"13px 15px",marginTop:"4px",fontSize:"13px",lineHeight:"1.8"}});
  const modeRow=h("div",{style:{display:"flex",gap:"8px"}});
  const nBlock=h("div",{style:{marginBottom:"13px"}});
  const myBlock=h("div",{style:{marginBottom:"13px"}});
  const tgtRow=h("div",{style:{display:"flex",gap:"8px"}});
  const catWrap=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"7px"}});
  const calc=()=>{
    const tot=Number(totEl.value)||0;let my=0;
    if(shareMode==="인원"){const n=Math.max(2,Number(nEl.value)||2);my=Math.round(tot/n);}
    else my=Math.min(tot,Number(myEl.value)||0);
    const recv=Math.max(0,tot-my);
    result.innerHTML="";
    result.append(
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.sub}},"총 결제액"),h("span",{class:"num",style:{fontWeight:"700"}},W(tot))),
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.sub}},"내 몫 (실제 내 지출)"),h("span",{class:"num",style:{fontWeight:"800",color:C.ink}},W(my))),
      h("div",{style:{display:"flex",justifyContent:"space-between"}},h("span",{style:{color:C.brand,fontWeight:"700"}},"📥 받을 돈"),h("span",{class:"num",style:{fontWeight:"800",color:C.brand}},W(recv)))
    );
    return{tot,my,recv};
  };
  const drawMode=()=>{modeRow.innerHTML="";["인원","내몫직접"].forEach(m=>{const on=shareMode===m;modeRow.append(h("button",{style:{flex:"1",fontSize:"13.5px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:()=>{shareMode=m;refresh();}},m==="인원"?"➗ 인원수로 1/N":"✏️ 내 몫 직접"));});};
  const drawTgt=()=>{tgtRow.innerHTML="";[["개인","🧑 친구들과"],["공용","👫 여친과(공용)"]].forEach(([v,t])=>{const on=(v==="공용")===isShared;tgtRow.append(h("button",{style:{flex:"1",fontSize:"13px",fontWeight:"600",padding:"10px",borderRadius:"10px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:()=>{isShared=(v==="공용");drawTgt();}},t));});};
  const drawCats=()=>{catWrap.innerHTML="";CATS.forEach(c=>{const on=selCat===c.n;catWrap.append(h("button",{style:{fontSize:"12.5px",padding:"7px 11px",borderRadius:"999px",border:`1px solid ${on?c.c:C.line}`,background:on?c.c+"1A":C.w,color:on?c.c:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selCat=c.n;drawCats();}},c.i+" "+c.n));});};
  const refresh=()=>{drawMode();if(shareMode==="인원"){nBlock.style.display="";myBlock.style.display="none";}else{nBlock.style.display="none";myBlock.style.display="";}calc();};
  [totEl,nEl,myEl].forEach(el=>el.addEventListener("input",calc));
  drawTgt();drawCats();refresh();
  const sv=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"10px"}},"저장하기");
  sv.onclick=async()=>{
    const{tot,my,recv}=calc();
    if(!tot||tot<=0){alert("총 결제액을 입력해주세요.");return;}
    sv.disabled=true;sv.textContent="저장 중…";
    const hid=isShared?S.householdId:null;
    // 1) 전체 지출 기록 (카드값과 맞춰짐)
    const{error:e1}=await sb.from("transactions").insert({user_id:S.session.user.id,household_id:hid,date:dt.value,account:isShared?"공용":"개인",type:"소비(일시불)",amount:tot,category:selCat,merchant:placeEl.value.trim()||"더치페이",memo:`더치페이 총액(내몫 ${W(my)})`});
    // 2) 받을 돈 기록
    const{error:e2}=await sb.from("dutch_splits").insert({user_id:S.session.user.id,household_id:hid,date:dt.value,place:placeEl.value.trim()||"나눠내기",total:tot,my_share:my,to_receive:recv,is_shared:isShared,received:false});
    if(e1||e2){alert("저장 실패: "+((e1||e2).message));sv.disabled=false;sv.textContent="저장하기";return;}
    ov.remove();reloadAssets();
  };
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"🧾 나눠내기"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{fontSize:"12px",color:C.sub,marginBottom:"15px",lineHeight:"1.6"}},"내가 전체를 결제하고, 나중에 일부를 돌려받을 때 써요. 전체 금액은 기록되고, 내 소비엔 '내 몫'만 잡혀요."),
    h("div",{style:{marginBottom:"13px"}},lbl("총 결제액"),totEl),
    h("div",{style:{marginBottom:"13px"}},lbl("나누는 방식"),modeRow),
    nBlock.append(lbl("총 인원수 (나 포함)"),nEl)||nBlock,
    myBlock.append(lbl("내 몫"),myEl)||myBlock,
    h("div",{style:{marginBottom:"13px"}},lbl("누구랑?"),tgtRow),
    h("div",{style:{marginBottom:"13px"}},lbl("카테고리"),catWrap),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"13px"}},h("div",{},lbl("장소/메모"),placeEl),h("div",{},lbl("날짜"),dt)),
    lbl("정산 미리보기"),result,
    sv
  );
  ov.append(sh);document.body.append(ov);totEl.focus();
}

// ── 더치페이 받음 처리 ──
function showDutchReceive(d){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"60"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px 20px 0 0",padding:"18px 20px 26px",maxHeight:"85vh",overflowY:"auto"}});
  const lbl=t=>h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.sub,marginBottom:"6px"}},t);
  let selAccId=S.accounts[0]?.id||null;
  const accWrap=h("div",{style:{display:"flex",flexWrap:"wrap",gap:"8px"}});
  const drawAcc=()=>{accWrap.innerHTML="";if(!S.accounts.length){accWrap.append(h("div",{style:{fontSize:"12.5px",color:C.over}},"먼저 계좌를 추가해주세요."));return;}S.accounts.forEach(a=>{const on=selAccId===a.id;accWrap.append(h("button",{style:{fontSize:"13px",padding:"9px 14px",borderRadius:"11px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selAccId=a.id;drawAcc();}},(ACC_ICON[a.kind]||"🏦")+" "+a.name));});};
  drawAcc();
  const sv=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"10px"}},"받음 처리하기");
  sv.onclick=async()=>{
    if(!selAccId){alert("받은 계좌를 선택해주세요.");return;}
    sv.disabled=true;sv.textContent="처리 중…";
    const acc=S.accounts.find(a=>a.id===selAccId);
    // 1) 더치페이 받음 표시
    const{error:e1}=await sb.from("dutch_splits").update({received:true,received_account_id:selAccId}).eq("id",d.id);
    // 2) 계좌 잔액 +받을돈
    const{error:e2}=await sb.from("accounts").update({balance:Number(acc.balance||0)+Number(d.to_receive)}).eq("id",selAccId);
    // 3) 정산환급 기록 → 내 소비가 내 몫으로 줄어듦
    const{error:e3}=await sb.from("transactions").insert({user_id:S.session.user.id,household_id:d.is_shared?S.householdId:null,date:td(),account:d.is_shared?"공용":"개인",type:"정산환급",amount:Number(d.to_receive),category:"정산환급",merchant:(d.place||"더치페이")+" 정산받음",memo:"더치페이 환급"});
    if(e1||e2||e3){alert("처리 실패: "+((e1||e2||e3).message));sv.disabled=false;sv.textContent="받음 처리하기";return;}
    ov.remove();reloadAssets();
  };
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"📥 받음 처리"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{background:C.soft,borderRadius:"12px",padding:"13px 15px",marginBottom:"16px",fontSize:"13px",lineHeight:"1.7"}},h("div",{style:{fontWeight:"700",marginBottom:"4px"}},d.place||"나눠내기"),`받을 돈 `,h("span",{class:"num",style:{fontWeight:"800",color:C.brand}},W(d.to_receive)),`이 들어왔어요. 어느 계좌로 받았나요?`),
    lbl("받은 계좌"),accWrap,
    h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"10px",lineHeight:"1.6"}},"선택한 계좌 잔액이 늘어나고, 이번 달 소비에서 이 금액만큼 빠져서 '내 몫'만 남아요."),
    sv
  );
  ov.append(sh);document.body.append(ov);
}
