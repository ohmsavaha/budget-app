const addSpendExclude=(kw)=>{try{const a=getSpendExclude();const k=(kw||"").trim();if(k&&!a.includes(k)){a.push(k);localStorage.setItem("spend_exclude",JSON.stringify(a));}}catch{}};
const removeSpendExclude=(kw)=>{try{localStorage.setItem("spend_exclude",JSON.stringify(getSpendExclude().filter(x=>x!==kw)));}catch{}};
const isExcludedSpend=(t)=>{const ex=getSpendExclude();if(!ex.length)return false;const m=((t.merchant||"")+" "+(t.category||"")).toLowerCase();return ex.some(kw=>kw&&m.includes(kw.toLowerCase()));};

// 가맹점명으로 카테고리 자동 추론
function autoClassify(merchant){
  if(!merchant)return null;
  const m=merchant.trim();
  const rules=allRules();
  // 키워드 길이 긴 순으로 매칭 (더 구체적인 규칙 우선)
  const keys=Object.keys(rules).sort((a,b)=>b.length-a.length);
  for(const k of keys){
    if(m.includes(k)||k.includes(m.split("(")[0].split("*")[0].trim())){
      return rules[k];
    }
  }
  return null;
}

async function imgToB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res({b64:r.result.split(",")[1],mime:file.type||"image/jpeg"});
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}

async function claudeVision(file,prompt){
  const key=getApiKey();
  if(!key)throw new Error("no_key");
  const{b64,mime}=await imgToB64(file);
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:mime,data:b64}},
      {type:"text",text:prompt}
    ]}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  const data=await resp.json();
  let txt=data.content?.find(c=>c.type==="text")?.text||"{}";
  dlog("[AI원본응답]",txt);
  const _a=txt.indexOf("{"),_b=txt.lastIndexOf("}");
  if(_a>=0&&_b>_a)txt=txt.slice(_a,_b+1);
  txt=txt.replace(/(\d),(?=\d)/g,"$1");
  try{const _o=JSON.parse(txt);dlog("[AI결과]",_o);return _o;}
  catch(err){dlog("[AI파싱실패]",err,txt);return{_raw:txt};}
}

  for(const f of files){const{b64,mime}=await imgToB64(f);imgs.push({type:"image",source:{type:"base64",media_type:mime,data:b64}});}
  const resp=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:2000,messages:[{role:"user",content:[...imgs,{type:"text",text:prompt}]}]})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||resp.status);}
  const data=await resp.json();
  let txt=data.content?.find(c=>c.type==="text")?.text||"{}";
  dlog("[AI원본응답-멀티]",txt);
  const _a=txt.indexOf("{"),_b=txt.lastIndexOf("}");
  if(_a>=0&&_b>_a)txt=txt.slice(_a,_b+1);
  txt=txt.replace(/(\d),(?=\d)/g,"$1");
  try{const _o=JSON.parse(txt);dlog("[AI결과-멀티]",_o);return _o;}
  catch(err){dlog("[AI파싱실패-멀티]",err,txt);return{_raw:txt};}
}

async function fetchQuotes(symbols){
  // symbols: ["NVDA","TSLA",...] → {NVDA:{price,changePct,currency},...}
  const list=[...new Set(symbols.filter(Boolean))];
  if(!list.length)return{};
  try{
    const r=await fetch(`${MARKET_PROXY}?symbols=${encodeURIComponent(list.join(","))}`,{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
    const d=await r.json();
    return d?.data||{};
  }catch(e){dlog("[시세조회실패]",e);return{};}
}
async function fetchFxRate(){
  // 환율 전용 무료 API (CORS 허용, 키 불필요)
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/USD");
    const d=await r.json();
    const krw=d?.rates?.KRW;
    if(krw)return{price:krw,currency:"KRW",name:"USD/KRW",ticker:"USDKRW=X"};
  }catch{}

async function fetchPrice(ticker){
  if(ticker==="USDKRW=X")return await fetchFxRate();
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`,{mode:"cors"});
    const d=await r.json();
    const m=d.chart?.result?.[0]?.meta;
    if(!m)return null;
    return{price:m.regularMarketPrice,currency:m.currency,name:m.shortName||ticker,ticker};
  }catch{return null;}
}

function h(tag,p={},...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(p)){
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{if(k==null||k===false)return;e.append(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);});
  return e;
}

// ── STATS ──
function calcStatsFor(txns){
  let pS=0,pR=0,cS=0,cR=0,inc=0,sav=0;
  for(const t of txns){
    if(isExcludedSpend(t))continue;
    const k=kindOf(t.type),a=Number(t.amount)||0;
    // 공용 우선: account가 공용이거나, 공용통장/공용카드로 결제했으면 공용으로 집계
    const isShared=t.account==="공용"||t.payment_method==="공용통장"||t.payment_method==="공용카드"||t.payment_method==="공용통장 자동출금"||t.payment_method==="공용통장 지로출금";
    if(isShared){if(k==="spend")cS+=a;else if(k==="reduce")cR+=a;}
    else{if(k==="spend")pS+=a;else if(k==="reduce")pR+=a;}
    if(k==="income")inc+=a;if(k==="save")sav+=a;
  }
  return{pNet:pS-pR,cNet:cS-cR,income:inc,save:sav,balance:inc-(pS-pR)-(cS-cR)-sav};
}

function buildExcludeSuggest(){
  const pat=/이자|충전|송금|이체|atm|출금|상환|보증금|예치|카드대금|환전|인출/i;
  const station=/충전소|주유|가스|lpg/i;  // LPG·주유소는 소비(주유)이므로 감지 제외
  const dismissed=getSuggestDismiss();
  const cand=(S.txns||[]).filter(t=>{const txt=(t.merchant||"")+" "+(t.category||"");const k=(t.merchant||t.category||"").trim();return kindOf(t.type)==="spend"&&!isExcludedSpend(t)&&pat.test(txt)&&!station.test(txt)&&!dismissed.includes(k);});
  if(!cand.length)return null;
  const byKw={};
  cand.forEach(t=>{const k=(t.merchant||t.category||"").trim();if(!k)return;const g=byKw[k]||(byKw[k]={sum:0,cnt:0});g.sum+=Number(t.amount)||0;g.cnt++;});
  const rows=Object.entries(byKw).sort((a,b)=>b[1].sum-a[1].sum).slice(0,6);
  if(!rows.length)return null;
  const card=h("div",{style:{background:"#FFFBEE",border:`1px solid ${C.warn}`,borderRadius:"16px",padding:"15px 17px",marginTop:"12px"}},
    h("div",{style:{fontSize:"13px",fontWeight:"800",color:C.warn,marginBottom:"4px"}},"🔁 소비가 아닌 것 같은 거래"),
    h("div",{style:{fontSize:"11.5px",color:C.sub,marginBottom:"6px",lineHeight:"1.6"}},"계좌충전·이체처럼 소비가 아닌 거래로 보여요. 🚫제외하면 예산·순소비에서 빠져요. 소비가 맞으면 ✓소비를 눌러 숨기세요."));
  rows.forEach(([kw,d])=>{
    card.append(h("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"8px 0",borderTop:"1px solid #EFE7CF"}},
      h("div",{style:{flex:"1",minWidth:"0"}},h("div",{style:{fontSize:"12.5px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},kw),
        h("div",{style:{fontSize:"10.5px",color:C.faint}},`${d.cnt}건 · ${W(d.sum)}`)),
      h("button",{title:"이건 소비가 맞아요 (다시 안 띄움)",style:{fontSize:"11.5px",fontWeight:"700",color:C.sub,background:"transparent",border:`1px solid ${C.line}`,borderRadius:"7px",padding:"6px 9px",cursor:"pointer",flexShrink:"0"},onclick:()=>{dismissSuggest(kw);homeReload();}},"✓ 소비"),
      h("button",{title:"소비에서 제외 (이체·충전 등)",style:{fontSize:"11.5px",fontWeight:"700",color:C.w,background:C.warn,border:"none",borderRadius:"7px",padding:"6px 10px",cursor:"pointer",flexShrink:"0"},onclick:async()=>{addSpendExclude(kw);await loadMonth();homeReload();}},"🚫 제외")));
  });
  return card;
}

function buildMonthSummary(){
  const st=calcStatsFor(S.txns),prev=calcStatsFor(S.prevTxns),cfg=getSharedCfg();
  const myShared=Math.round(st.cNet*(cfg.ratio||50)/100),totalSpend=st.pNet+myShared;

// ── 월간 인사이트 (말로 된 분석) ──
function buildInsight(st,prevSt){
  const insights=[];
  const cur=st.pNet,prev=prevSt.pNet;

  // 1. 전월 대비 개인소비
  if(prev>0){
    const diff=cur-prev,pct=Math.round(Math.abs(diff)/prev*100);
    if(Math.abs(pct)>=10){
      if(diff>0)insights.push({icon:"📈",tone:"warn",text:`개인 소비가 지난달보다 ${pct}% 늘었어요 (${W(Math.abs(diff))} 증가)`});
      else insights.push({icon:"📉",tone:"good",text:`개인 소비가 지난달보다 ${pct}% 줄었어요 (${W(Math.abs(diff))} 절약). 잘하고 있어요!`});
    }else{
      insights.push({icon:"➡️",tone:"neutral",text:`개인 소비가 지난달과 비슷해요 (${W(cur)})`});
    }
  }

  // 2. 카테고리 TOP + 비중
  const cagg={};
  for(const t of S.txns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;cagg[t.category]=(cagg[t.category]||0)+(Number(t.amount)||0);}
  const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]);
  if(crows.length){
    const[topCat,topAmt]=crows[0];
    const pct=cur>0?Math.round(topAmt/cur*100):0;
    const c=CM[topCat]||CM["기타"];
    insights.push({icon:c.i,tone:"neutral",text:`이번 달 가장 많이 쓴 곳은 ${topCat} (${W(topAmt)}, 전체의 ${pct}%)`});
  }

  // 3. 카테고리별 전월 대비 급증 감지
  const prevCagg={};
  for(const t of S.prevTxns){if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;prevCagg[t.category]=(prevCagg[t.category]||0)+(Number(t.amount)||0);}
  let maxJump=null;
  for(const[cat,amt] of crows){
    const pAmt=prevCagg[cat]||0;
    if(pAmt>10000&&amt>pAmt*1.5){
      const jump=amt-pAmt;
      if(!maxJump||jump>maxJump.jump)maxJump={cat,jump,amt,pAmt};
    }
  }
  if(maxJump){
    const c=CM[maxJump.cat]||CM["기타"];
    insights.push({icon:"⚠️",tone:"warn",text:`${maxJump.cat} 지출이 지난달의 ${Math.round(maxJump.amt/maxJump.pAmt*10)/10}배로 늘었어요 (${W(maxJump.pAmt)}→${W(maxJump.amt)})`});
  }

  // 4. 수입 대비 지출
  if(st.income>0){
    const rate=Math.round((cur+st.cNet)/st.income*100);
    if(rate>100)insights.push({icon:"🔴",tone:"warn",text:`이번 달 수입보다 지출이 많아요 (지출이 수입의 ${rate}%)`});
    else if(rate<=60)insights.push({icon:"💰",tone:"good",text:`수입의 ${rate}%만 썼어요. 저축 여력이 좋아요!`});
  }

  // 5. 예산 경고
  if(S.budget>0){
    const used=cur/S.budget;
    const isCur=S.curYm===ym(td());
    const dl=isCur?new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate():0;
    if(used>=1)insights.push({icon:"🚨",tone:"warn",text:`예산을 ${W(cur-S.budget)} 초과했어요`});
    else if(used>=0.8&&dl>5)insights.push({icon:"⏰",tone:"warn",text:`예산의 ${Math.round(used*100)}%를 썼는데 아직 ${dl}일 남았어요. 페이스 조절이 필요해요`});
  }

  if(!insights.length)return null;

  const el=sec("💡 이번 달 인사이트","");
  const list=h("div",{style:{display:"flex",flexDirection:"column",gap:"9px"}});
  const toneColor={good:C.brand,warn:C.over,neutral:C.sub};
  const toneBg={good:"#EDFBF4",warn:"#FFF4F1",neutral:"#F6F4EF"};
  insights.forEach(ins=>{
    list.append(h("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:toneBg[ins.tone]||"#F6F4EF"}},
      h("span",{style:{fontSize:"15px",flexShrink:"0"}},ins.icon),
      h("span",{style:{fontSize:"13px",lineHeight:"1.5",color:C.ink}},ins.text)
    ));
  });
  el.append(list);
  return el;
}

    ));

  // 예산 게이지
  if(budget>0){

  return el;
}

// ── 달력 뷰 ──
function buildCalendarView(){
  const[yr,mo]=S.curYm.split("-").map(Number);
  const firstDay=new Date(yr,mo-1,1).getDay();// 0=일
  const lastDate=new Date(yr,mo,0).getDate();
  const todayStr=td();

  // 날짜별 거래 집계
  const byDate={};
  for(const t of S.txns){
    if(!byDate[t.date])byDate[t.date]={spend:0,income:0,txns:[]};
    const k=kindOf(t.type);
    if(k==="spend")byDate[t.date].spend+=Number(t.amount)||0;
    else if(k==="income"||k==="reduce")byDate[t.date].income+=Number(t.amount)||0;
    byDate[t.date].txns.push(t);
  }

  // 월간 요약
  const totalSpend=Object.values(byDate).reduce((s,d)=>s+d.spend,0);
  const totalIncome=Object.values(byDate).reduce((s,d)=>s+d.income,0);
  const net=totalIncome-totalSpend;

  const summary=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}},
    h("div",{style:{background:"#FFF1EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.over,marginBottom:"3px",fontWeight:"600"}},"💸 이달 지출"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.over}},W(totalSpend))
    ),
    h("div",{style:{background:"#EDFBF4",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.brand,marginBottom:"3px",fontWeight:"600"}},"💼 이달 수입"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},W(totalIncome))
    ),
    h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10px",color:C.sub,marginBottom:"3px",fontWeight:"600"}},net>=0?"잔여":"적자"),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:net>=0?C.brand:C.over}},W(Math.abs(net)))
    )
  );

  // 달력 그리드
  const cal=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"14px 12px"}});
  
  // 요일 헤더
  const hdr=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",marginBottom:"4px"}});
  ["월","화","수","목","금","토","일"].forEach((d,i)=>
    hdr.append(h("div",{style:{textAlign:"center",fontSize:"11px",color:i>=5?"#B23A5C":C.faint,fontWeight:"700",padding:"3px 0"}},d))
  );

  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px"}});
  
  // 시작 오프셋 (월요일 기준)
  const offset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<offset;i++)grid.append(h("div",{}));

  for(let d=1;d<=lastDate;d++){
    const dateStr=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const data=byDate[dateStr]||null;
    const isToday=dateStr===todayStr;
    const dow=(offset+d-1)%7;
    const isSun=dow===6,isSat=dow===5;

    const cell=h("div",{
      style:{
        padding:"3px 2px",borderRadius:"8px",textAlign:"center",
        cursor:data?"pointer":"default",
        background:isToday?C.brand:"transparent",
        minHeight:"55px",display:"flex",flexDirection:"column",
        alignItems:"center",justifyContent:"flex-start",gap:"2px"
      },
      onclick:data?()=>showDayDetail(dateStr,data.txns):null
    },
      h("div",{style:{
        fontSize:"13px",fontWeight:isToday?"800":"500",lineHeight:"1.6",
        color:isToday?C.w:isSun?"#B23A5C":isSat?"#4169B1":C.ink
      }},d),
      data&&data.spend>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.over,lineHeight:"1.2",fontWeight:"600"}},"-"+shortNum(data.spend)):"",
      data&&data.income>0?h("div",{class:"num",style:{fontSize:"9px",color:isToday?"rgba(255,255,255,.85)":C.brand,lineHeight:"1.2",fontWeight:"600"}},"+"+shortNum(data.income)):""
    );
    if(!isToday&&data){
      cell.addEventListener("mouseenter",e=>{e.currentTarget.style.background="#F0EDE5";});
      cell.addEventListener("mouseleave",e=>{e.currentTarget.style.background="transparent";});
    }
    grid.append(cell);
  }
  cal.append(hdr,grid);

  // 범례
  const legend=h("div",{style:{display:"flex",gap:"16px",justifyContent:"center",marginTop:"10px",fontSize:"11.5px",color:C.sub}},
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.over,fontWeight:"700"}},"-"),"지출"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{color:C.brand,fontWeight:"700"}},"+"),"수입"),
    h("div",{style:{display:"flex",alignItems:"center",gap:"4px"}},h("span",{style:{background:C.brand,width:"10px",height:"10px",borderRadius:"50%",display:"inline-block"}}),"오늘")
  );

  return reorderCards("calendar",[summary,cal,legend]);
}

// ── 하루 상세 시트 ──
function showDayDetail(dateStr,txns){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"50"}});

  const[,mo,d]=dateStr.split("-");
  const spend=txns.filter(t=>kindOf(t.type)==="spend").reduce((s,t)=>s+Number(t.amount),0);
  const income=txns.filter(t=>["income","reduce"].includes(kindOf(t.type))).reduce((s,t)=>s+Number(t.amount),0);
  const reloadCal=async()=>{await loadMonth();ov.remove();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildCalendarView().forEach(n=>ct.append(n));}};

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"16px"}},

        h("div",{style:{display:"flex",gap:"12px",marginTop:"4px"}},
          spend>0?h("span",{class:"num",style:{fontSize:"12.5px",color:C.over,fontWeight:"700"}},"−"+W(spend).slice(1)):"",

      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    h("div",{style:{fontSize:"11.5px",color:C.faint,marginBottom:"10px",textAlign:"right"}},"탭하면 수정")
  );

  txns.sort((a,b)=>Number(b.amount)-Number(a.amount)).forEach(t=>{
    const c=CM[t.category]||CM["기타"],k=kindOf(t.type);
    const sg=k==="income"||k==="reduce"?"+":k==="spend"?"−":"";
    const cl=k==="income"||k==="reduce"?C.brand:C.ink;
    sh.append(h("div",{
      style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .1s",borderRadius:"4px"},
      onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
      onmouseleave:e=>{e.currentTarget.style.background="transparent";},
      onclick:()=>showEditTxn(t,reloadCal)
    },
      h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${t.account} · ${t.category}${t.memo?" · "+t.memo:""}`)
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
        h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`),
        h("span",{style:{fontSize:"12px",color:C.faint}},"›")
      )
    ));
  });
  ov.append(sh);document.body.append(ov);
}

// ── 연간 막대 차트 ──
function barChart(data,hl){
  const max=Math.max(...data,1);
  return h("div",{style:{display:"flex",alignItems:"flex-end",gap:"4px",height:"110px"}},
    ...data.map((v,i)=>{
      const pct=v>0?Math.max((v/max)*100,4):0;
      const isHL=i===hl;
      return h("div",{style:{flex:"1",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",gap:"5px",height:"100%"}},
        v>0
          ?h("div",{style:{width:"100%",height:pct+"%",background:isHL?C.brand:C.brand+"55",borderRadius:"3px 3px 0 0",minHeight:"3px",transition:"height .4s"}})
          :h("div",{style:{width:"100%",height:"2px",background:C.line,borderRadius:"1px"}}),
        h("div",{style:{fontSize:"9.5px",color:isHL?C.ink:C.faint,fontWeight:isHL?"800":"400",lineHeight:"1"}},String(i+1))
      );
    })
  );
}

// ── 연간 탭 ──
function buildYearly(){
  const yr=S.curYm.slice(0,4);
  const curM=parseInt(S.curYm.split("-")[1])-1;
  let mode="개인소비"; // 개인소비 | 공용소비 | 수입

  const kindForMode=m=>({"개인소비":"spend","공용소비":"spend","수입":"income"})[m];
  const accForMode=m=>({"개인소비":"개인","공용소비":"공용","수입":null})[m];

  const getMonthly=()=>{
    const arr=Array(12).fill(0);
    const kind=kindForMode(mode),acc=accForMode(mode);
    for(const t of S.yearTxns){
      if(kindOf(t.type)!==kind)continue;
      if(acc&&t.account!==acc)continue;
      const m=parseInt(t.date.slice(5,7))-1;
      if(m>=0&&m<12)arr[m]+=Number(t.amount)||0;
    }
    return arr;
  };

  const container=h("div",{style:{display:"flex",flexDirection:"column",gap:"12px"}});
  const draw=()=>{
    container.innerHTML="";
    const monthly=getMonthly();
    const total=monthly.reduce((s,v)=>s+v,0);
    const avg=monthly.filter(v=>v>0).length?Math.round(total/monthly.filter(v=>v>0).length):0;
    const maxM=monthly.indexOf(Math.max(...monthly));

    // 헤더 카드
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"18px 18px 14px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"14px"}},
        h("div",{},
          h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"4px"}},yr+"년 "+mode+" 합계"),
          h("div",{class:"num",style:{fontSize:"28px",fontWeight:"800",letterSpacing:"-.03em"}},W(total))
        ),
        h("div",{style:{textAlign:"right"}},
          h("div",{style:{fontSize:"11.5px",color:C.sub}},"월평균"),
          h("div",{class:"num",style:{fontSize:"16px",fontWeight:"700",marginTop:"3px"}},W(avg))
        )
      ),
      barChart(monthly,curM),
      h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"10px",textAlign:"center"}},
        maxM>=0&&monthly[maxM]>0?`최대 지출: ${maxM+1}월 (${W(monthly[maxM])})`:""
      )
    ));

    // 모드 토글
    const toggleRow=h("div",{style:{display:"flex",gap:"8px"}});
    ["개인소비","공용소비","수입"].forEach(m=>{
      const sel=mode===m;
      toggleRow.append(h("button",{
        style:{flex:"1",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${sel?C.ink:C.line}`,background:sel?C.ink:C.w,color:sel?C.w:C.sub,cursor:"pointer"},
        onclick:()=>{mode=m;draw();}
      },m));
    });
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"14px",padding:"14px"}},toggleRow));

    // 월별 리스트
    const listSec=sec("월별 내역","");
    const listEl=h("div",{style:{display:"flex",flexDirection:"column",gap:"2px"}});
    monthly.forEach((v,i)=>{
      if(v===0&&i>curM)return;
      const isHL=i===curM;
      listEl.append(h("div",{
        style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 4px",borderBottom:`1px solid ${C.line}`,background:isHL?C.soft:"transparent",borderRadius:isHL?"6px":"0",paddingLeft:isHL?"8px":"4px"}},
        h("span",{style:{fontSize:"13px",color:isHL?C.brand:C.ink,fontWeight:isHL?"700":"400"}},(i+1)+"월"+(isHL?" (이번달)":"")),
        h("span",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:v>0?(isHL?C.brand:C.ink):C.faint}},v>0?W(v):"—")
      ));
    });
    listSec.append(listEl);
    container.append(listSec);

    // 카테고리 연간 순위 (개인소비만)
    if(mode==="개인소비"){
      const cagg={};
      for(const t of S.yearTxns){
        if(kindOf(t.type)!=="spend"||t.account!=="개인")continue;
        cagg[t.category]=(cagg[t.category]||0)+Number(t.amount);
      }
      const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(crows.length){
        const cSec=sec(yr+"년 지출 TOP 카테고리","");
        const cmax=crows[0][1];
        crows.forEach(([n,v])=>{
          const c=CM[n]||CM["기타"];
          cSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 4px"}},
            h("span",{style:{fontSize:"14px",width:"20px",textAlign:"center"}},c.i),
            h("div",{style:{flex:"1"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}},
                h("span",{style:{fontSize:"12.5px"}},n),
                h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700"}},W(v))
              ),
              h("div",{style:{height:"6px",borderRadius:"999px",background:"#F2EEE6",overflow:"hidden"}},
                h("div",{style:{width:Math.max(5,(v/cmax)*100)+"%",height:"100%",background:c.c,borderRadius:"999px"}})
              )
            )
          ));
        });
        container.append(cSec);
      }
    }
  };
  draw();
  return[container];
}

// ── 전월비교 ──
function buildComparison(cur,prev){
  const pym=shYm(S.curYm,-1);
  const hasPrev=S.prevTxns.length>0;
  const el=sec("전월 비교",hasPrev?yml(pym)+" 대비":"데이터 없음");
  if(!hasPrev){el.append(h("div",{style:{textAlign:"center",color:C.faint,fontSize:"13px",padding:"10px 0",lineHeight:"1.7"}},"전달 거래내역이 없어요.",h("br"),"데이터가 쌓이면 자동으로 표시돼요 📈"));return el;}
  const items=[{lbl:"개인 소비",cur:cur.pNet,prev:prev.pNet,icon:"💸",goodUp:false},{lbl:"공용 소비",cur:cur.cNet,prev:prev.cNet,icon:"🤝",goodUp:false},{lbl:"수입",cur:cur.income,prev:prev.income,icon:"💼",goodUp:true}];
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}});
  items.forEach(({lbl,cur:c,prev:p,icon,goodUp})=>{
    const diff=c-p,pct=p>0?Math.round((diff/p)*100):null,up=diff>0;
    const good=diff===0?null:(goodUp?up:!up);
    const tc=good===null?C.sub:good?C.brand:C.over;
    const arrow=diff===0?"─":up?"↑":"↓";
    const diffStr=diff===0?"변화없음":W(Math.abs(diff)).slice(1)+(pct!==null?` (${Math.abs(pct)}%)`:"");
    grid.append(h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
      h("div",{style:{fontSize:"10.5px",color:C.sub,marginBottom:"5px"}},icon+"  "+lbl),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.ink,marginBottom:"4px"}},W(c)),
      h("div",{style:{fontSize:"11px",fontWeight:"700",color:tc}},h("span",{style:{marginRight:"3px"}},arrow),diffStr)
    ));
  });
  el.append(grid);return el;
}

// ══════════ 고정비 납부 판정 + 증빙 (정확 매칭 + 수동 조정) ══════════
// fixed_costs.meta (jsonb) 활용 — 설정을 DB에 저장(기기/사람 공유), 없으면 localStorage에서 자동 이관
function fcMeta(fc){let m=fc&&fc.meta;if(typeof m==="string"){try{m=JSON.parse(m);}catch{m=null;}}return m&&typeof m==="object"?m:{};}
async function setFcMeta(fc,patch){
  const m=Object.assign({},fcMeta(fc),patch);
  fc.meta=m;
  try{const o=(S.fixedCosts||[]).find(x=>x.id===fc.id);if(o)o.meta=m;}catch{}
  if(fc.id){try{await sb.from("fixed_costs").update({meta:m}).eq("id",fc.id);}catch(e){dlog("[meta저장실패]",e);}}
}
const isVariableFc=(fc)=>{const m=fcMeta(fc);if(typeof m.is_variable==="boolean")return m.is_variable;try{const v=localStorage.getItem("fcvar:"+(fc.id||fc.name));if(v==="1")return true;if(v==="0")return false;}catch{}return /(변동|관리비|월별|가변)/.test((fc.memo||"")+(fc.name||""));};
const setVariableFc=(fc,on)=>setFcMeta(fc,{is_variable:!!on});
const isSubscriptionFc=(fc)=>{const m=fcMeta(fc);if(typeof m.is_subscription==="boolean")return m.is_subscription;try{const v=localStorage.getItem("fcsub:"+(fc.id||fc.name));if(v==="1")return true;if(v==="0")return false;}catch{}return /(구독|멤버십|멤버쉽|프라임|와우|밀리|flo|뮤직|music|membership|넷플릭스|netflix|유튜브|youtube|디즈니|disney|왓챠|티빙|웨이브|spotify)/i.test((fc.name||"")+(fc.memo||""));};
const setSubscriptionFc=(fc,on)=>setFcMeta(fc,{is_subscription:!!on});
const getFcShare=(fc)=>{if(fc.account!=="공용")return 100;const m=fcMeta(fc);if(m.share_ratio!=null)return Math.max(0,Math.min(100,Number(m.share_ratio)));try{const v=localStorage.getItem("fcshare:"+(fc.id||fc.name));if(v!=null&&v!=="")return Math.max(0,Math.min(100,Number(v)));}catch{}return 50;};
const setFcShare=(fc,p)=>setFcMeta(fc,{share_ratio:Math.max(0,Math.min(100,Math.round(p)))});
const myShareAmount=(fc)=>Number(fc.amount||0)*getFcShare(fc)/100;
const fcTol=(fc)=>isVariableFc(fc)?0.6:0.18;
const FREQ_MONTHS={"월":1,"분기":3,"반기":6,"연":12};
const getFcFreq=(fc)=>{const m=fcMeta(fc);return m.frequency||"월";};
const setFcFreq=(fc,v)=>setFcMeta(fc,{frequency:v});
const fcMonthlyEquiv=(fc)=>Number(fc.amount||0)/(FREQ_MONTHS[getFcFreq(fc)]||1);
const normKey=m=>(m||"").toLowerCase().replace(/\s+/g,"").replace(/[0-9]{2,}.*$/,"");
function detectRecurring(txns){
  const dismissed=(()=>{try{return JSON.parse(localStorage.getItem("fcdiscover_dismiss")||"[]");}catch{return[];}})();
  const reg=[...(S.fixedCosts||[]),...(S.fixedInactive||[])];
  const regKeys=reg.map(f=>normKey(f.name)).filter(Boolean);
  const regMatch=reg.map(f=>normKey(f.match_name||"")).filter(Boolean);
  const groups={};
  txns.forEach(t=>{
    if(kindOf(t.type)!=="spend"||t.type==="소비(할부)")return;
    const key=normKey(t.merchant);
    if(!key||key.length<2)return;
    const g=groups[key]||(groups[key]={list:[],names:{}});
    g.list.push(t);
    const dn=(t.merchant||"").trim();if(dn)g.names[dn]=(g.names[dn]||0)+1;
  });
  const out=[];
  Object.entries(groups).forEach(([key,g])=>{
    const list=g.list;
    const months=[...new Set(list.map(t=>(t.date||"").slice(0,7)))];
    if(months.length<2)return;
    if(list.length/months.length>3)return;
    const amts=list.map(t=>Number(t.amount)||0).sort((a,b)=>a-b);
    const med=amts[Math.floor(amts.length/2)];
    if(med<1000)return;
    const near=amts.filter(a=>Math.abs(a-med)/med<=0.35);
    if(near.length<2)return;
    if(dismissed.includes(key))return;
    if(regKeys.some(rk=>rk&&(rk.includes(key)||key.includes(rk))))return;
    if(regMatch.some(rk=>rk&&(key.includes(rk)||rk.includes(key))))return;
    const typical=Math.round(near.reduce((s,a)=>s+a,0)/near.length);
    const last=list.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
    const dispName=Object.entries(g.names).sort((a,b)=>b[1]-a[1])[0]?.[0]||key;
    out.push({key,name:dispName,amount:typical,category:last.category||"기타",account:last.account||"개인",payment_method:last.payment_method||null,months:months.length});
  });
  out.sort((a,b)=>b.months-a.months||b.amount-a.amount);
  return out.slice(0,8);
}
function fcDueInfo(fc){
  const bd=Number(fc.billing_day);if(!bd)return null;
  const[Y,M]=S.curYm.split("-").map(Number);
  const lastDay=new Date(Y,M,0).getDate();const day=Math.min(bd,lastDay);
  const dueStr=`${Y}-${String(M).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const isThisMonth=S.curYm===ym(td());
  let dday=null;if(isThisMonth){dday=Math.round((new Date(dueStr)-new Date(td()))/86400000);}
  return{dueStr,day,dday,isThisMonth};
}
function fcStatus(fc){
  if(fc.paid)return "paid";
  const now=ym(td()),viewing=S.curYm;
  if(viewing>now)return "scheduled";
  const due=fcDueInfo(fc);
  if(due&&due.isThisMonth){
    if(due.dday>0)return "scheduled";
    if(due.dday===0)return "today";
    return "check";
  }
  return "check";
}
const STATUS_META={
  paid:{lb:"✅ 납부됨",col:C.brand,bg:"transparent",bd:"transparent"},
  scheduled:{lb:"🕒 예정",col:C.sub,bg:"transparent",bd:C.line},
  today:{lb:"📍 오늘 결제",col:C.warn,bg:"#FFFBEE",bd:C.warn},
  check:{lb:"⏳ 확인 필요",col:C.over,bg:"#FEF7F4",bd:C.over}
};
const getFcSort=()=>{try{return localStorage.getItem("fcsort")||"due";}catch{return"due";}};
const setFcSort=(v)=>{try{localStorage.setItem("fcsort",v);}catch{}};
function sortFcList(list){
  const s=getFcSort(),arr=list.slice();
  if(s==="amount")arr.sort((a,b)=>Number(b.amount)-Number(a.amount));
  else if(s==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  else if(s==="due")arr.sort((a,b)=>{const da=fcDueInfo(a),db=fcDueInfo(b);return(da?da.day:99)-(db?db.day:99);});
  return arr;
}
const isIncomeType=(t)=>["수입","정산환급","환불/취소","공용입금"].includes(t);
const FCKEY=(fc,ym)=>`fcpay:${fc.id||fc.name}:${ym}`;
function getFcOverride(fc,ym){const m=fcMeta(fc);if(m.payments&&m.payments[ym])return m.payments[ym];try{const v=localStorage.getItem(FCKEY(fc,ym));if(v)return JSON.parse(v);}catch{}return null;}
function setFcOverride(fc,ym,o){const m=fcMeta(fc);const payments=Object.assign({},m.payments||{});if(o)payments[ym]=o;else delete payments[ym];return setFcMeta(fc,{payments});}

// 거래 1건 → 고정비 1개 1:1 배정 (수동 override 우선)
function assignFixedPayments(fcs,txns,ym){
  const used=new Set();
  const out=fcs.map(fc=>({fc,paid:false,tx:null,manual:false}));
  // 1) 수동 조정 먼저
  out.forEach(o=>{
    const ov=getFcOverride(o.fc,ym);
    if(!ov)return;
    if(ov.status==="unpaid"){o.paid=false;o.manual=true;o._done=true;}
    else if(ov.status==="paid"){o.paid=true;o.manual=true;o._done=true;
      if(ov.txId){const tx=txns.find(t=>t.id===ov.txId);if(tx){o.tx=tx;used.add(tx.id);}}}
  });
  // 2) 자동 매칭 (남은 것, 금액 가장 근접한 거래 1건)
  out.forEach(o=>{
    if(o._done)return;
    const fa=Number(o.fc.amount)||0;if(fa<=0)return;
    const tol=fcTol(o.fc);let best=null,bd=Infinity;
    txns.forEach(t=>{
      if(used.has(t.id))return;
      if(isIncomeType(t.type))return;
      if(t.category!==o.fc.category||t.account!==o.fc.account)return;
      const a=Number(t.amount)||0,d=fa>0?Math.abs(a-fa)/fa:9;
      if(d<=tol&&d<bd){bd=d;best=t;}
    });
    if(best){o.paid=true;o.tx=best;used.add(best.id);}
  });
  out.forEach(o=>{delete o._done;});
  return out;
}

            Math.abs(diff)>=1?h("div",{class:"num",style:{fontSize:"10px",fontWeight:"700",color:diff>0?C.over:C.brand,marginTop:"1px"}},(diff>0?"+":"−")+W(Math.abs(diff)).slice(1)):"")
        ));
      });
      // 평균
      const avg=Math.round(months.reduce((s,m)=>s+byMonth[m].a,0)/months.length);
      histList.append(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"11px 2px 0",fontSize:"12px",fontWeight:"800"}},
        h("span",{style:{color:C.sub}},`평균 (${months.length}개월)`),h("span",{class:"num",style:{color:C.ink}},W(avg))));
      try{
        const pastMs=months.filter(mm=>mm!==ym);
        if(pastMs.length>=1&&info.tx){
          const pastAvg=Math.round(pastMs.reduce((s,mm)=>s+byMonth[mm].a,0)/pastMs.length);
          const cur=Number(info.tx.amount)||0;
          if(pastAvg>0){
            const pct=(cur-pastAvg)/pastAvg*100;
            if(Math.abs(pct)>=5){
              const up=pct>0,sev=Math.abs(pct)>=15;
              varWarnSlot.innerHTML="";
              varWarnSlot.append(h("div",{style:{marginTop:"12px",borderRadius:"12px",padding:"11px 13px",background:sev?"#FEF2EE":"#FFFBEE",border:`1px solid ${sev?C.over:C.warn}`,fontSize:"12px",lineHeight:"1.6"}},
                h("div",{style:{fontWeight:"800",color:sev?C.over:C.warn,marginBottom:"2px"}},`${sev?"🔴":"🟡"} 평소보다 ${up?"↑":"↓"} ${Math.abs(pct).toFixed(0)}% ${up?"증가":"감소"}`),
                h("div",{style:{color:C.sub}},`평균 ${W(pastAvg)} → 이번 달 ${W(cur)}`)
              ));
            }
          }
        }
      }catch(e){}
    }catch(e){histList.innerHTML="";histList.append(h("div",{style:{fontSize:"12px",color:C.over,padding:"8px 0"}},"이력을 불러오지 못했어요."));}
  })();

  // 수정 버튼
  // 공용 고정비 → 내 부담 비율
  if(fc.account==="공용"){
    const curShare=getFcShare(fc);
    sh.append(h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"20px",marginBottom:"7px"}},`🤝 내 부담 비율 — 현재 ${curShare}% · 월 ${W(myShareAmount(fc))}`));
    const shareRow=h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap"}});
    [0,25,50,75,100].forEach(p=>{
      const on=curShare===p;
      shareRow.append(h("button",{style:{flex:"1",minWidth:"50px",fontSize:"12px",fontWeight:"700",padding:"9px 4px",borderRadius:"9px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:async()=>{await setFcShare(fc,p);close();reload();}},p+"%"));
    });
    sh.append(shareRow);
  }
  // 설정 토글 (매달 변동 / 구독 서비스)
  const tgl=(label,active,fn)=>h("button",{style:{flex:"1",fontSize:"11.5px",fontWeight:"700",padding:"10px",borderRadius:"9px",border:`1px solid ${active?C.brand:C.line}`,background:active?C.soft:C.w,color:active?C.brand:C.sub,cursor:"pointer"},onclick:fn},label);
  // 납부 주기
  const curFreq=getFcFreq(fc);
  const freqRow=h("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap"}});
  ["월","분기","반기","연"].forEach(fr=>{
    const on=curFreq===fr;
    freqRow.append(h("button",{style:{flex:"1",minWidth:"52px",fontSize:"12px",fontWeight:"700",padding:"9px 4px",borderRadius:"9px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:async()=>{await setFcFreq(fc,fr);close();reload();}},fr+(fr==="연"?"1회":"")));
  });
  sh.append(h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"20px",marginBottom:"7px"}},`🔁 납부 주기 — ${curFreq==="월"?"매월":curFreq+"마다"}${curFreq!=="월"?` · 월 적립 ${W(fcMonthlyEquiv(fc))}`:""}`),freqRow);
  sh.append(h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"16px",marginBottom:"7px"}},"이 고정비 설정"),
    h("div",{style:{display:"flex",gap:"6px"}},
      tgl((isVariableFc(fc)?"☑️":"⬜")+" 매달 금액 변동",isVariableFc(fc),async()=>{await setVariableFc(fc,!isVariableFc(fc));close();reload();}),
      tgl((isSubscriptionFc(fc)?"☑️":"⬜")+" 구독 서비스",isSubscriptionFc(fc),async()=>{await setSubscriptionFc(fc,!isSubscriptionFc(fc));close();reload();})
    ));
  sh.append(h("button",{style:{width:"100%",marginTop:"12px",fontSize:"13.5px",fontWeight:"700",padding:"12px",borderRadius:"11px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer"},onclick:()=>{close();showEditFixed(fc,reload);}},"✏️ 고정비 정보 수정"));

  ov2.append(sh);document.body.append(ov2);
}

function buildFixed(){
  const fcs=S.fixedCosts;
  const assigned=assignFixedPayments(fcs,S.txns||[],S.curYm);
  const withStatus=fcs.map((fc,i)=>({...fc,paid:assigned[i].paid,_match:assigned[i].tx,_manual:assigned[i].manual}));
  const monthlyFcs=withStatus.filter(f=>getFcFreq(f)==="월");
  const periodicFcs=withStatus.filter(f=>getFcFreq(f)!=="월");
  const annualTotal=withStatus.reduce((s,f)=>s+fcMonthlyEquiv(f)*12,0);
  const total=monthlyFcs.reduce((s,fc)=>s+Number(fc.amount),0);
  const paidAmt=monthlyFcs.filter(fc=>fc.paid).reduce((s,fc)=>s+Number(fc.amount),0);
  const unpaidAmt=total-paidAmt;
  const paidPct=total>0?Math.round(paidAmt/total*100):0;
  const unpaidList=monthlyFcs.filter(fc=>!fc.paid);
  const paidList=monthlyFcs.filter(fc=>fc.paid);
  const checkList=monthlyFcs.filter(fc=>fcStatus(fc)==="check");
  const schedList=monthlyFcs.filter(fc=>{const st=fcStatus(fc);return st==="scheduled"||st==="today";});
  const checkAmt=checkList.reduce((s,fc)=>s+Number(fc.amount),0);
  const schedAmt=schedList.reduce((s,fc)=>s+Number(fc.amount),0);
  const isCurMonth=S.curYm===ym(td());
  const upcomingBanner=(isCurMonth&&(schedAmt>0||checkAmt>0))?h("div",{style:{background:"linear-gradient(135deg,#2C8F6B,#1E6E52)",borderRadius:"16px",padding:"16px 18px",color:"#fff"}},
    h("div",{style:{fontSize:"11.5px",opacity:".92"}},"이번 달 앞으로 빠질 고정비"),
    h("div",{class:"num",style:{fontSize:"27px",fontWeight:"800",marginTop:"3px",letterSpacing:"-.02em"}},W(schedAmt)),
    checkAmt>0?h("div",{style:{fontSize:"11.5px",marginTop:"7px",background:"rgba(255,255,255,.18)",borderRadius:"8px",padding:"6px 10px",display:"inline-block"}},`⚠️ 확인 필요 ${W(checkAmt)} 별도`):""
  ):null;
  // 개인/공용 분리 + 연간 환산
  const personalTotal=monthlyFcs.filter(f=>f.account!=="공용").reduce((s,f)=>s+Number(f.amount),0);
  const publicTotal=monthlyFcs.filter(f=>f.account==="공용").reduce((s,f)=>s+Number(f.amount),0);
  const myTotal=monthlyFcs.reduce((s,f)=>s+myShareAmount(f),0);
  const splitAnnualBlock=h("div",{style:{marginTop:"14px",display:"flex",flexDirection:"column",gap:"8px"}},
    h("div",{style:{display:"flex",gap:"8px"}},
      h("div",{style:{flex:"1",background:"#F6F4EF",borderRadius:"10px",padding:"10px 12px"}},
        h("div",{style:{fontSize:"10.5px",color:C.sub,marginBottom:"3px"}},"👤 개인 고정비"),
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800"}},W(personalTotal))),
      h("div",{style:{flex:"1",background:"#F6F4EF",borderRadius:"10px",padding:"10px 12px"}},
        h("div",{style:{fontSize:"10.5px",color:C.sub,marginBottom:"3px"}},"🤝 공용 고정비"),
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"800"}},W(publicTotal)))
    ),
    h("div",{style:{background:C.soft,borderRadius:"10px",padding:"11px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}},
      h("div",{},h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"800"}},"🙋 내 실부담 (이번 달)"),
        h("div",{style:{fontSize:"10px",color:C.faint,marginTop:"2px"}},"공용 분담 비율 반영 · 항목별 조정 가능")),
      h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(myTotal))
    ),
    h("div",{style:{textAlign:"center",fontSize:"11px",color:C.faint}},"전체 연 ",h("span",{class:"num",style:{fontWeight:"700",color:C.sub}},W(annualTotal))," · 내 부담 연 ",h("span",{class:"num",style:{fontWeight:"800",color:C.sub}},W(myTotal*12)))
  );

  // 헤더 카드
  const hero=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 고정비 합계"),
    h("div",{class:"num",style:{fontSize:"36px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1",marginBottom:"16px"}},W(total)),
    h("div",{style:{height:"11px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden",marginBottom:"10px"}},
      h("div",{style:{width:`${paidPct}%`,height:"100%",background:C.brand,borderRadius:"999px",transition:"width .5s"}})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px"}},
      h("div",{style:{background:C.soft,borderRadius:"12px",padding:"11px 12px"}},
        h("div",{style:{fontSize:"10.5px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"✅ 완료"),
        h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},W(paidAmt)),
        h("div",{style:{fontSize:"10.5px",color:C.brand,marginTop:"2px"}},`${paidList.length}건`)
      ),
      h("div",{style:{background:"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
        h("div",{style:{fontSize:"10.5px",color:C.sub,fontWeight:"700",marginBottom:"4px"}},"🕒 예정"),
        h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.sub}},W(schedAmt)),
        h("div",{style:{fontSize:"10.5px",color:C.sub,marginTop:"2px"}},`${schedList.length}건`)
      ),
      h("div",{style:{background:checkAmt>0?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"11px 12px"}},
        h("div",{style:{fontSize:"10.5px",color:checkAmt>0?C.over:C.faint,fontWeight:"700",marginBottom:"4px"}},"⏳ 확인필요"),
        h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:checkAmt>0?C.over:C.faint}},W(checkAmt)),
        h("div",{style:{fontSize:"10.5px",color:checkAmt>0?C.over:C.faint,marginTop:"2px"}},`${checkList.length}건`)
      )
    ),
    splitAnnualBlock
  );

  // 고정비 없을 때 → 추천 목록 클릭 추가
  if(!fcs.length){
    const emptySec=sec("고정비 목록","");
    emptySec.append(
      h("div",{style:{textAlign:"center",padding:"16px 0 10px",color:C.sub}},
        h("div",{style:{fontSize:"28px",marginBottom:"6px"}},"📋"),
        h("div",{style:{fontSize:"14px",fontWeight:"700"}},"등록된 고정비가 없어요"),
        h("div",{style:{fontSize:"12px",color:C.faint,marginTop:"3px"}},"아래 추천 항목을 탭하면 바로 추가돼요")
      ),
      // 작동 방식 안내
      h("div",{style:{background:"#EEF5F1",borderRadius:"12px",padding:"13px 15px",margin:"10px 0 14px",fontSize:"12.5px",lineHeight:"1.8",color:"#1A5E44"}},
        "💡 ",h("strong",{},"고정비 탭은 소비를 잡지 않아요"),h("br"),
        "실제 소비는 카드/은행 거래가 들어올 때 잡히고,",h("br"),
        "여기서는 그 거래가 납부됐는지 자동으로 감지해줘요.",h("br"),h("br"),
        "• ",h("strong",{},"공용 고정비"),": 공용통장 출금 → 납부됨 감지",h("br"),
        "• ",h("strong",{},"개인 고정비"),": 카드/카카오뱅크 출금 → 납부됨 감지",h("br"),
        "• 내통장→공용통장 이체는 이체(제외)로 처리돼요 ✅"
      )
    );
    // 추천 항목 클릭 카드
    const sugList=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    const existingNames=fcs.map(f=>f.name);
    SUGGESTED_FC.forEach(sg=>{
      if(existingNames.includes(sg.name))return;
      const c=CM[sg.category]||CM["기타"];
      const card=h("div",{
        style:{display:"flex",alignItems:"center",gap:"12px",padding:"12px 14px",borderRadius:"12px",background:"#F6F4EF",border:`1px solid ${C.line}`,cursor:"pointer",transition:"all .12s"},
        onmouseenter:e=>{e.currentTarget.style.background=C.soft;e.currentTarget.style.borderColor=C.brand;},
        onmouseleave:e=>{e.currentTarget.style.background="#F6F4EF";e.currentTarget.style.borderColor=C.line;},
        onclick:()=>showAddFixed(sg)
      },
        h("div",{style:{width:"36px",height:"36px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"17px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"13.5px",fontWeight:"700"}},sg.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},
            W(sg.amount)+" · "+sg.account+(sg.billing_day?" · 매월 "+sg.billing_day+"일":"")
          )
        ),
        h("div",{style:{fontSize:"11.5px",fontWeight:"700",color:C.brand,padding:"5px 10px",borderRadius:"8px",background:C.soft,whiteSpace:"nowrap"}},"＋ 추가")
      );
      sugList.append(card);
    });
    emptySec.append(sugList);
    return reorderCards("fixed",[hero,emptySec]);
  }

  // 고정비 있을 때도 추가 안 된 추천 항목 보여주기
  const existingNames=withStatus.map(f=>f.name);
  const inactiveNames=(S.fixedInactive||[]).map(f=>f.name);
  const remainingSug=SUGGESTED_FC.filter(sg=>!existingNames.includes(sg.name)&&!inactiveNames.includes(sg.name));

  const reloadFixed=async()=>{
    await Promise.all([loadFixed(),loadMonth()]);
    const ct=document.getElementById("ct");
    if(ct){ct.innerHTML="";buildFixed().forEach(n=>ct.append(n));}
  };

  const buildRow=(fc)=>{
    const c=CM[fc.category]||CM["기타"];
    const paid=fc.paid;
    const dayStr=fc.billing_day?`매월 ${fc.billing_day}일`:"";
    const delBtn=h("button",{style:{color:C.faint,fontSize:"14px",padding:"6px",flexShrink:"0"},onclick:async(e)=>{

      padding:"13px 4px 13px 8px",borderBottom:`1px solid ${C.line}`,

      background:_sm.bg,
      cursor:"pointer",borderRadius:"4px",transition:"background .12s"
    },onclick:()=>showFixedDetail(fc,reloadFixed)},
      h("div",{style:{width:"38px",height:"38px",borderRadius:"11px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"14px",fontWeight:"600"}},fc.name),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},
          [fc.account==="공용"?"공용":"개인",fc.payment_method,dayStr,fc.memo].filter(Boolean).join(" · ")
        )
      ),
      h("div",{style:{textAlign:"right",marginRight:"4px"}},
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(fc.amount)),
        h("div",{style:{fontSize:"11px",marginTop:"3px",fontWeight:"700",color:_sm.col}},_sm.lb),
        ddayChip
      ),
      delBtn
    );
  };

  const sections=[];

  // 🔔 다가오는 납부 (이번 달 · 미납 · 청구일순)
  if(S.curYm===ym(td())){
    const upcoming=unpaidList.map(fc=>({fc,due:fcDueInfo(fc)})).filter(x=>x.due&&x.due.dday!=null).sort((a,b)=>a.due.dday-b.due.dday);
    if(upcoming.length){
      const dueSec=sec("🔔 다가오는 납부",`${upcoming.length}건`);
      upcoming.slice(0,6).forEach(({fc,due})=>{
        const urgent=due.dday<=3;
        dueSec.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 2px",borderBottom:`1px solid ${C.line}`,cursor:"pointer"},onclick:()=>showFixedDetail(fc,reloadFixed)},
          h("div",{style:{display:"flex",alignItems:"center",gap:"9px",minWidth:"0"}},
            h("div",{style:{fontSize:"11px",fontWeight:"800",minWidth:"44px",textAlign:"center",color:urgent?C.w:C.sub,background:urgent?C.over:"#EFEBE2",borderRadius:"7px",padding:"4px 6px",flexShrink:"0"}},due.dday<0?`${Math.abs(due.dday)}일↑`:due.dday===0?"오늘":`D-${due.dday}`),
            h("div",{style:{fontSize:"13px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},fc.name)),
          h("div",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",flexShrink:"0",marginLeft:"8px"}},W(fc.amount))
        ));
      });
      sections.push(dueSec);
    }
  }

  // 정렬 선택
  const sortSel=h("div",{style:{display:"flex",gap:"5px",marginBottom:"4px",flexWrap:"wrap"}});
  [["due","납부일순"],["amount","금액순"],["name","이름순"]].forEach(([k,lb])=>{
    const on=getFcSort()===k;
    sortSel.append(h("button",{style:{fontSize:"11.5px",fontWeight:"700",padding:"6px 11px",borderRadius:"8px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.sub,cursor:"pointer"},onclick:()=>{setFcSort(k);reloadFixed();}},lb));
  });

  if(unpaidList.length){
    const unSec=sec(h("span",{style:{color:C.over}},"⏳ 미납"),`${unpaidList.length}건 · ${W(unpaidAmt).slice(1)}`);

    sortFcList(unpaidList).forEach(fc=>unSec.append(buildRow(fc)));
    sections.push(unSec);
  }
  if(paidList.length){
    const pSec=sec("✅ 납부 완료",`${paidList.length}건 · ${W(paidAmt).slice(1)}`);
    if(!unpaidList.length)pSec.append(sortSel);
    sortFcList(paidList).forEach(fc=>pSec.append(buildRow(fc)));
    sections.push(pSec);
  }

  // 📺 구독 서비스 묶음
  const subs=withStatus.filter(isSubscriptionFc);
  if(subs.length){
    const subTotal=subs.reduce((s2,f)=>s2+Number(f.amount),0);
    const subSec=sec("📺 구독 서비스",`${subs.length}개 · 월 ${W(subTotal).slice(1)}`);
    sortFcList(subs).forEach(fc=>{
      subSec.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 2px",borderBottom:`1px solid ${C.line}`,cursor:"pointer"},onclick:()=>showFixedDetail(fc,reloadFixed)},
        h("div",{style:{display:"flex",alignItems:"center",gap:"8px",minWidth:"0"}},
          h("span",{style:{fontSize:"15px",flexShrink:"0"}},(CM[fc.category]||CM["기타"]).i),
          h("div",{style:{fontSize:"13px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},fc.name)),
        h("div",{class:"num",style:{fontSize:"13px",fontWeight:"700",flexShrink:"0",marginLeft:"8px",color:fc.paid?C.sub:C.over}},W(fc.amount))

// 시장 지수/환율 캐시 (세션 동안 재사용, 새로고침 시 갱신)
const MARKET_SYMBOLS=[
  {sym:"^GSPC",label:"S&P 500"},
  {sym:"^IXIC",label:"NASDAQ"},
  {sym:"^KS11",label:"코스피"},
  {sym:"^KQ11",label:"코스닥"},
  {sym:"USDKRW=X",label:"원/달러"},
];
async function loadMarket(force){
  if(S.market&&!force)return S.market;
  const syms=MARKET_SYMBOLS.map(m=>m.sym);
  const q=await fetchQuotes(syms);
  S.market=q;return q;
}
async function loadMarketSpark(force){
  if(S.marketSpark&&!force)return S.marketSpark;
  const syms=MARKET_SYMBOLS.map(m=>m.sym).join(",");
  try{
    const r=await fetch(`${MARKET_PROXY}?symbols=${encodeURIComponent(syms)}&spark=1`,{headers:{apikey:SKEY,Authorization:"Bearer "+SKEY}});
    const d=await r.json();
    S.marketSpark=d?.data||{};
  }catch(e){dlog("[시장차트실패]",e);S.marketSpark={};}
  return S.marketSpark;
}
// 미니 스파크라인 SVG
function sparkline(history,color,stamps,currency){
  const box=h("div",{style:{width:"120px",height:"38px",flexShrink:"0"}});
  if(!Array.isArray(history)||history.length<2)return box;
  // 1주일치만 (마지막 7개)
  const hist=history.slice(-7);
  const stmp=Array.isArray(stamps)?stamps.slice(-7):null;
  const cv=document.createElement("canvas");box.append(cv);
  const fmtV=v=>currency==="USD"?("$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})):("₩"+Math.round(v).toLocaleString());
  setTimeout(()=>{
    if(!window.Chart)return;
    const ctx=cv.getContext("2d");
    const grad=ctx.createLinearGradient(0,0,0,38);
    const rgb=color===C.brand?"30,110,82":color===C.over?"194,85,61":"140,133,122";
    grad.addColorStop(0,`rgba(${rgb},.28)`);grad.addColorStop(1,`rgba(${rgb},0)`);
    // 끝점만 점 찍기

  // ── 차트용 OHLC 배열 추출 (프록시 응답 키가 뭐든 방어적으로) ──
function extractOHLC(d,closeArr){
  if(!d)return null;
  const pick=(...names)=>{for(const n of names){const v=d[n];if(Array.isArray(v)&&v.length)return v;}return null;};
  const o=pick("opens","open_arr","openHistory","o");
  const hi=pick("highs","high_arr","highHistory","h");
  const lo=pick("lows","low_arr","lowHistory","l");
  const c=pick("closes","close_arr","closeHistory","c")||closeArr;
  if(o&&hi&&lo&&c)return{o,h:hi,l:lo,c};
  const arr=Array.isArray(d.ohlc)?d.ohlc:Array.isArray(d.candles)?d.candles:Array.isArray(d.quotes)?d.quotes:null;
  if(arr&&arr.length){
    const O=[],H=[],L=[],Cc=[];
    for(const it of arr){
      if(Array.isArray(it)){O.push(it[0]);H.push(it[1]);L.push(it[2]);Cc.push(it[3]);}
      else{O.push(it.o??it.open);H.push(it.h??it.high);L.push(it.l??it.low);Cc.push(it.c??it.close);}
    }
    return{o:O,h:H,l:L,c:Cc};
  }
  return null;
}

// ══════════ 업종 비중 도넛 ══════════
function buildSectorDonut(latest){
  if(!latest||!latest.length)return null;
  const agg={};
  latest.forEach(x=>{const s=sectorOf(x.ticker),v=Number(x.eval_value_krw)||0;if(v>0)agg[s]=(agg[s]||0)+v;});
  const items=Object.entries(agg).map(([name,val])=>({name,val})).sort((a,b)=>b.val-a.val);
  if(items.length<2)return null;
  const total=items.reduce((s,x)=>s+x.val,0);
  const sec_=sec("🏭 업종 비중","평가액 기준");
  const wrap=h("div",{style:{display:"flex",gap:"16px",alignItems:"center",flexWrap:"wrap"}});
  const canvasBox=h("div",{style:{position:"relative",width:"150px",height:"150px",flexShrink:"0"}});
  const cv=document.createElement("canvas");cv.width=150;cv.height=150;canvasBox.append(cv);
  const colors=["#D85A30","#2E7D32","#2F6D9B","#8B4FB2","#B23A5C","#16747B","#8A5A39","#405AA3","#C99A2B","#5B8C3A","#9B4D6E","#3C7A7E","#7A6CA8"];
  const legend=h("div",{style:{flex:"1",minWidth:"160px",display:"flex",flexDirection:"column",gap:"6px"}});
  items.forEach((x,i)=>{
    const pct=Math.round(x.val/total*100);
    legend.append(h("div",{style:{display:"flex",alignItems:"center",gap:"7px",fontSize:"12px"}},
      h("span",{style:{width:"9px",height:"9px",borderRadius:"3px",background:colors[i%colors.length],flexShrink:"0"}}),
      h("span",{style:{flex:"1",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},x.name),
      h("span",{class:"num",style:{fontWeight:"700",color:C.sub}},W(x.val)+" · "+pct+"%")
    ));
  });
  wrap.append(canvasBox,legend);sec_.append(wrap);
  setTimeout(()=>{if(!window.Chart)return;new window.Chart(cv,{type:"doughnut",data:{labels:items.map(x=>x.name),datasets:[{data:items.map(x=>x.val),backgroundColor:items.map((x,i)=>colors[i%colors.length]),borderWidth:2,borderColor:"#fff"}]},options:{cutout:"66%",plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>` ${c.label}: ${Math.round(c.parsed/total*100)}%`}}},animation:{duration:600}}});},50);
  return sec_;
}

// ══════════ 월간 수익률 달력 ══════════
function buildReturnCalendar(){
  const snaps=(S.allSnaps||[]).slice().sort((a,b)=>(a.snapshot_date||"").localeCompare(b.snapshot_date||""));
  if(snaps.length<1)return null;
  const[yr,mo]=S.curYm.split("-").map(Number);
  const byDate={};
  snaps.forEach((r,i)=>{
    const prev=i>0?snaps[i-1]:null;
    let pct=null;
    if(prev&&Number(prev.total_value_krw)>0)pct=(Number(r.total_value_krw)-Number(prev.total_value_krw))/Number(prev.total_value_krw)*100;
    else if(r.return_rate_krw!=null)pct=Number(r.return_rate_krw);
    byDate[r.snapshot_date]={pct,val:Number(r.total_value_krw)||0};
  });
  const monthDays=Object.keys(byDate).filter(d=>d.slice(0,7)===S.curYm);
  if(!monthDays.length)return null;
  const sec_=sec("📅 월간 수익률 달력",`${monthDays.length}일 기록 · 전일比`);
  const firstDay=new Date(yr,mo-1,1).getDay();
  const lastDate=new Date(yr,mo,0).getDate();
  const cal=h("div",{style:{background:C.w}});
  const hdr=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"4px"}});
  ["월","화","수","목","금","토","일"].forEach((d,i)=>hdr.append(h("div",{style:{textAlign:"center",fontSize:"10.5px",color:i>=5?"#B23A5C":C.faint,fontWeight:"700"}},d)));
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
  const offset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<offset;i++)grid.append(h("div",{}));
  for(let d=1;d<=lastDate;d++){
    const ds=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const data=byDate[ds];
    let bg="transparent",col=C.faint,pctTxt="";
    if(data&&data.pct!=null){
      const p=data.pct,a=Math.min(.30,Math.abs(p)/15+.07);
      bg=p>=0?`rgba(30,110,82,${a})`:`rgba(194,85,61,${a})`;
      col=p>=0?C.brand:C.over;pctTxt=(p>=0?"+":"")+p.toFixed(1);
    }
    grid.append(h("div",{style:{minHeight:"42px",borderRadius:"8px",background:bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"1px",padding:"2px"}},
      h("div",{style:{fontSize:"11px",fontWeight:"600",color:data?C.ink:C.faint}},d),
      pctTxt?h("div",{class:"num",style:{fontSize:"9px",fontWeight:"700",color:col}},pctTxt):""
    ));
  }
  cal.append(hdr,grid);sec_.append(cal);
  return sec_;
}

// 공통 드래그(부드러운 추적 + 슬라이드) — axis:"y"(카드) | "xy"(탭)
function attachDrag(el,opts){
  if(el._rbound)return;el._rbound=true;
  const{scope,axis,onDrop,inEdit}=opts;
  let pressTimer=null,sx=0,sy=0,dragging=false;
  const onDown=(e)=>{
    if(e.target&&e.target.closest&&e.target.closest(".rctl,.rsz"))return;
    const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;
    if(REORDER.editing&&inEdit()){beginDrag(e);return;}
    pressTimer=setTimeout(()=>{pressTimer=null;if("vibrate"in navigator){try{navigator.vibrate(14);}catch{}}enterReorder(scope);beginDrag(e);},450);
  };
  const onMoveWait=(e)=>{if(pressTimer){const pt=e.touches?e.touches[0]:e;if(Math.abs(pt.clientX-sx)>10||Math.abs(pt.clientY-sy)>10){clearTimeout(pressTimer);pressTimer=null;}}};
  const onUpWait=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
  el.addEventListener("touchstart",onDown,{passive:true});
  el.addEventListener("mousedown",onDown);
  el.addEventListener("touchmove",onMoveWait,{passive:true});
  el.addEventListener("mousemove",onMoveWait);
  el.addEventListener("touchend",onUpWait);el.addEventListener("mouseup",onUpWait);
  const cls=axis==="xy"?"rtab":"rcard";
  const sibsOf=(ct)=>[...ct.children].filter(c=>c.classList&&c.classList.contains(cls)&&!c._ph);
  function beginDrag(e){
    if(dragging)return;
    const ct=el.parentNode;if(!ct)return;dragging=true;
    const pt0=e.touches?e.touches[0]:e;
    const rect=el.getBoundingClientRect();
    const grabX=pt0.clientX-rect.left, grabY=pt0.clientY-rect.top;
    const cs=getComputedStyle(el);
    // 빈자리 플레이스홀더
    const ph=document.createElement("div");ph._ph=true;
    ph.style.width=rect.width+"px";ph.style.height=rect.height+"px";
    ph.style.margin=cs.margin;ph.style.boxSizing="border-box";ph.style.flex="0 0 auto";
    ph.style.borderRadius="16px";ph.style.background="rgba(120,110,95,.07)";
    ph.style.gridColumn=el.style.gridColumn||"span 12";
    ct.insertBefore(ph,el);
    // 잡은 카드를 body로 띄움(레이아웃 분리)
    document.body.appendChild(el);
    el.classList.add("rdrag");
    Object.assign(el.style,{position:"fixed",zIndex:"80",margin:"0",width:rect.width+"px",height:rect.height+"px",left:rect.left+"px",top:rect.top+"px",transition:"transform .12s ease,box-shadow .18s ease",transform:axis==="xy"?"scale(1.06)":"scale(1.03)",pointerEvents:"none"});
    const move=(ev)=>{
      if(ev.cancelable)ev.preventDefault();
      const p=ev.touches?ev.touches[0]:ev,px=p.clientX,py=p.clientY;
      el.style.left=(px-grabX)+"px";el.style.top=(py-grabY)+"px";
      const sibs=sibsOf(ct);
      let target=null;
      for(const s of sibs){
        const r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
        const before=axis==="xy"?(py<r.top?true:(py>r.bottom?false:px<cx)):(py<cy);
        if(before){target=s;break;}
      }
      if(target){if(ph.nextElementSibling!==target)flipMove(sibs,()=>ct.insertBefore(ph,target));}
      else{if(ct.lastElementChild!==ph)flipMove(sibs,()=>ct.appendChild(ph));}
    };
    const up=()=>{
      document.removeEventListener("touchmove",move);document.removeEventListener("mousemove",move);
      document.removeEventListener("touchend",up);document.removeEventListener("mouseup",up);
      const slot=ph.getBoundingClientRect();
      el.style.transition="left .2s cubic-bezier(.2,.8,.2,1),top .2s cubic-bezier(.2,.8,.2,1),transform .2s ease,box-shadow .2s ease";
      el.style.left=slot.left+"px";el.style.top=slot.top+"px";el.style.transform="scale(1)";
      let done=false;
      const finish=()=>{
        if(done)return;done=true;
        el.removeEventListener("transitionend",finish);
        ct.insertBefore(el,ph);ph.remove();
        el.classList.remove("rdrag");
        ["position","zIndex","margin","width","height","left","top","transform","transition","pointerEvents"].forEach(k=>el.style[k]="");
        el.style.position="relative";
        dragging=false;onDrop();
      };
      el.addEventListener("transitionend",finish);
      setTimeout(finish,260);
    };
    document.addEventListener("touchmove",move,{passive:false});
    document.addEventListener("mousemove",move);
    document.addEventListener("touchend",up);document.addEventListener("mouseup",up);
  }
}
// FLIP: DOM 변경 전후 좌표 비교 → 이동량만큼 거꾸로 걸었다가 0으로 풀어 슬라이드
function flipMove(nodes,mutate){
  const first=new Map();
  nodes.forEach(n=>first.set(n,n.getBoundingClientRect()));
  mutate();
  nodes.forEach(n=>{
    const a=first.get(n);if(!a)return;
    const b=n.getBoundingClientRect();
    const dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy){
      n.style.transition="none";
      n.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>{n.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";n.style.transform="";});
    }
  });
}

function applySpan(el,sp){el.style.gridColumn="span "+sp;["sp4","sp6","sp8","sp12"].forEach(c=>el.classList.remove(c));el.classList.add("sp"+sp);}
function currentSpan(el){for(const c of["sp4","sp6","sp8","sp12"])if(el.classList.contains(c))return +c.slice(2);return 12;}
function attachResize(el,tab,key){
  const handle=h("div",{class:"rsz",title:"크기 조절"});
  const snapOf=(clientX)=>{
    const ct=el.parentNode;if(!ct)return currentSpan(el);
    const col=ct.getBoundingClientRect().width/12;
    const left=el.getBoundingClientRect().left;
    let n=Math.round((clientX-left)/col);n=Math.max(3,Math.min(12,n));
    const snaps=[4,6,8,12];let best=4,bd=99;snaps.forEach(sv=>{const d=Math.abs(sv-n);if(d<bd){bd=d;best=sv;}});return best;
  };
  const down=(e)=>{
    if(!(REORDER.editing&&REORDER.scope==="card"))return;
    if(e.cancelable)e.preventDefault();e.stopPropagation();
    el.classList.add("rresizing");
    const move=(ev)=>{if(ev.cancelable)ev.preventDefault();const p=ev.touches?ev.touches[0]:ev;applySpan(el,snapOf(p.clientX));};
    const up=()=>{el.classList.remove("rresizing");
      document.removeEventListener("touchmove",move);document.removeEventListener("mousemove",move);
      document.removeEventListener("touchend",up);document.removeEventListener("mouseup",up);
      setCardStateFor(tab,key,{sp:currentSpan(el)});try{window.dispatchEvent(new Event("resize"));}catch{}};
    document.addEventListener("touchmove",move,{passive:false});document.addEventListener("mousemove",move);
    document.addEventListener("touchend",up);document.addEventListener("mouseup",up);
  };
  handle.addEventListener("mousedown",down);handle.addEventListener("touchstart",down,{passive:false});
  el.appendChild(handle);
}
function addCardControls(el,tab,key){

function reorderCards(tab,cards){
  const list=(cards||[]).filter(Boolean);
  if(list.length<2)return list;
  ensureReorderStyle();
  const st=getCardState(tab);
  const visible=[];
  list.forEach((el,i)=>{
    const key=autoKey(el);el.dataset.rkey=key;el.classList.add("rcard");
    if(!el.style.position)el.style.position="relative";
    const cs=st[key]||{};
    applySpan(el,cs.sp||(cs.sz?6:12));
    if(cs.col)el.classList.add("collapsed");
    addCardControls(el,tab,key);
    attachResize(el,tab,key);
    attachDrag(el,{scope:"card",axis:"y",inEdit:()=>REORDER.scope==="card",onDrop:()=>persistOrder(tab)});
    if(!cs.hid)visible.push({el,key,i});
  });
  const saved=getCardOrder(tab);
  const idxOf=k=>{const i=saved.indexOf(k);return i<0?9999:i;};
  visible.sort((a,b)=>(idxOf(a.key)-idxOf(b.key))||(a.i-b.i));
  const out=visible.map(o=>o.el);
  if(out[0])requestAnimationFrame(()=>{const ct=out[0].parentNode;if(ct){ct.classList.add("cardgrid");ensureHiddenChip(ct,tab);}});
  return out;
}

      const quotes=await fetchQuotes(syms);
      const fx=Number(latest[0]?.fx_rate)||Number(lt?.exchange_rate)||1380;
      let updated=0;
      for(const x of latest){
        const q=x.ticker&&quotes[x.ticker];
        if(!q||q.price==null)continue;
        const qty=Number(x.quantity)||0;
        if(!qty)continue;
        const usd=q.currency==="KRW"?null:q.price*qty;
        const krw=q.currency==="KRW"?q.price*qty:Math.round(q.price*qty*fx);
        const newUsd=usd!=null?Math.round(usd*100)/100:x.eval_value_usd;
        await sb.from("investment_holdings").update({eval_value_krw:Math.round(krw),eval_value_usd:newUsd,day_change_pct:q.changePct??null}).eq("id",x.id);
        updated++;
      }
      refreshBtn.textContent=`✅ ${updated}개 갱신됨`;
      await loadInvest();
      const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildInvest().forEach(n=>ct.append(n));}
    };
    const manageBtn=h("button",{style:{width:"100%",marginBottom:"10px",fontSize:"13px",fontWeight:"700",padding:"10px",borderRadius:"10px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer"},onclick:()=>showHoldingManage(latestDate)},"✏️ 종목 직접 추가·삭제");
    holdSec.append(refreshBtn,manageBtn,toggle,listWrap);
  }
  const latestForDonut=hold.length?hold.filter(x=>x.snapshot_date===hold[0].snapshot_date):[];
  const donutSec=hold.length?buildDonut(latestForDonut):null;
  const sectorSec=hold.length?buildSectorDonut(latestForDonut):null;
  const calSec=buildReturnCalendar();
  const trendSec=buildTrend();
  return reorderCards("invest",[hero,marketSec,trendSec,calSec,donutSec,sectorSec,holdSec,hist,addBtn]);
}

    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"📊 보유종목 & 주가"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),

// ════════════════════ 🤝 공용 탭 ════════════════════
function sharedKindOf(t){
  const ty=t.type;
  if(ty==="공용입금")return "deposit";
  if(["소비(일시불)","소비(할부)"].includes(ty))return "spend";
  if(["정산환급","환불/취소"].includes(ty))return "reduce";
  if(ty==="이체")return "flow";
  return "spend";
}
// 고정비 납부 자동 감지: 같은 카테고리+비슷한 금액의 공용 소비가 이번달에 있으면 납부됨
function sfcPaidAuto(sfc){
  return S.sharedTxns.some(t=>{
    if(sharedKindOf(t)!=="spend")return false;
    const a=Number(t.amount),fa=Number(sfc.amount);
    return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
  });
}
// 고양이 한 마디 (랜덤이 아니라 인덱스 순환 → 안정적)
function catSay(idx,text){
  const cat=CATS_MASCOT[idx%CATS_MASCOT.length];
  return h("div",{style:{display:"flex",alignItems:"flex-start",gap:"10px"}},
    h("div",{style:{fontSize:"26px",flexShrink:"0",lineHeight:"1"}},cat.emoji),
    h("div",{style:{fontSize:"13px",lineHeight:"1.6"}},h("span",{style:{fontWeight:"800",color:cat.color}},cat.name+" "),text)
  );
}

function buildShared(){
  const st=getSharedTab();
  const spend=S.sharedTxns.filter(t=>sharedKindOf(t)==="spend").reduce((s,t)=>s+Number(t.amount),0);
  const reduce=S.sharedTxns.filter(t=>sharedKindOf(t)==="reduce").reduce((s,t)=>s+Number(t.amount),0);
  const netSpend=Math.max(0,spend-reduce);
  const deposits=S.sharedTxns.filter(t=>sharedKindOf(t)==="deposit");
  const depByPerson={"정근":0,"여친":0};
  deposits.forEach(t=>{const who=(t.merchant||"").includes("여친")?"여친":"정근";depByPerson[who]+=Number(t.amount);});
  const totalDep=depByPerson["정근"]+depByPerson["여친"];

  // ① 상단 요약 + 고양이 인사

      h("div",{},h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 공용 지출"),h("div",{class:"num",style:{fontSize:"34px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1"}},W(netSpend))),
      h("div",{style:{fontSize:"30px",display:"flex",gap:"-6px"}},
        h("span",{style:{}},"🐈‍⬛"),h("span",{style:{marginLeft:"-8px"}},"🐈")

    ),

        h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"💰 통장에 모인 돈"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(totalDep)),
        h("div",{style:{fontSize:"11px",color:C.brand,marginTop:"2px"}},`정근 ${shortNum(depByPerson["정근"])} · 여친 ${shortNum(depByPerson["여친"])}`)
      ),
      h("div",{style:{background:netSpend>totalDep?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:netSpend>totalDep?C.over:C.sub,fontWeight:"700",marginBottom:"4px"}},netSpend>totalDep?"⚠️ 통장 부족":"통장 잔액"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:netSpend>totalDep?C.over:C.ink}},W(Math.abs(totalDep-netSpend))),
        h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"2px"}},netSpend>totalDep?"입금이 더 필요해요":"여유분")
      )
    )
  );
  out.push(hero);

  // ② 공용 고정비 (Supabase, 클릭수정·추가·삭제)

  }else{

      const c=CM[sfc.category]||CM["기타"];

  // ③ 정산 도우미
  out.push(buildSettlement());

  // ④ 생활비 입금
  out.push(buildDepositSection(depByPerson,st));

    S.sharedTxns.slice(0,20).forEach(t=>{
      const c=CM[t.category]||CM["기타"];

  out.push(txSec);
  return reorderCards("shared",out);
}

function buildSettlement(){
  const st=getSharedTab();
  const items=[];
  // (A) 고정비 중 개인 결제(settle:true)이고 납부 감지된 것
  SHARED_FC.forEach(sfc=>{
    const pm=PAY_META[sfc.pay];
    if(!pm||!pm.settle)return;
    const matched=S.sharedTxns.find(t=>{
      if(sharedKindOf(t)!=="spend")return false;
      const a=Number(t.amount),fa=Number(sfc.amount);
      return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
    });
    if(!matched)return;
    items.push({key:"fc_"+sfc.id+"_"+S.curYm,who:pm.who,name:sfc.name,amount:Number(matched.amount)});
  });
  // (B) 공용 변동 지출 중 결제수단이 개인(settle:true)인 거래
  S.sharedTxns.forEach(t=>{
    if(sharedKindOf(t)!=="spend")return;
    const pm=PAY_META[t.payment_method];
    if(!pm||!pm.settle)return;
    items.push({key:"tx_"+t.id,who:pm.who,name:t.merchant||t.category||"공용 지출",amount:Number(t.amount)});
  });

  const el=sec("🐈 정산 도우미","");
  const pending=items.filter(it=>!st.settled[it.key]);
  const done=items.filter(it=>st.settled[it.key]);

  if(!items.length){
    el.append(catSay(0,"아직 정산할 게 없다냥~ 공용통장이나 카드로 잘 쓰고 있다냥! 🐾"));
    return el;
  }

  pending.forEach((it,idx)=>{
    const half=Math.round(it.amount/2);
    const who=it.who||"정근";
    const card=h("div",{style:{background:"#FFFBEE",border:`1px solid ${C.warn}55`,borderRadius:"14px",padding:"14px",marginBottom:"10px"}});
    const opt=(icon,label,sub,val)=>h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:C.w,border:`1px solid ${C.line}`,marginBottom:"7px"}},
      h("span",{style:{fontSize:"17px"}},icon),
      h("div",{style:{flex:"1"}},h("div",{style:{fontSize:"13px",fontWeight:"700"}},label),h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"1px"}},sub)),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},val));
    card.append(
      h("div",{style:{marginBottom:"12px"}},catSay(idx,`${who}이가 ${it.name} ${W(it.amount)} 대신 냈다냥! 둘 중 하나로 정산하라냥~`)),
      opt("🏦","공용통장에 입금","상대도 똑같이 채우기",W(it.amount)),
      opt("💸",`${who}에게 직접 송금`,"절반만 정산",W(half)),
      h("button",{style:{width:"100%",marginTop:"4px",fontSize:"13px",fontWeight:"700",padding:"11px",borderRadius:"11px",border:`1px solid ${C.brand}`,background:C.soft,color:C.brand,cursor:"pointer"},
        onclick:()=>{const s2=getSharedTab();s2.settled[it.key]=true;saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"✅ 정산 완료로 표시")
    );
    el.append(card);
  });
  if(done.length){
    done.forEach(it=>{
      el.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 10px",borderRadius:"10px",background:C.soft,marginBottom:"6px"}},
        h("div",{style:{fontSize:"12.5px",color:C.brand,fontWeight:"600"}},`✅ ${it.name} 정산 완료`),
        h("button",{style:{fontSize:"11px",color:C.faint,cursor:"pointer"},onclick:()=>{const s2=getSharedTab();delete s2.settled[it.key];saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"되돌리기")
      ));
    });
  }
  return el;
}
