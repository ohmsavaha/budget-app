  const head=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 20px 10px",flexShrink:"0"}},
    h("div",{},h("div",{style:{fontSize:"16px",fontWeight:"800"}},`💳 ${pm} 명세서`),h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},"청구월별 사용 내역")),
    h("button",{style:{fontSize:"22px",color:C.sub,cursor:"pointer",background:"transparent",border:"none"},onclick:()=>ov.remove()},"✕"));
  const body=h("div",{style:{flex:"1",overflowY:"auto",padding:"4px 20px 22px"}});

    const since=(()=>{const d=new Date();d.setMonth(d.getMonth()-12);return dstr(d);})();

    // 청구월 = 일시불/그달할부 → 사용월+1, 미래할부분(당월)도 그 청구월에
    const byBill={};

      const useM=(t.date||"").slice(0,7);if(!useM)return;
      const billM=shYm(useM,1);  // 사용한 달의 다음 달 청구

    if(!months.length){body.append(empty("최근 1년간 이 카드 사용 내역이 없어요."));return;}

      h("span",{style:{fontSize:"12px",color:C.sub,fontWeight:"700"}},`최근 1년 ${tx.length}건 합계`),
      h("span",{class:"num",style:{fontSize:"16px",fontWeight:"800"}},W(grand))));
    // 이번 청구월 실제 청구 확정 (명세서 안에서만)
    if(opt&&opt.bym){
      const{data:existBill}=await sb.from("transactions").select("amount").eq("type","카드대금").eq("merchant",pm).gte("date",opt.bym+"-01").lte("date",opt.bym+"-31");
      const done=existBill&&existBill.length;
      const cbox=h("div",{style:{background:done?"#EAF4EE":"#FFFBEE",borderRadius:"12px",padding:"13px 15px",marginBottom:"14px",border:`1px solid ${done?C.brand:C.line}`}});
      if(done){
        const sum=existBill.reduce((a,x)=>a+(Number(x.amount)||0),0);
        cbox.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("span",{style:{fontSize:"12.5px",fontWeight:"800",color:C.brand}},`✓ ${yml(opt.bym)} 청구 확정됨`),
          h("span",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},W(sum))));
        cbox.append(h("button",{style:{marginTop:"9px",width:"100%",fontSize:"11.5px",fontWeight:"700",padding:"8px",borderRadius:"9px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer"},onclick:async()=>{if(!confirm(`${yml(opt.bym)} 확정을 취소할까요?`))return;await sb.from("transactions").delete().eq("type","카드대금").eq("merchant",pm).gte("date",opt.bym+"-01").lte("date",opt.bym+"-31");await loadMonth();ov.remove();toast("확정을 취소했어요");if(opt.onConfirmed)opt.onConfirmed();}},"확정 취소"));
      }else{
        cbox.append(h("div",{style:{fontSize:"12px",color:C.sub,marginBottom:"9px",lineHeight:"1.6"}},`💡 ${yml(opt.bym)} 명세서가 나왔으면 실제 청구액을 확정하세요. (예상 ${W(opt.estimate||0)})`));
        cbox.append(h("button",{style:{width:"100%",fontSize:"13px",fontWeight:"800",padding:"11px",borderRadius:"10px",border:"none",background:C.brand,color:"#fff",cursor:"pointer"},onclick:()=>{ov.remove();showBillConfirm(pm,opt.estimate||0,opt.bym,opt.onConfirmed);}},"✓ 실제 청구 확정하기"));
      }
      body.append(cbox);
    }
    months.forEach(bm=>{
      const arr=byBill[bm].slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      const mtot=arr.reduce((s,t)=>s+(Number(t.amount)||0),0);
      let open=bm===months[0]; // 최신만 펼침
      const hdr=h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:"8px"}},h("span",{class:"caret",style:{fontSize:"11px",color:C.faint,transition:"transform .15s",display:"inline-block",transform:open?"rotate(90deg)":"none"}},"▶"),h("span",{style:{fontSize:"13.5px",fontWeight:"800"}},`${bm.slice(0,4)}년 ${Number(bm.slice(5,7))}월 청구`),h("span",{style:{fontSize:"10.5px",color:C.faint}},`${arr.length}건`)),
        h("span",{class:"num",style:{fontSize:"14px",fontWeight:"800"}},W(mtot)));
      const detail=h("div",{style:{display:open?"block":"none",padding:"2px 0 8px"}});
      arr.forEach(t=>{const c=CM[t.category]||CM["기타"];

          h("div",{style:{fontSize:"11px",fontWeight:"800",color:inten>0.5?"#fff":C.ink}},(i+1)+"월"),

    }

    // 모드 토글
    const toggleRow=h("div",{style:{display:"flex",gap:"8px"}});
    ["개인소비","공용소비","수입","저축"].forEach(m=>{
      const sel=mode===m;
      toggleRow.append(h("button",{
        style:{flex:"1",fontSize:"12px",fontWeight:"700",padding:"10px 4px",borderRadius:"10px",border:`1px solid ${sel?C.ink:C.line}`,background:sel?C.ink:C.w,color:sel?C.w:C.sub,cursor:"pointer",whiteSpace:"nowrap"},
        onclick:()=>{mode=m;draw();}
      },m));
    });
    container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"14px",padding:"14px"}},toggleRow));

    // 월별 수입/소비/저축/투자 집계
    const mInc=Array(12).fill(0),mSp=Array(12).fill(0),mSv=Array(12).fill(0),mIv=Array(12).fill(0);
    for(const t of (S.yearTxns||[])){const mm=parseInt(t.date.slice(5,7))-1;if(mm<0||mm>11)continue;if(isInternalTransfer(t))continue;const a=Number(t.amount)||0,k=kindOf(t.type);if(k==="income")mInc[mm]+=a;else if(k==="spend")mSp[mm]+=a;else if(t.type==="저축/적금")mSv[mm]+=a;else if(t.type==="투자")mIv[mm]+=a;}
    const yMemos=getDayMemos();

          h("div",{style:{fontSize:"13px",fontWeight:"800",color:isHL?C.brand:C.ink}},(i+1)+"월"+(yMemos[memoKey]?" 📝":"")),

    }
    // 📋 월별 상세 표
    {
      const tbl=sec("📋 월별 상세",h("span",{style:{fontSize:"10.5px",color:C.faint}},"탭하면 내역"));

      let shown=0;
      for(let i=0;i<12;i++){

            cell("수입",inc>0?"+"+shortNum(inc):"—",inc>0?C.brand:C.faint),

      tbl.append(h("div",{style:{fontSize:"10px",color:C.faint,marginTop:"9px",lineHeight:"1.5"}},"순액 = 수입 − 소비 − 저축 − 투자 (그 달에 남거나 모자란 돈)"));
      container.append(tbl);
    }

    // 카테고리 연간 순위 (개인소비만)
    if(mode==="개인소비"||mode==="공용소비"){
      const _acc=mode==="개인소비"?"개인":"공용";
      const cagg={};
      for(const t of S.yearTxns){
        if(kindOf(t.type)!=="spend"||t.account!==_acc)continue;
        cagg[t.category]=(cagg[t.category]||0)+Number(t.amount);
      }
      const crows=Object.entries(cagg).sort((a,b)=>b[1]-a[1]).slice(0,6);
      if(crows.length){
        {
          const tot=crows.reduce((a,x)=>a+x[1],0);
          if(tot>0){
            const topD=crows.slice(0,6),othD=crows.slice(6).reduce((a,x)=>a+x[1],0);
            const segs=[...topD.map(([n,v])=>({n,v,c:(CM[n]||CM["기타"]).c})),...(othD>0?[{n:"기타 등",v:othD,c:"#B8AE9C"}]:[])];
            let accD=0;const stops=segs.map(g=>{const a0=accD/tot*360,a1=(accD+g.v)/tot*360;accD+=g.v;return `${g.c} ${a0}deg ${a1}deg`;}).join(",");
            const donut=h("div",{style:{position:"relative",width:"126px",height:"126px",flexShrink:"0"}},
              h("div",{style:{width:"126px",height:"126px",borderRadius:"50%",background:`conic-gradient(${stops})`}}),
              h("div",{style:{position:"absolute",inset:"21px",background:C.w,borderRadius:"50%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}},h("div",{style:{fontSize:"9.5px",color:C.sub}},"총"),h("div",{class:"num",style:{fontSize:"13px",fontWeight:"800"}},shortNum(tot))));
            const legend=h("div",{style:{flex:"1",display:"flex",flexDirection:"column",gap:"6px",minWidth:"0"}});
            segs.forEach(g=>legend.append(h("div",{style:{display:"flex",alignItems:"center",gap:"7px",fontSize:"11.5px"}},
              h("span",{style:{width:"10px",height:"10px",borderRadius:"3px",background:g.c,flexShrink:"0"}}),
              h("span",{style:{flex:"1",color:C.ink,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},g.n),
              h("span",{class:"num",style:{color:C.sub,fontWeight:"700",flexShrink:"0"}},Math.round(g.v/tot*100)+"%"))));
            container.append(h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"16px",padding:"16px 18px"}},
              h("div",{style:{fontSize:"12.5px",fontWeight:"800",color:C.sub,marginBottom:"14px"}},`🍩 ${yr}년 ${mode} 비중`),
              h("div",{style:{display:"flex",alignItems:"center",gap:"15px"}},donut,legend)));
          }
        }
        const cSec=sec(yr+"년 "+mode+" TOP 카테고리","");
        const cmax=crows[0][1];
        crows.forEach(([n,v])=>{

          cSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"8px 4px"}},
            h("span",{style:{fontSize:"14px",width:"20px",textAlign:"center"}},c.i),
            h("div",{style:{flex:"1"}},
              h("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}},
                h("span",{style:{fontSize:"12.5px"}},n),
                h("span",{class:"num",style:{fontSize:"12.5px",fontWeight:"700"}},W(v))
              ),
              h("div",{style:{height:"6px",borderRadius:"999px",background:"#F2EEE6",overflow:"hidden"}},
                h("div",{style:{width:Math.max(5,(v/cmax)*100)+"%",height:"100%",background:c.c,borderRadius:"999px"}})
              )
            )
          ));
        });
        container.append(cSec);
      }
    }
    // 💎 올해 순자산 추이 (자산 탭·월마감에서 기록된 값)
    {
      let nh={};try{nh=JSON.parse(localStorage.getItem("nw_history")||"{}");}catch{}
      const yk=Object.keys(nh).filter(k=>k.slice(0,4)===yr).sort();
      if(yk.length>=2){
        const a=nh[yk[0]],b=nh[yk[yk.length-1]],diff=b-a;
        const nwSec=sec(yr+"년 순자산 변화",`${yk.length}개월 기록`);
        nwSec.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 2px"}},
          h("span",{style:{fontSize:"12.5px",color:C.sub}},`${Number(yk[0].slice(5,7))}월 ${W(a)} → ${Number(yk[yk.length-1].slice(5,7))}월 ${W(b)}`),
          h("span",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:diff>=0?C.brand:C.over}},`${diff>=0?"+":""}${W(diff)}`)));
        const nwBox=h("div",{style:{height:"160px",marginTop:"8px"}});const nwCv=document.createElement("canvas");nwBox.append(nwCv);nwSec.append(nwBox);
        setTimeout(()=>{if(!window.Chart)return;const ctx=nwCv.getContext("2d");const g=ctx.createLinearGradient(0,0,0,160);g.addColorStop(0,"rgba(30,110,82,.22)");g.addColorStop(1,"rgba(30,110,82,0)");
          new window.Chart(nwCv,{type:"line",data:{labels:yk.map(k=>Number(k.slice(5,7))+"월"),datasets:[{data:yk.map(k=>nh[k]),borderColor:C.brand,backgroundColor:g,borderWidth:2,fill:true,tension:.35,pointRadius:3,pointBackgroundColor:C.brand}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{label:(c)=>" "+W(c.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{font:{size:10},color:"#9b958a"}},y:{display:false}}}});},60);
        nwSec.append(h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"4px",lineHeight:"1.6"}},diff>=0?"올해 자산이 불어나고 있어요 👍":"올해 자산이 줄었어요. 자산 탭에서 원인을 확인해보세요."));
        container.append(nwSec);
      }
    }
  };
  draw();
  return[container];
}

// ── 거래 검색 ──
function showSearch(opt){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"50"}});
  const sh=h("div",{style:{width:"100%",maxWidth:"520px",background:C.w,borderRadius:"20px",padding:"18px 20px 26px",maxHeight:"88vh",overflowY:"auto"}});
  const resultEl=h("div",{style:{marginTop:"12px"}});
  let timer=null;
  const dStyle={width:"100%",border:`1px solid ${C.line}`,borderRadius:"10px",padding:"10px 11px",fontSize:"13.5px",background:C.w,outline:"none"};

  const fromEl=h("input",{type:"date",value:opt?.from||"",style:dStyle});
  const toEl=h("input",{type:"date",value:opt?.to||"",style:dStyle});
  const minEl=h("input",{type:"number",inputmode:"numeric",placeholder:"최소 금액",style:{...dStyle}});
  const maxEl=h("input",{type:"number",inputmode:"numeric",placeholder:"최대 금액",style:{...dStyle}});
  let sortMode="date";
  const sortBtn=h("button",{style:{flexShrink:"0",fontSize:"12px",fontWeight:"700",padding:"9px 11px",borderRadius:"10px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer",whiteSpace:"nowrap"},onclick:()=>{sortMode=sortMode==="date"?"amount":"date";sortBtn.textContent=sortMode==="date"?"↕ 최신순":"↕ 금액순";run();}},"↕ 최신순");
  let kindF="all";
  const kindBtn=h("button",{style:{flexShrink:"0",fontSize:"12px",fontWeight:"700",padding:"9px 11px",borderRadius:"10px",border:`1px solid ${C.line}`,background:C.w,color:C.sub,cursor:"pointer",whiteSpace:"nowrap"},onclick:()=>{kindF=kindF==="all"?"spend":kindF==="spend"?"income":"all";kindBtn.textContent={all:"전체",spend:"지출만",income:"수입만"}[kindF];kindBtn.style.background=kindF==="all"?C.w:"#EEF6F1";run();}},"전체");

  const drawRow=t=>{
    const c=CM[t.category]||CM["기타"],k=kindOf(t.type);
    const cl=isInternalTransfer(t)?C.faint:k==="income"||k==="reduce"?C.brand:C.ink;
    const sg=isInternalTransfer(t)?"⇄ ":k==="income"||k==="reduce"?"+":k==="spend"?"−":"";
    resultEl.append(h("div",{
      style:{display:"flex",alignItems:"center",gap:"11px",padding:"10px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .12s",borderRadius:"4px"},
      onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
      onmouseleave:e=>{e.currentTarget.style.background="transparent";},
      onclick:()=>showEditTxn(t,run)
    },
      h("div",{style:{width:"32px",height:"32px",borderRadius:"9px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"14px",flexShrink:"0"}},c.i),
      h("div",{style:{flex:"1",minWidth:"0"}},
        h("div",{style:{fontSize:"13.5px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)+(t.installment_total?` (${t.installment_no}/${t.installment_total})`:"")),
        h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(2)} · ${t.account} · ${t.category}`)
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
        h("div",{class:"num",style:{fontSize:"13.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},`${sg}${W(t.amount).slice(1)}`),
        h("span",{style:{fontSize:"12px",color:C.faint}},"›")
      )
    ));
  };

  const run=async()=>{
    const q=inp.value.trim(),f=fromEl.value,t=toEl.value;
    const mn=Number(minEl.value)||null,mx=Number(maxEl.value)||null;
    if(q.length<2&&!f&&!t&&mn==null&&mx==null){resultEl.innerHTML="";resultEl.append(empty("검색어(2자 이상)·기간·금액 중 하나를 입력하세요."));return;}
    resultEl.innerHTML='<div class="center"><div class="spin"></div></div>';
    let qb=sb.from("transactions").select("*");
    if(q.length>=2)qb=qb.or(`merchant.ilike.%${q}%,memo.ilike.%${q}%,category.ilike.%${q}%`);
    if(f)qb=qb.gte("date",f);
    if(t)qb=qb.lte("date",t);
    if(mn!=null)qb=qb.gte("amount",mn);
    if(mx!=null)qb=qb.lte("amount",mx);
    const{data}=await qb.order("date",{ascending:false}).limit(1000);
    let results=data||[];
    if(kindF==="spend")results=results.filter(x=>kindOf(x.type)==="spend");
    else if(kindF==="income")results=results.filter(x=>["income","reduce"].includes(kindOf(x.type)));
    if(sortMode==="amount")results=results.slice().sort((a,b)=>Number(b.amount||0)-Number(a.amount||0));
    S._searchResults=results;
    resultEl.innerHTML="";
    if(!results.length){resultEl.append(empty("조건에 맞는 거래가 없어요."));return;}
    const spend=results.filter(x=>kindOf(x.type)==="spend").reduce((a,x)=>a+Number(x.amount||0),0);
    const income=results.filter(x=>["income","reduce"].includes(kindOf(x.type))).reduce((a,x)=>a+Number(x.amount||0),0);
    resultEl.append(h("div",{style:{background:C.soft,borderRadius:"12px",padding:"11px 14px",marginBottom:"10px"}},

        h("span",{style:{fontSize:"13px",fontWeight:"800"}},`${results.length}건`),
        h("div",{style:{display:"flex",gap:"12px"}},
          spend>0?h("span",{style:{fontSize:"12px",color:C.ink}},`지출 ${W(spend)}`):"",
          income>0?h("span",{style:{fontSize:"12px",color:C.brand}},`수입 ${W(income)}`):""))));
    results.forEach(drawRow);
  };

  const _t=new Date(),_ts=td();
  const _fom=`${ym(_ts)}-01`;
  const _lm=new Date(_t.getFullYear(),_t.getMonth()-1,1),_lmEnd=new Date(_t.getFullYear(),_t.getMonth(),0);
  const _3m=new Date(_t.getFullYear(),_t.getMonth()-2,1);
  const fmt=d=>dstr(d);
  const setR=(f,t)=>{fromEl.value=f;toEl.value=t;run();};
  const chip=(lbl,fn)=>h("button",{style:{fontSize:"12px",fontWeight:"600",padding:"7px 12px",borderRadius:"999px",border:`1px solid ${C.line}`,background:C.w,color:C.ink,cursor:"pointer",whiteSpace:"nowrap",flexShrink:"0"},onclick:fn},lbl);
  const chipRow=h("div",{style:{display:"flex",gap:"7px",overflowX:"auto",paddingBottom:"2px",marginTop:"10px"}},
    chip("이번 달",()=>setR(_fom,_ts)),
    chip("지난달",()=>setR(fmt(_lm),fmt(_lmEnd))),
    chip("최근 3개월",()=>setR(fmt(_3m),_ts)),
    chip("올해",()=>setR(`${_t.getFullYear()}-01-01`,_ts)),
    chip("전체",()=>{fromEl.value="";toEl.value="";run();}));

  inp.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,320);};
  [minEl,maxEl].forEach(el=>el.oninput=()=>{clearTimeout(timer);timer=setTimeout(run,420);});
  [fromEl,toEl].forEach(el=>el.onchange=()=>run());
  fromEl.onchange=run;toEl.onchange=run;

  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"}},
      h("span",{style:{fontSize:"17px",fontWeight:"800"}},"🔍 거래 검색"),
      h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")
    ),
    inp,
    chipRow,
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:"8px",alignItems:"center",marginTop:"10px"}},
      fromEl,h("span",{style:{fontSize:"12px",color:C.faint}},"~"),toEl),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr auto 1fr",gap:"8px",alignItems:"center",marginTop:"8px"}},
      minEl,h("span",{style:{fontSize:"12px",color:C.faint}},"~"),maxEl),
    h("div",{style:{display:"flex",gap:"7px",marginTop:"9px",flexWrap:"wrap"}},kindBtn,sortBtn,
      h("button",{style:{marginLeft:"auto",fontSize:"12px",fontWeight:"800",padding:"9px 13px",borderRadius:"10px",border:`1px solid ${C.brand}`,background:"#EEF6F1",color:C.brand,cursor:"pointer",whiteSpace:"nowrap"},onclick:()=>{
        const rows=S._searchResults||[];
        if(!rows.length){toast("내보낼 검색 결과가 없어요",false);return;}
        const esc=v=>{const x=(v==null?"":String(v)).replace(/"/g,'""');return /[",\n]/.test(x)?`"${x}"`:x;};
        const head=["날짜","유형","분류","가맹점/메모","결제수단","계좌","금액"];
        const body=rows.map(t=>[t.date||"",t.type||"",t.category||"",(t.merchant||t.memo||""),t.payment_method||"",t.account||"",t.amount||0].map(esc).join(","));
        const csv="\uFEFF"+[head.join(","),...body].join("\r\n");
        const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob);const a=document.createElement("a");
        a.href=url;a.download=`가계부_검색_${td()}.csv`;a.click();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        toast(`📤 ${rows.length}건 CSV로 내보냈어요`);
      }},"📤 CSV")),
    h("div",{style:{fontSize:"11.5px",color:C.faint,marginTop:"8px",paddingLeft:"2px"}},"검색어·기간을 조합할 수 있어요. 기간만 골라도 그 기간 거래가 다 나와요."),
    resultEl
  );
  ov.append(sh);document.body.append(ov);
  if(opt&&(opt.from||opt.to))run(); else setTimeout(()=>inp.focus(),100);
}

// fixed_costs.meta (jsonb) 활용 — 설정을 DB에 저장(기기/사람 공유), 없으면 localStorage에서 자동 이관
function fcMeta(fc){let m=fc&&fc.meta;if(typeof m==="string"){try{m=JSON.parse(m);}catch{m=null;}}return m&&typeof m==="object"?m:{};}
async function setFcMeta(fc,patch){
  const m=Object.assign({},fcMeta(fc),patch);
  fc.meta=m;
  try{const o=(S.fixedCosts||[]).find(x=>x.id===fc.id);if(o)o.meta=m;}catch{}
  if(fc.id){try{await sb.from("fixed_costs").update({meta:m}).eq("id",fc.id);}catch(e){dlog("[meta저장실패]",e);}}
}
const isVariableFc=(fc)=>{const m=fcMeta(fc);if(typeof m.is_variable==="boolean")return m.is_variable;try{const v=localStorage.getItem("fcvar:"+(fc.id||fc.name));if(v==="1")return true;if(v==="0")return false;}catch{}return /(변동|관리비|월별|가변)/.test((fc.memo||"")+(fc.name||""));};
const setVariableFc=(fc,on)=>setFcMeta(fc,{is_variable:!!on});
const isSubscriptionFc=(fc)=>{const m=fcMeta(fc);if(typeof m.is_subscription==="boolean")return m.is_subscription;try{const v=localStorage.getItem("fcsub:"+(fc.id||fc.name));if(v==="1")return true;if(v==="0")return false;}catch{}return /(구독|멤버십|멤버쉽|프라임|와우|밀리|flo|뮤직|music|membership|넷플릭스|netflix|유튜브|youtube|디즈니|disney|왓챠|티빙|웨이브|spotify)/i.test((fc.name||"")+(fc.memo||""));};
const setSubscriptionFc=(fc,on)=>setFcMeta(fc,{is_subscription:!!on});
const getFcShare=(fc)=>{if(fc.account!=="공용")return 100;const m=fcMeta(fc);if(m.share_ratio!=null)return Math.max(0,Math.min(100,Number(m.share_ratio)));try{const v=localStorage.getItem("fcshare:"+(fc.id||fc.name));if(v!=null&&v!=="")return Math.max(0,Math.min(100,Number(v)));}catch{}return 50;};
const setFcShare=(fc,p)=>setFcMeta(fc,{share_ratio:Math.max(0,Math.min(100,Math.round(p)))});
const myShareAmount=(fc)=>Number(fc.amount||0)*getFcShare(fc)/100;
const fcTol=(fc)=>isVariableFc(fc)?0.6:0.18;
const FREQ_MONTHS={"월":1,"분기":3,"반기":6,"연":12};
const getFcFreq=(fc)=>{const m=fcMeta(fc);return m.frequency||"월";};
const setFcFreq=(fc,v)=>setFcMeta(fc,{frequency:v});
const fcMonthlyEquiv=(fc)=>Number(fc.amount||0)/(FREQ_MONTHS[getFcFreq(fc)]||1);
const normKey=m=>(m||"").toLowerCase().replace(/\s+/g,"").replace(/[0-9]{2,}.*$/,"");
function detectRecurring(txns){
  const dismissed=(()=>{try{return JSON.parse(localStorage.getItem("fcdiscover_dismiss")||"[]");}catch{return[];}})();
  const reg=[...(S.fixedCosts||[]),...(S.fixedInactive||[])];
  const regKeys=reg.map(f=>normKey(f.name)).filter(Boolean);
  const regMatch=reg.map(f=>normKey(f.match_name||"")).filter(Boolean);
  const groups={};
  txns.forEach(t=>{
    if(kindOf(t.type)!=="spend"||t.type==="소비(할부)")return;
    const key=normKey(t.merchant);
    if(!key||key.length<2)return;
    const g=groups[key]||(groups[key]={list:[],names:{}});
    g.list.push(t);
    const dn=(t.merchant||"").trim();if(dn)g.names[dn]=(g.names[dn]||0)+1;
  });
  const out=[];
  Object.entries(groups).forEach(([key,g])=>{
    const list=g.list;
    const months=[...new Set(list.map(t=>(t.date||"").slice(0,7)))];
    if(months.length<2)return;
    if(list.length/months.length>3)return;
    const amts=list.map(t=>Number(t.amount)||0).sort((a,b)=>a-b);
    const med=amts[Math.floor(amts.length/2)];
    if(med<1000)return;
    const near=amts.filter(a=>Math.abs(a-med)/med<=0.35);
    if(near.length<2)return;
    if(dismissed.includes(key))return;
    if(regKeys.some(rk=>rk&&(rk.includes(key)||key.includes(rk))))return;
    if(regMatch.some(rk=>rk&&(key.includes(rk)||rk.includes(key))))return;
    const typical=Math.round(near.reduce((s,a)=>s+a,0)/near.length);
    const last=list.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""))[0];
    const dispName=Object.entries(g.names).sort((a,b)=>b[1]-a[1])[0]?.[0]||key;
    out.push({key,name:dispName,amount:typical,category:last.category||"기타",account:last.account||"개인",payment_method:last.payment_method||null,months:months.length});
  });
  out.sort((a,b)=>b.months-a.months||b.amount-a.amount);
  return out.slice(0,8);
}
function fcDueInfo(fc){
  const bd=Number(fc.billing_day);if(!bd)return null;
  const[Y,M]=S.curYm.split("-").map(Number);
  const lastDay=new Date(Y,M,0).getDate();const day=Math.min(bd,lastDay);
  const dueStr=`${Y}-${String(M).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  const isThisMonth=S.curYm===ym(td());
  let dday=null;if(isThisMonth){dday=Math.round((new Date(dueStr)-new Date(td()))/86400000);}
  return{dueStr,day,dday,isThisMonth};
}
function fcStatus(fc){
  if(fc.paid)return "paid";
  const now=ym(td()),viewing=S.curYm;
  if(viewing>now)return "scheduled";
  const due=fcDueInfo(fc);
  if(due&&due.isThisMonth){
    if(due.dday>0)return "scheduled";
    if(due.dday===0)return "today";
    return "check";
  }
  return "check";
}

const getFcSort=()=>{try{return localStorage.getItem("fcsort")||"due";}catch{return"due";}};
const setFcSort=(v)=>{try{localStorage.setItem("fcsort",v);}catch{}};
function sortFcList(list){
  const s=getFcSort(),arr=list.slice();

  else if(s==="name")arr.sort((a,b)=>(a.name||"").localeCompare(b.name||""));

const isIncomeType=(t)=>["수입","정산환급","환불/취소","공용입금"].includes(t);

function getFcOverride(fc,ym){const m=fcMeta(fc);if(m.payments&&m.payments[ym])return m.payments[ym];try{const v=localStorage.getItem(FCKEY(fc,ym));if(v)return JSON.parse(v);}catch{}return null;}
function setFcOverride(fc,ym,o){const m=fcMeta(fc);const payments=Object.assign({},m.payments||{});if(o)payments[ym]=o;else delete payments[ym];return setFcMeta(fc,{payments});}

// 거래 1건 → 고정비 1개 1:1 배정 (수동 override 우선)
function assignFixedPayments(fcs,txns,ym){
  const used=new Set();
  const out=fcs.map(fc=>({fc,paid:false,tx:null,manual:false}));
  // 1) 수동 조정 먼저
  out.forEach(o=>{
    const ov=getFcOverride(o.fc,ym);
    if(!ov)return;
    if(ov.status==="unpaid"){o.paid=false;o.manual=true;o._done=true;}
    else if(ov.status==="paid"){o.paid=true;o.manual=true;o._done=true;
      if(ov.txId){const tx=txns.find(t=>t.id===ov.txId);if(tx){o.tx=tx;used.add(tx.id);}}}
  });
  // 2) 자동 매칭 (남은 것, 금액 가장 근접한 거래 1건)
  out.forEach(o=>{
    if(o._done)return;
    const fa=Number(o.fc.amount)||0;if(fa<=0)return;
    const tol=fcTol(o.fc);let best=null,bd=Infinity;
    txns.forEach(t=>{
      if(used.has(t.id))return;
      if(isIncomeType(t.type))return;
      if(t.category!==o.fc.category)return;
      // account 일치가 기본, 단 개인 고정비가 카드로 자동결제된 경우도 허용
      const acctOk=t.account===o.fc.account||(o.fc.account==="개인"&&t.account==="개인");
      if(!acctOk)return;
      const a=Number(t.amount)||0,d=fa>0?Math.abs(a-fa)/fa:9;
      if(d<=tol&&d<bd){bd=d;best=t;}
    });
    if(best){o.paid=true;o.tx=best;used.add(best.id);}
  });
  out.forEach(o=>{delete o._done;});
  return out;
}

  // ── 차트용 OHLC 배열 추출 (프록시 응답 키가 뭐든 방어적으로) ──
function extractOHLC(d,closeArr){
  if(!d)return null;
  const pick=(...names)=>{for(const n of names){const v=d[n];if(Array.isArray(v)&&v.length)return v;}return null;};
  const o=pick("opens","open_arr","openHistory","o");
  const hi=pick("highs","high_arr","highHistory","h");
  const lo=pick("lows","low_arr","lowHistory","l");
  const c=pick("closes","close_arr","closeHistory","c")||closeArr;
  if(o&&hi&&lo&&c)return{o,h:hi,l:lo,c};
  const arr=Array.isArray(d.ohlc)?d.ohlc:Array.isArray(d.candles)?d.candles:Array.isArray(d.quotes)?d.quotes:null;
  if(arr&&arr.length){
    const O=[],H=[],L=[],Cc=[];
    for(const it of arr){
      if(Array.isArray(it)){O.push(it[0]);H.push(it[1]);L.push(it[2]);Cc.push(it[3]);}
      else{O.push(it.o??it.open);H.push(it.h??it.high);L.push(it.l??it.low);Cc.push(it.c??it.close);}
    }
    return{o:O,h:H,l:L,c:Cc};
  }
  return null;
}

// 평가액 정상화: eval_value_krw가 usd×fx와 10배 이상 어긋나면 검산값 사용 (천배 버그 방어)
function usdLooksKrw(x){
  // 달러평가액 칸에 원화가 잘못 저장됐는지 감지: 주당 달러가 비상식적으로 크면 의심
  const usd=Number(x.eval_value_usd)||0,qty=Number(x.quantity)||0,avg=Number(x.avg_price)||0;
  if(usd<=0||qty<=0)return false;
  const ps=usd/qty; // 주당 "달러"
  return ps>10000||(avg>0&&ps>avg*20&&ps>1000);
}
function safeEvalKrw(x){
  const krw=Number(x.eval_value_krw)||0;
  const usd=Number(x.eval_value_usd)||0;
  const fx=Number(x.fx_rate)||1380;
  if(usdLooksKrw(x))return Math.round(usd); // usd칸이 사실 원화 → 그 값이 진짜 평가액
  if(usd>0){
    const calc=usd*fx;
    if(calc>0&&(krw>calc*10||krw<calc/10))return Math.round(calc); // 어긋나면 검산값
  }
  return krw;
}

// ══════════ 월간 수익률 달력 ══════════
function buildReturnCalendar(){
  const snaps=(S.allSnaps||[]).slice().sort((a,b)=>(a.snapshot_date||"").localeCompare(b.snapshot_date||""));
  if(snaps.length<1)return null;
  const[yr,mo]=S.curYm.split("-").map(Number);
  const byDate={};
  snaps.forEach((r,i)=>{
    const prev=i>0?snaps[i-1]:null;
    let pct=null;
    if(prev&&Number(prev.total_value_krw)>0)pct=(Number(r.total_value_krw)-Number(prev.total_value_krw))/Number(prev.total_value_krw)*100;
    else if(r.return_rate_krw!=null)pct=Number(r.return_rate_krw);
    byDate[r.snapshot_date]={pct,val:Number(r.total_value_krw)||0};
  });
  const monthDays=Object.keys(byDate).filter(d=>d.slice(0,7)===S.curYm);
  if(!monthDays.length)return null;
  const sec_=sec("📅 월간 수익률 달력",`${monthDays.length}일 기록 · 전일比`);
  const firstDay=new Date(yr,mo-1,1).getDay();
  const lastDate=new Date(yr,mo,0).getDate();
  const cal=h("div",{style:{background:C.w}});
  const hdr=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"4px"}});
  ["월","화","수","목","금","토","일"].forEach((d,i)=>hdr.append(h("div",{style:{textAlign:"center",fontSize:"10.5px",color:i>=5?"#B23A5C":C.faint,fontWeight:"700"}},d)));
  const grid=h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}});
  const offset=(firstDay===0?6:firstDay-1);
  for(let i=0;i<offset;i++)grid.append(h("div",{}));
  for(let d=1;d<=lastDate;d++){
    const ds=`${yr}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const data=byDate[ds];
    let bg="transparent",col=C.faint,pctTxt="";
    if(data&&data.pct!=null){
      const p=data.pct,a=Math.min(.30,Math.abs(p)/15+.07);
      bg=p>=0?`rgba(30,110,82,${a})`:`rgba(194,85,61,${a})`;
      col=p>=0?C.brand:C.over;pctTxt=(p>=0?"+":"")+p.toFixed(1);
    }
    grid.append(h("div",{style:{minHeight:"42px",borderRadius:"8px",background:bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"1px",padding:"2px"}},
      h("div",{style:{fontSize:"11px",fontWeight:"600",color:data?C.ink:C.faint}},d),
      pctTxt?h("div",{class:"num",style:{fontSize:"9px",fontWeight:"700",color:col}},pctTxt):""
    ));
  }
  cal.append(hdr,grid);sec_.append(cal);
  return sec_;
}

// 공통 드래그(부드러운 추적 + 슬라이드) — axis:"y"(카드) | "xy"(탭)
function attachDrag(el,opts){
  if(el._rbound)return;el._rbound=true;
  const{scope,axis,onDrop,inEdit}=opts;
  let pressTimer=null,sx=0,sy=0,dragging=false;
  const onDown=(e)=>{
    if(e.target&&e.target.closest&&e.target.closest(".rctl,.rsz"))return;
    const pt=e.touches?e.touches[0]:e;sx=pt.clientX;sy=pt.clientY;
    if(REORDER.editing&&inEdit()){beginDrag(e);return;}
  };
  const onMoveWait=(e)=>{if(pressTimer){const pt=e.touches?e.touches[0]:e;if(Math.abs(pt.clientX-sx)>10||Math.abs(pt.clientY-sy)>10){clearTimeout(pressTimer);pressTimer=null;}}};
  const onUpWait=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
  el.addEventListener("touchstart",onDown,{passive:true});
  el.addEventListener("mousedown",onDown);
  el.addEventListener("touchmove",onMoveWait,{passive:true});
  el.addEventListener("mousemove",onMoveWait);
  el.addEventListener("touchend",onUpWait);el.addEventListener("mouseup",onUpWait);
  const cls=axis==="xy"?"rtab":"rcard";
  const sibsOf=(ct)=>[...ct.children].filter(c=>c.classList&&c.classList.contains(cls)&&!c._ph);
  function beginDrag(e){
    if(dragging)return;
    const ct=el.parentNode;if(!ct)return;dragging=true;
    const pt0=e.touches?e.touches[0]:e;
    const rect=el.getBoundingClientRect();
    const grabX=pt0.clientX-rect.left, grabY=pt0.clientY-rect.top;
    const cs=getComputedStyle(el);
    // 빈자리 플레이스홀더
    const ph=document.createElement("div");ph._ph=true;
    ph.style.width=rect.width+"px";ph.style.height=rect.height+"px";
    ph.style.margin=cs.margin;ph.style.boxSizing="border-box";ph.style.flex="0 0 auto";
    ph.style.borderRadius="16px";ph.style.background="rgba(120,110,95,.07)";
    ph.style.gridColumn=el.style.gridColumn||"span 12";
    ct.insertBefore(ph,el);
    // 잡은 카드를 body로 띄움(레이아웃 분리)
    document.body.appendChild(el);
    el.classList.add("rdrag");
    Object.assign(el.style,{position:"fixed",zIndex:"80",margin:"0",width:rect.width+"px",height:rect.height+"px",left:rect.left+"px",top:rect.top+"px",transition:"transform .12s ease,box-shadow .18s ease",transform:axis==="xy"?"scale(1.06)":"scale(1.03)",pointerEvents:"none"});
    const move=(ev)=>{
      if(ev.cancelable)ev.preventDefault();
      const p=ev.touches?ev.touches[0]:ev,px=p.clientX,py=p.clientY;
      el.style.left=(px-grabX)+"px";el.style.top=(py-grabY)+"px";
      const sibs=sibsOf(ct);
      let target=null;
      for(const s of sibs){
        const r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
        const before=axis==="xy"?(py<r.top?true:(py>r.bottom?false:px<cx)):(py<cy);
        if(before){target=s;break;}
      }
      if(target){if(ph.nextElementSibling!==target)flipMove(sibs,()=>ct.insertBefore(ph,target));}
      else{if(ct.lastElementChild!==ph)flipMove(sibs,()=>ct.appendChild(ph));}
    };
    const up=()=>{
      document.removeEventListener("touchmove",move);document.removeEventListener("mousemove",move);
      document.removeEventListener("touchend",up);document.removeEventListener("mouseup",up);
      const slot=ph.getBoundingClientRect();
      el.style.transition="left .2s cubic-bezier(.2,.8,.2,1),top .2s cubic-bezier(.2,.8,.2,1),transform .2s ease,box-shadow .2s ease";
      el.style.left=slot.left+"px";el.style.top=slot.top+"px";el.style.transform="scale(1)";
      let done=false;
      const finish=()=>{
        if(done)return;done=true;
        el.removeEventListener("transitionend",finish);
        ct.insertBefore(el,ph);ph.remove();
        el.classList.remove("rdrag");
        ["position","zIndex","margin","width","height","left","top","transform","transition","pointerEvents"].forEach(k=>el.style[k]="");
        el.style.position="relative";
        dragging=false;onDrop();
      };
      el.addEventListener("transitionend",finish);
      setTimeout(finish,260);
    };
    document.addEventListener("touchmove",move,{passive:false});
    document.addEventListener("mousemove",move);
    document.addEventListener("touchend",up);document.addEventListener("mouseup",up);
  }
}
// FLIP: DOM 변경 전후 좌표 비교 → 이동량만큼 거꾸로 걸었다가 0으로 풀어 슬라이드
function flipMove(nodes,mutate){
  const first=new Map();
  nodes.forEach(n=>first.set(n,n.getBoundingClientRect()));
  mutate();
  nodes.forEach(n=>{
    const a=first.get(n);if(!a)return;
    const b=n.getBoundingClientRect();
    const dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy){
      n.style.transition="none";
      n.style.transform=`translate(${dx}px,${dy}px)`;
      requestAnimationFrame(()=>{n.style.transition="transform .22s cubic-bezier(.2,.8,.2,1)";n.style.transform="";});
    }
  });
}

function applySpan(el,sp){el.style.gridColumn="span "+sp;["sp4","sp6","sp8","sp12"].forEach(c=>el.classList.remove(c));el.classList.add("sp"+sp);}
function currentSpan(el){for(const c of["sp4","sp6","sp8","sp12"])if(el.classList.contains(c))return +c.slice(2);return 12;}
function attachResize(el,tab,key){
  const handle=h("div",{class:"rsz",title:"크기 조절"});
  const snapOf=(clientX)=>{
    const ct=el.parentNode;if(!ct)return currentSpan(el);
    const col=ct.getBoundingClientRect().width/12;
    const left=el.getBoundingClientRect().left;
    let n=Math.round((clientX-left)/col);n=Math.max(3,Math.min(12,n));
    const snaps=[4,6,8,12];let best=4,bd=99;snaps.forEach(sv=>{const d=Math.abs(sv-n);if(d<bd){bd=d;best=sv;}});return best;
  };
  const down=(e)=>{
    if(!(REORDER.editing&&REORDER.scope==="card"))return;
    if(e.cancelable)e.preventDefault();e.stopPropagation();
    el.classList.add("rresizing");
    const move=(ev)=>{if(ev.cancelable)ev.preventDefault();const p=ev.touches?ev.touches[0]:ev;applySpan(el,snapOf(p.clientX));};
    const up=()=>{el.classList.remove("rresizing");
      document.removeEventListener("touchmove",move);document.removeEventListener("mousemove",move);
      document.removeEventListener("touchend",up);document.removeEventListener("mouseup",up);
      setCardStateFor(tab,key,{sp:currentSpan(el)});try{window.dispatchEvent(new Event("resize"));}catch{}};
    document.addEventListener("touchmove",move,{passive:false});document.addEventListener("mousemove",move);
    document.addEventListener("touchend",up);document.addEventListener("mouseup",up);
  };
  handle.addEventListener("mousedown",down);handle.addEventListener("touchstart",down,{passive:false});
  el.appendChild(handle);
}
function addCardControls(el,tab,key){
  const mk=(txt,title,fn)=>h("button",{title,onclick:(ev)=>{ev.stopPropagation();ev.preventDefault();fn(ev.currentTarget);}},txt);
  const movable=allMovableCards().some(c=>c.key===key);

    movable?mk("📤","다른 탭으로 이동",()=>showMoveCardSheet(key,tab)):"",

function allMovableCards(){
  const reg=cardRegistry();const out=[];
  Object.entries(reg).forEach(([tab,arr])=>arr.forEach(([label,build])=>{
    out.push({key:label.replace(/\s+/g,"").slice(0,10),label,build,homeTab:tab});
  }));

const getMovedInto=(tab)=>{try{return JSON.parse(localStorage.getItem("cardmoved:"+tab)||"[]");}catch{return[];}};

// 카드를 targetTab으로 이동: 모든 탭의 moved목록에서 제거 후 target에 추가 (원홈이면 제거만)
function moveCardToTab(cardKey,targetTab){
  const info=allMovableCards().find(c=>c.key===cardKey);
  ["home","spend","invest"].forEach(t=>{
    let arr=getMovedInto(t).filter(k=>k!==cardKey);setMovedInto(t,arr);
  });
  if(info&&targetTab!==info.homeTab){
    const arr=getMovedInto(targetTab);if(!arr.includes(cardKey))arr.push(cardKey);setMovedInto(targetTab,arr);
    // 원래 탭에선 숨김 처리
    setCardStateFor(info.homeTab,cardKey,{hid:1});
  }else if(info&&targetTab===info.homeTab){
    // 원홈 복귀 → 숨김 해제
    const st=getCardState(info.homeTab);if(st[cardKey])st[cardKey].hid=0;
    try{localStorage.setItem("cardstate:"+info.homeTab,JSON.stringify(st));}catch{}
  }
}

function buildMovedCards(tab){
  const keys=getMovedInto(tab);if(!keys.length)return [];
  const all=allMovableCards();
  return keys.map(k=>{const info=all.find(c=>c.key===k);if(!info)return null;try{const el=info.build();return el||null;}catch(e){dlog("[이사카드 실패]",k,e);return null;}}).filter(Boolean);

function reorderCards(tab,cards){
  const list=(cards||[]).filter(Boolean);
  if(list.length<2)return list;
  ensureReorderStyle();
  const st=getCardState(tab);
  const visible=[];
  list.forEach((el,i)=>{
    const key=autoKey(el);el.dataset.rkey=key;el.classList.add("rcard");
    if(!el.style.position)el.style.position="relative";
    const cs=st[key]||{};
    applySpan(el,cs.sp||(cs.sz?6:12));
    if(cs.col)el.classList.add("collapsed");
    addCardControls(el,tab,key);
    attachResize(el,tab,key);
    attachDrag(el,{scope:"card",axis:"y",inEdit:()=>REORDER.editing,onDrop:()=>persistOrder(tab)});
    if(!cs.hid)visible.push({el,key,i});
  });
  const saved=getCardOrder(tab);
  const idxOf=k=>{const i=saved.indexOf(k);return i<0?9999:i;};
  visible.sort((a,b)=>(idxOf(a.key)-idxOf(b.key))||(a.i-b.i));
  const out=visible.map(o=>o.el);
  if(out[0])requestAnimationFrame(()=>{const ct=out[0].parentNode;if(ct){ct.classList.add("cardgrid");ensureHiddenChip(ct,tab);}});
  return out;
}

}

function loadExtScript(src){return new Promise((res,rej)=>{const ex=document.querySelector(`script[data-ext="${src}"]`);if(ex){if(ex.dataset.loaded)return res();ex.addEventListener("load",res);ex.addEventListener("error",rej);return;}const s=document.createElement("script");s.src=src;s.dataset.ext=src;s.onload=()=>{s.dataset.loaded="1";res();};s.onerror=()=>rej(new Error("라이브러리 로드 실패 (인터넷 연결 확인)"));document.head.append(s);});}
function impNormDate(v){ // "2026.7.5"·"07/05"·엑셀 시리얼 → "YYYY-MM-DD" (로컬 기준)
  if(v==null||v==="")return null;
  if(typeof v==="number"&&isFinite(v)){ // 엑셀 시리얼 날짜 (1900 체계)
    if(v<20000||v>60000)return null;
    const d=new Date(Math.round((v-25569)*86400000));
    return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
  }
  let s=String(v).trim().replace(/[년월./]/g,"-").replace(/일/g,"").replace(/\s+/g,"").replace(/-+/g,"-").replace(/-$/,"");
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
  m=s.match(/^(\d{1,2})-(\d{1,2})$/); // 연도 없음 → 올해로, 미래 날짜면 작년으로
  if(m){const y=Number(td().slice(0,4));let out=y+"-"+m[1].padStart(2,"0")+"-"+m[2].padStart(2,"0");if(out>td())out=(y-1)+out.slice(4);return out;}
  return null;
}

  const sh=h("div",{style:{width:"100%",maxWidth:"720px",background:C.w,borderRadius:"20px",padding:"18px 20px 26px",maxHeight:"88vh",overflowY:"auto"}});
  let importData=[];
  const tableEl=h("div");
  const countEl=h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"10px",display:"none"}});
  const saveBtn=h("button",{style:{width:"100%",background:C.brand,color:C.w,fontSize:"15px",fontWeight:"700",padding:"14px",borderRadius:"13px",border:"none",cursor:"pointer",marginTop:"12px",display:"none"}},"저장하기");
  const drawTable=()=>{
    tableEl.innerHTML="";
    if(!importData.length)return;
    countEl.style.display="";saveBtn.style.display="";
    const nr_count=importData.filter(r=>r.needs_review||r.confidence==="low").length;
    countEl.textContent=`${importData.length}건 불러옴${nr_count?` · ⚠️ ${nr_count}건 확인 필요`:""}`;
    saveBtn.textContent=`${importData.length}건 전체 저장하기`;
    const legend=h("div",{style:{display:"flex",gap:"10px",flexWrap:"wrap",marginBottom:"10px"}});
    [["spend","소비"],["income","수입"],["save","투자"],["reduce","환급"],["flow","이체"]].forEach(([k,lbl])=>{const kc=KTYPE[k];legend.append(h("div",{style:{display:"flex",alignItems:"center",gap:"4px",fontSize:"11.5px",color:kc.color,fontWeight:"600"}},h("div",{style:{width:"10px",height:"10px",borderRadius:"2px",background:kc.color,opacity:".7"}}),lbl));});
    tableEl.append(legend);
    const grid=h("div",{style:{display:"flex",flexDirection:"column",gap:"6px"}});
    importData.forEach((row,i)=>{
      const nr=row.needs_review||row.confidence==="low";
      const k=kindOf(row.type||"소비(일시불)");
      const kc=KTYPE[k]||KTYPE.spend;
      const catSel=h("select",{style:{border:`1px solid ${nr?C.warn:C.line}`,borderRadius:"8px",padding:"5px 6px",fontSize:"11.5px",background:C.w,color:C.ink,minWidth:"0",maxWidth:"130px"}});
      CATS.forEach(ct=>{const o=h("option",{value:ct.n},ct.i+" "+ct.n);if(ct.n===(row.category||"기타"))o.selected=true;catSel.append(o);});
      catSel.onchange=()=>{importData[i].category=catSel.value;};
      const accSel=h("select",{style:{border:`1px solid ${C.line}`,borderRadius:"8px",padding:"5px 6px",fontSize:"11.5px",background:C.w,color:C.ink,maxWidth:"60px"}});
      ["개인","공용"].forEach(a=>{const o=h("option",{value:a},a);if(a===(row.account||"개인"))o.selected=true;accSel.append(o);});
      accSel.onchange=()=>{importData[i].account=accSel.value;};
      const db=h("button",{style:{color:C.faint,fontSize:"14px",padding:"4px",flexShrink:"0"},onclick:()=>{importData.splice(i,1);drawTable();}},"✕");
      const amtColor=k==="income"?C.brand:k==="save"?"#4169B1":k==="reduce"?C.warn:C.ink;
      const badge=h("select",{title:"유형 변경",style:{fontSize:"10.5px",fontWeight:"700",padding:"2px 2px",borderRadius:"5px",border:"none",background:kc.bg,color:kc.color,maxWidth:"78px",cursor:"pointer"}});
      TYPES.forEach(tp=>{const o=h("option",{value:tp},tp);if(tp===(row.type||"소비(일시불)"))o.selected=true;badge.append(o);});
      badge.onchange=()=>{importData[i].type=badge.value;drawTable();};
      grid.append(h("div",{style:{display:"grid",gridTemplateColumns:"46px 80px 74px 1fr 116px 52px 18px",gap:"6px",alignItems:"center",padding:"9px 12px 9px 14px",borderRadius:"10px",background:nr?"#FFFBEE":kc.bg,border:`1px solid ${nr?C.warn+"88":C.line}`,borderLeft:`3px solid ${kc.color}`}},
        h("span",{style:{fontSize:"11.5px",color:C.sub}},(row.date||"").slice(5)),badge,
        h("span",{class:"num",style:{fontSize:"13px",fontWeight:"700",color:amtColor}},W(row.amount)),
        h("span",{style:{fontSize:"12.5px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},(row.merchant||"(미상)")),
        catSel,accSel,db
      ));
    });
    tableEl.append(countEl,grid);
  };
  saveBtn.onclick=async()=>{
    saveBtn.disabled=true;saveBtn.textContent="저장 중…";
    const rows=importData.filter(t=>Number(t.amount)>0&&t.date).map(t=>({user_id:S.session.user.id,household_id:(t.account||"개인")==="공용"?(S.householdId||null):null,date:t.date,account:t.account||"개인",type:t.type||"소비(일시불)",amount:Number(t.amount),category:t.category||"기타",merchant:t.merchant||null,memo:t.memo||null,payment_method:t.payment_method||null}));
    // 중복 방지: 이미 등록된 (날짜·금액·가맹점) 거래는 자동 스킵
      let dupSkipped=0;
      try{
        const ds=rows.map(r=>r.date).sort();
        const{data:exist}=await sb.from("transactions").select("date,amount,merchant").gte("date",ds[0]).lte("date",ds[ds.length-1]);
        const seen=new Set((exist||[]).map(t=>`${t.date}|${Number(t.amount)}|${(t.merchant||"").trim()}`));
        const keep=rows.filter(r=>!seen.has(`${r.date}|${Number(r.amount)}|${(r.merchant||"").trim()}`));
        dupSkipped=rows.length-keep.length;
        rows.length=0;rows.push(...keep);
      }catch(e){dlog("[중복검사 실패]",e);}
      if(!rows.length){alert(`전부 이미 등록된 거래예요. (중복 ${dupSkipped}건 건너뜀)\n같은 파일을 두 번 올려도 안전해요!`);saveBtn.disabled=false;saveBtn.textContent="저장";return;}
      if(dupSkipped>0)setTimeout(()=>toast(`♻️ 이미 있는 ${dupSkipped}건은 자동으로 건너뛰었어요`),800);
      const{error}=await sb.from("transactions").insert(rows);
    if(error){alert("저장 실패: "+error.message);saveBtn.disabled=false;saveBtn.textContent=`${importData.length}건 전체 저장하기`;return;}
    ov.remove();S.tab="home";await loadMonth();renderDash();
  };
  // ── 공통: 배치 내 중복 제거 후 테이블에 누적 (DB 중복은 저장 시 한 번 더 걸러짐) ──
  const rowKey=r=>`${r.date}|${Number(r.amount)}|${(r.merchant||"").trim()}`;
  const addRows=(rows)=>{
    const seen=new Set(importData.map(rowKey));
    const fresh=rows.filter(r=>{const k=rowKey(r);if(seen.has(k))return false;seen.add(k);return true;});
    const skipped=rows.length-fresh.length;
    importData=[...importData,...fresh];
    drawTable();
    if(skipped>0)toast(`♻️ 겹치는 ${skipped}건은 한 번만 담았어요`);
    return fresh.length;
  };
  // ── 가져올 계정 선택: 개인(자동분류) / 모임통장(공용) ──
  let impTarget="personal";
  const tgtBtns={};
  const tgtRow=h("div",{style:{display:"flex",gap:"8px",marginBottom:"10px"}});
  [["personal","👤 개인 카드·계좌"],["shared","🤝 모임통장(공용)"]].forEach(([k,lb])=>{
    const b=h("button",{style:{flex:"1",fontSize:"12.5px",fontWeight:"700",padding:"10px",borderRadius:"11px",cursor:"pointer"},onclick:()=>{impTarget=k;drawTgt();}},lb);
    tgtBtns[k]=b;tgtRow.append(b);
  });
  const drawTgt=()=>{Object.entries(tgtBtns).forEach(([k,b])=>{const on=impTarget===k;b.style.border=`1px solid ${on?C.brand:C.line}`;b.style.background=on?C.soft:C.w;b.style.color=on?C.brand:C.sub;});};
  drawTgt();
  // ── 📄 기존 방식: Claude가 만든 JSON ──
  const fileInp=h("input",{type:"file",accept:".json",style:{display:"none"}});
  fileInp.onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    try{const data=JSON.parse(await f.text());const txns=Array.isArray(data)?data:(data.transactions||[]);addRows(txns.map(t=>({...t,category:t.category||"기타",account:t.account||"개인",type:t.type||"소비(일시불)"})));}catch{alert("파일 형식 오류.");}
  };
  // ── 📸 카드앱 이용내역 스크린샷 → AI 일괄 추출 ──
  const bigBtnSt={display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"3px",padding:"15px 8px",borderRadius:"14px",border:`1.5px solid ${C.brand}`,background:C.soft,color:C.brand,fontSize:"13px",fontWeight:"800",cursor:"pointer"};
  const shotInp=h("input",{type:"file",accept:"image/*",multiple:"multiple",style:{display:"none"}});
  const shotLbl=h("div",{},"📸 스크린샷 AI 추출");
  const shotSub=h("div",{style:{fontSize:"10.5px",fontWeight:"600",color:C.sub}},getApiKey()?"카드앱 캡처 · 여러 장 OK":"⚙️ 설정→고급에서 API 키 필요");
  const shotBtn=h("button",{style:bigBtnSt},shotLbl,shotSub);
  shotBtn.onclick=()=>{if(!getApiKey()){alert("⚙️ 설정 → 고급에서 API 키를 먼저 등록해주세요.\n(카드 명세서 AI 분석과 같은 키예요)");return;}shotInp.click();};
  shotInp.onchange=async e=>{
    const files=[...e.target.files];e.target.value="";if(!files.length)return;
    shotBtn.disabled=true;
    const thisYear=td().slice(0,4);
    const SHOT_PROMPT=`이 이미지는 카드/페이/은행 앱의 이용내역 스크린샷입니다. 보이는 모든 개별 거래를 추출해 JSON만 반환하세요:
{"items":[{"date":"YYYY-MM-DD","merchant":"가맹점명","amount":12345,"cancelled":false,"card":"카드이름(화면에 보일 때만)"}]}
규칙: 금액은 원화 숫자만(콤마·원 제거). 취소/승인취소 거래는 cancelled:true. 합계·총액·청구예정 줄은 제외. 연도가 안 보이면 ${thisYear}년으로 가정.`;
    const all=[];let fails=0,cancelled=0;
    for(let i=0;i<files.length;i++){
      shotLbl.textContent=`🔍 ${i+1}/${files.length}장 분석 중…`;
      try{
        const r=await claudeVision(files[i],SHOT_PROMPT);
        (Array.isArray(r?.items)?r.items:[]).forEach(it=>{
          if(it&&it.cancelled){cancelled++;return;}
          const amt=Math.round(Number(String(it?.amount??"").replace(/[^\d.-]/g,""))||0);
          const dt=impNormDate(it?.date);
          const mer=(it?.merchant||"").trim();
          if(amt<=0||!dt)return;
          const g=autoClassify(mer);
          all.push({date:dt,amount:amt,merchant:mer||null,account:impTarget==="shared"?"공용":(g?.account||"개인"),type:"소비(일시불)",category:g?.category||"기타",payment_method:(it?.card||"").trim()||null,needs_review:!g});
        });
      }catch(err){fails++;dlog("[스샷추출 실패]",err);}
    }
    shotBtn.disabled=false;shotLbl.textContent="📸 스크린샷 AI 추출";
    if(!all.length){alert(fails?"AI 추출에 실패했어요. 사진이 선명한지, API 키가 유효한지 확인해주세요.":"이미지에서 거래를 찾지 못했어요.");return;}
    const added=addRows(all);
    const extra=[cancelled?`취소 ${cancelled}건 제외`:"",fails?`${fails}장 실패`:""].filter(Boolean).join(" · ");
    toast(`📸 ${added}건 불러왔어요${extra?` (${extra})`:""}`);
  };
  // ── 📊 뱅크샐러드 엑셀 가져오기 (전 카드 자동수집분) ──
  const xlsInp=h("input",{type:"file",accept:".xlsx,.xls",style:{display:"none"}});
  const xlsLbl=h("div",{},"📊 엑셀 가져오기");
  const xlsBtn=h("button",{style:bigBtnSt},xlsLbl,h("div",{style:{fontSize:"10.5px",fontWeight:"600",color:C.sub}},"뱅크샐러드 · 토스뱅크 내역서 OK"));
  xlsBtn.onclick=()=>xlsInp.click();
  xlsInp.onchange=async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    xlsBtn.disabled=true;xlsLbl.textContent="⏳ 읽는 중…";
    try{
      if(!window.XLSX)await loadExtScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb=window.XLSX.read(await f.arrayBuffer(),{type:"array"});
      // "날짜+금액" 헤더가 있는 시트를 찾기 ('가계부' 이름 시트 우선)
      let rows=null,head=null;
      const names=[...wb.SheetNames].sort((a,b)=>(b.includes("가계부")?1:0)-(a.includes("가계부")?1:0));
      for(const nm of names){
        const arr=window.XLSX.utils.sheet_to_json(wb.Sheets[nm],{header:1,raw:true,defval:""});
        for(let r=0;r<Math.min(arr.length,12);r++){
          const hs=(arr[r]||[]).map(c=>String(c));
          if(hs.some(c=>/날짜|일자/.test(c))&&hs.some(c=>/금액/.test(c))){head=hs;rows=arr.slice(r+1);break;}
        }
        if(rows)break;
      }
      if(!rows)throw new Error("가계부 형식(날짜·금액 컬럼)을 찾지 못했어요");
      const col=re=>head.findIndex(c=>re.test(c));
      // amount: 출금액/입금액이 아닌 '금액' 컬럼 우선 (뱅샐·카드사). 없으면 은행 내역서식(출금/입금 분리)으로
      const ci={date:col(/날짜|일자|일시/),type:col(/타입|구분|유형/),cat1:col(/대분류|카테고리/),cat2:col(/소분류/),desc:col(/내용|사용처|가맹점|거래처|적요/),amount:head.findIndex(c=>/금액/.test(c)&&!/출금|입금/.test(c)),wd:col(/출금/),dp:col(/입금/),curr:col(/화폐|통화/),pay:col(/결제.?수단|카드\/계좌|수단/),memo:col(/메모/)};
      const out=[];let skipCur=0;
      rows.forEach(r=>{
        const get=k=>ci[k]>=0?r[ci[k]]:"";
        const dt=impNormDate(get("date"));
        const num=v=>Math.round(Number(String(v).replace(/[^\d.-]/g,""))||0);
        let raw=ci.amount>=0?num(get("amount")):0,dirHint=null;
        if(ci.amount<0){ // 은행 내역서식: 출금액/입금액 분리 컬럼 (토스뱅크·카카오뱅크 등)
          const w=Math.abs(ci.wd>=0?num(get("wd")):0),d2=Math.abs(ci.dp>=0?num(get("dp")):0);
          if(w>0){raw=w;dirHint="지출";}else if(d2>0){raw=d2;dirHint="수입";}
        }else if(raw<0)dirHint="지출"; // 부호 금액(음수=출금)
        const amt=Math.abs(raw);
        if(!dt||amt<=0)return;
        const curr=String(get("curr")).trim();
        if(curr&&!/KRW|원/i.test(curr)){skipCur++;return;}
        const rawT=String(get("type")).trim();
        const desc=String(get("desc")).trim();
        const payRaw=String(get("pay")).trim();
        let type="소비(일시불)";
        if(/수입|입금/.test(rawT)||dirHint==="수입")type="수입";
        else if(/이체|송금/.test(rawT))type="이체";
        if(/카드\s?대금|카드값|카드결제대금/.test(desc))type="카드대금"; // 회계규칙: 카드대금=이체 취급 (이중계상 방지)
        const g=type==="소비(일시불)"?autoClassify(desc):null;
        let cat=g?.category||bsMapCategory(String(get("cat1")).trim(),String(get("cat2")).trim(),type);
        if(impTarget==="shared"&&type==="수입"){type="공용입금";cat="금융/이체";} // 모임통장 입금(정근·다혜) → 공용입금
        const payAcc=(S.accounts||[]).find(a=>payRaw&&(payRaw.includes(a.name)||a.name.includes(payRaw)));
        out.push({date:dt,amount:amt,merchant:desc||null,account:impTarget==="shared"?"공용":(g?.account||"개인"),type,category:cat,payment_method:payAcc?payAcc.name:(payRaw||null),memo:String(get("memo")).trim()||null,needs_review:!g&&cat==="기타"});
      });
      if(!out.length)throw new Error("읽을 수 있는 거래가 없어요");
      const added=addRows(out);
      toast(`📊 엑셀에서 ${added}건 불러왔어요${skipCur?` (외화 ${skipCur}건 제외)`:""}`);
    }catch(err){alert("엑셀 읽기 실패: "+(err.message||err));}
    xlsBtn.disabled=false;xlsLbl.textContent="📊 뱅크샐러드 엑셀";
  };
  const srcGrid=h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}},shotBtn,xlsBtn);
  const jsonBtn=h("button",{style:{width:"100%",fontSize:"12.5px",color:C.sub,background:"transparent",border:`1px dashed ${C.line}`,borderRadius:"11px",padding:"10px",cursor:"pointer",marginBottom:"6px"},onclick:()=>fileInp.click()},"📄 Claude가 분류한 JSON 파일로 가져오기 (기존 방식)");
  sh.append(
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},h("span",{style:{fontSize:"17px",fontWeight:"800"}},"📥 카드내역 가져오기"),h("button",{style:{fontSize:"20px",color:C.sub},onclick:()=>ov.remove()},"✕")),
    h("div",{style:{background:"#EEF5F1",borderRadius:"12px",padding:"12px 14px",marginBottom:"14px",fontSize:"12.5px",lineHeight:"1.8",color:"#1A5E44"}},
      h("strong",{},"3가지 방법"),h("br"),
      "📸 카드앱 이용내역 스크린샷 → AI가 자동 추출·분류",h("br"),
      "📊 뱅크샐러드 내보내기·토스뱅크 거래내역서(.xlsx) 한번에",h("br"),
      "📄 기존처럼 Claude 대화로 만든 JSON도 그대로 돼요",h("br"),
      h("span",{style:{color:C.faint,fontSize:"11px"}},"이미 등록된 거래(같은 날짜·금액·가맹점)는 저장 시 자동으로 건너뛰어요.")),
    tgtRow,srcGrid,jsonBtn,fileInp,shotInp,xlsInp,tableEl,saveBtn
  );
  ov.append(sh);document.body.append(ov);
}


// ════════════════════ 🤝 공용 탭 ════════════════════
function sharedKindOf(t){
  const ty=t.type;
  if(ty==="공용입금"||ty==="수입")return "deposit"; // 공용 통장에 들어온 돈 = 입금 (수입으로 기록돼도 지출 아님)
  if(["소비(일시불)","소비(할부)"].includes(ty))return "spend";
  if(["정산환급","환불/취소"].includes(ty))return "reduce";
  if(["이체","카드대금","저축/적금","투자"].includes(ty))return "flow"; // 카드값·저축은 공용 지출로 세지 않음 (이중계상 방지)
  return "spend";
}
// 고정비 납부 자동 감지: 같은 카테고리+비슷한 금액의 공용 소비가 이번달에 있으면 납부됨
function sfcPaidAuto(sfc){
  return S.sharedTxns.some(t=>{
    if(sharedKindOf(t)!=="spend")return false;
    const a=Number(t.amount),fa=Number(sfc.amount);
    return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
  });
}
// 고양이 한 마디 (랜덤이 아니라 인덱스 순환 → 안정적)

    try{await loadSharedView(S.shView.ym);}catch(e){dlog("[공용분석 로드실패]",e);}
    draw();
  };
  setModeBtns();
  if(S.shViewKey===S.shView.ym&&S.shViewYearKey===S.shView.ym.slice(0,4))draw();else refresh();
  return [calCard,catCard];
}

function buildShared(){
  const st=getSharedTab();
  const spend=S.sharedTxns.filter(t=>sharedKindOf(t)==="spend").reduce((s,t)=>s+Number(t.amount),0);
  const reduce=S.sharedTxns.filter(t=>sharedKindOf(t)==="reduce").reduce((s,t)=>s+Number(t.amount),0);
  const netSpend=Math.max(0,spend-reduce);
  const deposits=S.sharedTxns.filter(t=>sharedKindOf(t)==="deposit");
  const depByPerson={"정근":0,"여친":0};
  deposits.forEach(t=>{const who=/여친|다혜/.test(t.merchant||"")?"여친":"정근";depByPerson[who]+=Number(t.amount);});
  const totalDep=depByPerson["정근"]+depByPerson["여친"];

  const out=[];

  // 🤝 공유 상태 배너
  const shareTxt=h("div",{style:{fontSize:"12.5px",fontWeight:"700",color:C.brand}},"공유 상태 확인 중…");
  out.push(h("div",{style:{background:"#EEF6F1",border:`1px solid ${C.brand}`,borderRadius:"14px",padding:"12px 15px",marginBottom:"12px",display:"flex",alignItems:"center",gap:"11px"}},
    h("span",{style:{fontSize:"19px",flexShrink:"0"}},"🤝"),
    h("div",{style:{flex:"1",minWidth:"0"}},shareTxt,h("div",{style:{fontSize:"10.5px",color:C.sub,marginTop:"2px"}},"공용 거래·고정비는 둘이 함께 봐요"))));
  (async()=>{
    try{
      if(!S.householdId&&S.session){const{data:hm}=await sb.from("household_members").select("household_id").eq("user_id",S.session.user.id).maybeSingle();S.householdId=hm?.household_id||null;}
      if(!S.householdId){shareTxt.textContent="아직 공유 가구가 없어요";shareTxt.style.color=C.sub;return;}
      const{data:mem}=await sb.from("household_members").select("user_id").eq("household_id",S.householdId);
      const n=(mem||[]).length;
      if(n>=2)shareTxt.textContent=`다혜님과 공유 중 · ${n}명`;
      else{shareTxt.textContent="혼자 쓰는 중";shareTxt.style.color=C.sub;}
    }catch(e){shareTxt.textContent="";}
  })();

  // ① 상단 요약 + 고양이 인사
  const hero=h("div",{style:{background:C.w,border:`1px solid ${C.line}`,borderRadius:"18px",padding:"20px"}},
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"4px"}},
      h("div",{},h("div",{style:{fontSize:"12.5px",color:C.sub,marginBottom:"6px"}},"이번 달 공용 지출"),h("div",{class:"num",style:{fontSize:"34px",fontWeight:"800",letterSpacing:"-.03em",lineHeight:"1"}},W(netSpend))),
      h("div",{style:{fontSize:"30px",display:"flex",gap:"-6px"}},
        h("span",{style:{}},"🐈‍⬛"),h("span",{style:{marginLeft:"-8px"}},"🐈")
      )
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginTop:"16px"}},
      h("div",{style:{background:C.soft,borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:C.brand,fontWeight:"700",marginBottom:"4px"}},"💰 통장에 모인 돈"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:C.brand}},W(totalDep)),
        h("div",{style:{fontSize:"11px",color:C.brand,marginTop:"2px"}},`정근 ${shortNum(depByPerson["정근"])} · 여친 ${shortNum(depByPerson["여친"])}`)
      ),
      h("div",{style:{background:netSpend>totalDep?"#FEF2EE":"#F6F4EF",borderRadius:"12px",padding:"12px 14px"}},
        h("div",{style:{fontSize:"11px",color:netSpend>totalDep?C.over:C.sub,fontWeight:"700",marginBottom:"4px"}},netSpend>totalDep?"⚠️ 통장 부족":"통장 잔액"),
        h("div",{class:"num",style:{fontSize:"17px",fontWeight:"800",color:netSpend>totalDep?C.over:C.ink}},W(Math.abs(totalDep-netSpend))),
        h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"2px"}},netSpend>totalDep?"입금이 더 필요해요":"여유분")
      )
    )
  );
  // 공용 월 예산 게이지 (설정→공용 예산)
  {const cfgS=getSharedCfg();const bud=Number(cfgS.sharedBudget)||0;
   if(bud>0){
     const pctRaw=Math.round(netSpend/bud*100);
     const col=pctRaw>=100?C.over:pctRaw>=80?C.warn:C.brand;
     const dLeft=(()=>{const now=td();if(ym(now)!==S.curYm)return 0;const last=new Date(Number(S.curYm.slice(0,4)),Number(S.curYm.slice(5,7)),0).getDate();return Math.max(0,last-Number(now.slice(8,10)));})();
     const remain=bud-netSpend;
     hero.append(h("div",{style:{marginTop:"14px"}},
       h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:"11px",marginBottom:"5px"}},
         h("span",{style:{fontWeight:"700",color:C.sub}},"이번 달 공용 예산"),
         h("span",{class:"num",style:{fontWeight:"800",color:col}},`${pctRaw}% · ${W(netSpend)} / ${W(bud)}`)),
       h("div",{style:{height:"8px",background:"#EFEDE7",borderRadius:"999px",overflow:"hidden"}},
         h("div",{style:{width:Math.min(100,pctRaw)+"%",height:"100%",background:col,borderRadius:"999px",transition:"width .3s"}})),
       h("div",{style:{fontSize:"10.5px",color:remain>=0?C.faint:C.over,marginTop:"4px",textAlign:"right"}},
         remain>=0?(dLeft>0?`남은 ${W(remain)} · 하루 ${W(Math.floor(remain/Math.max(1,dLeft)))}씩 쓸 수 있어요`:`남은 ${W(remain)}`):`⚠️ 예산 초과 ${W(Math.abs(remain))}`)));
   }}
  out.push(hero);

  // ①-B 공용 달력(월/년) + 카테고리 도넛
  out.push(...buildSharedAnalysisCards());

  // ② 공용 고정비 (Supabase, 클릭수정·추가·삭제)
  const fcSec=sec("📋 공용 고정비",h("button",{style:{fontSize:"11.5px",color:C.brand,fontWeight:"700",cursor:"pointer"},onclick:()=>showSharedFcEdit(null)},"＋ 추가"));
  if(!SHARED_FC.length){
    fcSec.append(empty("등록된 공용 고정비가 없어요.\n오른쪽 위 ＋ 추가로 만들어보세요."));
  }else{
    const fcTotal=SHARED_FC.reduce((s,f)=>s+Number(f.amount),0);
    SHARED_FC.forEach(sfc=>{
      const c=CM[sfc.category]||CM["기타"];
      const pm=PAY_META[sfc.pay]||PAY_META["공용통장"];
      const autoPaid=sfcPaidAuto(sfc);
      const manualPaid=!!st.paidManual[sfc.id];
      const paid=autoPaid||manualPaid;
      fcSec.append(h("div",{class:"fcrow",style:{display:"flex",alignItems:"center",gap:"11px",padding:"12px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",borderRadius:"6px",transition:"background .12s"},
        onclick:()=>showSharedFcDetail(sfc)},
        h("div",{style:{width:"38px",height:"38px",borderRadius:"11px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",flexShrink:"0"}},c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"14px",fontWeight:"600"}},sfc.name),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"2px"}},`${pm.icon} ${pm.label}${sfc.billing_day?` · 매월 ${sfc.billing_day}일`:""}`)
        ),
        h("div",{style:{textAlign:"right",marginRight:"2px"}},
          h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700"}},W(sfc.amount)),
          h("div",{style:{fontSize:"11px",marginTop:"3px",fontWeight:"700",color:paid?C.brand:C.over}},paid?"✅ 납부됨":"⏳ 미납")
        ),
        h("span",{style:{fontSize:"12px",color:C.faint,marginLeft:"2px"}},"›")
      ));
    });
    fcSec.append(h("div",{style:{display:"flex",justifyContent:"space-between",padding:"11px 4px 2px",fontSize:"13px",fontWeight:"800"}},
      h("span",{style:{color:C.sub}},"고정비 합계"),h("span",{class:"num"},W(fcTotal))));
  }
  out.push(fcSec);

  // ③ 정산 도우미
  out.push(buildSettlement());

  // ③-A ⚖️ 올해 분담 리포트 (누가 얼마 냈나 vs 부담 비율)
  out.push(buildYearSettleReport());

  // ③-B 이체로 기록된 멤버 입금 → 공용입금 전환 제안 (게이지에 잡히게)
  {const cand=S.sharedTxns.filter(t=>t.type==="이체"&&/정근|다혜|여친|입금/.test(t.merchant||""));
   if(cand.length){
     const bn=h("div",{style:{background:"#F0F4FF",border:"1px solid #C9D6F2",borderRadius:"14px",padding:"12px 14px",marginTop:"12px"}});
     bn.append(h("div",{style:{fontSize:"12px",fontWeight:"800",color:"#3B5BA5",marginBottom:"4px"}},"💡 생활비 입금 아닌가요?"),
       h("div",{style:{fontSize:"11px",color:"#3B5BA5",marginBottom:"8px",lineHeight:"1.5"}},"'이체'로 기록돼 입금 게이지에 안 잡혀요. 생활비 입금이 맞으면 탭해서 바꿔주세요."));
     cand.slice(0,4).forEach(t=>{
       bn.append(h("button",{style:{width:"100%",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",gap:"8px",fontSize:"12px",fontWeight:"700",padding:"9px 11px",borderRadius:"9px",border:"1px solid #C9D6F2",background:"#fff",color:C.ink,cursor:"pointer",marginBottom:"6px"},onclick:async(ev)=>{
         ev.currentTarget.disabled=true;
         const{error}=await sb.from("transactions").update({type:"공용입금"}).eq("id",t.id);
         if(error){toast("실패: "+error.message,false);ev.currentTarget.disabled=false;return;}
         toast(`💰 ${t.merchant} ${W(t.amount)} → 공용입금`);
         await loadShared();const ct=document.getElementById("ct");if(ct&&S.tab==="shared"){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}
       }},h("span",{style:{minWidth:"0",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`${(t.date||"").slice(5)} · ${t.merchant}`),h("span",{class:"num",style:{flexShrink:"0",color:"#3B5BA5"}},`${W(t.amount)} → 공용입금`)));
     });
     out.push(bn);
   }}

  // ④ 생활비 입금
  out.push(buildDepositSection(depByPerson,st));

  // ⑤ 이번 달 공용 내역
  const txSec=sec("이번 달 공용 내역",`${S.sharedTxns.length}건`);
  if(!S.sharedTxns.length)txSec.append(empty("아직 공용 거래가 없어요.\n아래 ＋ 버튼으로 추가해보세요."));
  else{
    txSec.append(h("div",{style:{fontSize:"11.5px",color:C.faint,padding:"0 2px 6px",textAlign:"right"}},"탭하면 수정"));
    const reloadShared=async()=>{await loadShared();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}};
    S.sharedTxns.slice(0,20).forEach(t=>{
      const c=CM[t.category]||CM["기타"];
      const sk=sharedKindOf(t);
      const isDep=sk==="deposit";
      const sg=isDep||sk==="reduce"?"+":sk==="spend"?"−":"";
      const cl=isDep?C.brand:sk==="reduce"?C.warn:C.ink;
      const pmTxt=t.payment_method&&PAY_META[t.payment_method]?` · ${PAY_META[t.payment_method].icon}${PAY_META[t.payment_method].label}`:"";
      txSec.append(h("div",{style:{display:"flex",alignItems:"center",gap:"12px",padding:"11px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer",transition:"background .12s",borderRadius:"4px"},
        onmouseenter:e=>{e.currentTarget.style.background="#F6F4EF";},
        onmouseleave:e=>{e.currentTarget.style.background="transparent";},
        onclick:()=>showEditTxn(t,reloadShared)},
        h("div",{style:{width:"34px",height:"34px",borderRadius:"10px",background:c.c+"1A",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"16px",flexShrink:"0"}},isDep?"💰":c.i),
        h("div",{style:{flex:"1",minWidth:"0"}},
          h("div",{style:{fontSize:"14px",fontWeight:"600",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},(t.merchant||t.category||t.type)),
          h("div",{style:{fontSize:"11.5px",color:C.sub,marginTop:"1px"}},`${(t.date||"").slice(5)} · ${t.type}${pmTxt}${t.memo?` · ${t.memo}`:""}`)
        ),
        h("div",{style:{display:"flex",alignItems:"center",gap:"6px"}},
          h("div",{class:"num",style:{fontSize:"14.5px",fontWeight:"700",color:cl,whiteSpace:"nowrap"}},sg+W(t.amount).slice(1)),
          h("span",{style:{fontSize:"12px",color:C.faint}},"›")
        )
      ));
    });
  }
  out.push(txSec);
  return reorderCards("shared",out);
}

// ── 정산 도우미 (개인이 낸 것만) ──
function buildSettlement(){
  const st=getSharedTab();
  const items=[];
  // (A) 고정비 중 개인 결제(settle:true)이고 납부 감지된 것
  SHARED_FC.forEach(sfc=>{
    const pm=PAY_META[sfc.pay];
    if(!pm||!pm.settle)return;
    const matched=S.sharedTxns.find(t=>{
      if(sharedKindOf(t)!=="spend")return false;
      const a=Number(t.amount),fa=Number(sfc.amount);
      return t.category===sfc.category&&fa>0&&Math.abs(a-fa)/fa<0.45;
    });
    if(!matched)return;
    items.push({key:"fc_"+sfc.id+"_"+S.curYm,who:pm.who,name:sfc.name,amount:Number(matched.amount)});
  });
  // (B) 공용 변동 지출 중 결제수단이 개인(settle:true)인 거래
  S.sharedTxns.forEach(t=>{
    if(sharedKindOf(t)!=="spend")return;
    const pm=PAY_META[t.payment_method];
    if(!pm||!pm.settle)return;
    items.push({key:"tx_"+t.id,who:pm.who,name:t.merchant||t.category||"공용 지출",amount:Number(t.amount)});
  });

  const el=sec("🐈 정산 도우미","");
  const pending=items.filter(it=>!st.settled[it.key]);
  const done=items.filter(it=>st.settled[it.key]);

  if(!items.length){
    el.append(catSay(0,"아직 정산할 게 없다냥~ 공용통장이나 카드로 잘 쓰고 있다냥! 🐾"));
    return el;
  }

  pending.forEach((it,idx)=>{
    const half=Math.round(it.amount/2);
    const who=it.who||"정근";
    const card=h("div",{style:{background:"#FFFBEE",border:`1px solid ${C.warn}55`,borderRadius:"14px",padding:"14px",marginBottom:"10px"}});
    const opt=(icon,label,sub,val)=>h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"11px 13px",borderRadius:"11px",background:C.w,border:`1px solid ${C.line}`,marginBottom:"7px"}},
      h("span",{style:{fontSize:"17px"}},icon),
      h("div",{style:{flex:"1"}},h("div",{style:{fontSize:"13px",fontWeight:"700"}},label),h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"1px"}},sub)),
      h("div",{class:"num",style:{fontSize:"15px",fontWeight:"800",color:C.brand}},val));
    card.append(
      h("div",{style:{marginBottom:"12px"}},catSay(idx,`${who}이가 ${it.name} ${W(it.amount)} 대신 냈다냥! 둘 중 하나로 정산하라냥~`)),
      opt("🏦","공용통장에 입금","상대도 똑같이 채우기",W(it.amount)),
      opt("💸",`${who}에게 직접 송금`,"절반만 정산",W(half)),
      h("button",{style:{width:"100%",marginTop:"4px",fontSize:"13px",fontWeight:"700",padding:"11px",borderRadius:"11px",border:`1px solid ${C.brand}`,background:C.soft,color:C.brand,cursor:"pointer"},
        onclick:()=>{const s2=getSharedTab();s2.settled[it.key]=true;saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"✅ 정산 완료로 표시")
    );
    el.append(card);
  });
  if(done.length){
    done.forEach(it=>{
      el.append(h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 10px",borderRadius:"10px",background:C.soft,marginBottom:"6px"}},
        h("div",{style:{fontSize:"12.5px",color:C.brand,fontWeight:"600"}},`✅ ${it.name} 정산 완료`),
        h("button",{style:{fontSize:"11px",color:C.faint,cursor:"pointer"},onclick:()=>{const s2=getSharedTab();delete s2.settled[it.key];saveSharedTab(s2);const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}}},"되돌리기")
      ));
    });
  }
  return el;
}

// ── 생활비 입금 섹션 ──
function buildDepositSection(depByPerson,st){
  const el=sec("💰 생활비 입금",h("button",{style:{fontSize:"11.5px",color:C.brand,fontWeight:"700",cursor:"pointer"},onclick:()=>showDepositGoal()},"목표 설정 ✎"));
  const goal=st.depositGoal||{"정근":0,"여친":0};
  ["정근","여친"].forEach(who=>{
    const g=Number(goal[who])||0,cur=depByPerson[who]||0;
    const pct=g>0?Math.min(100,Math.round(cur/g*100)):0,done=g>0&&cur>=g;
    el.append(h("div",{style:{marginBottom:"14px"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:"6px"}},
        h("span",{style:{fontSize:"13px",fontWeight:"700"}},(who==="정근"?"🧑 ":"👩 ")+who),
        h("span",{class:"num",style:{fontSize:"12.5px",color:C.sub}},g>0?`${W(cur)} / ${W(g)}`:W(cur))
      ),
      g>0?h("div",{style:{height:"9px",borderRadius:"999px",background:"#F0ECE3",overflow:"hidden"}},h("div",{style:{width:pct+"%",height:"100%",background:done?C.brand:C.warn,borderRadius:"999px",transition:"width .4s"}})):"",
      g>0?h("div",{style:{fontSize:"11px",color:done?C.brand:C.faint,marginTop:"4px",fontWeight:done?"700":"400"}},done?"✅ 목표 달성!":`${pct}% · ${W(g-cur)} 남음`):h("div",{style:{fontSize:"11px",color:C.faint,marginTop:"2px"}},"목표 미설정 — 입금액만 기록 중")
    ));
  });
  // 개별 입금 내역 (탭하면 날짜·금액 보고 수정/삭제)
  const deps=S.sharedTxns.filter(t=>sharedKindOf(t)==="deposit");
  if(deps.length){
    const reloadShared2=async()=>{await loadShared();const ct=document.getElementById("ct");if(ct){ct.innerHTML="";buildShared().forEach(n=>ct.append(n));}};
    el.append(h("div",{style:{fontSize:"11.5px",fontWeight:"700",color:C.sub,margin:"4px 0 6px"}},"입금 내역 (탭하면 수정)"));
    deps.forEach(t=>{
      const who=/여친|다혜/.test(t.merchant||"")?"여친":"정근";
      el.append(h("div",{style:{display:"flex",alignItems:"center",gap:"10px",padding:"9px 4px",borderBottom:`1px solid ${C.line}`,cursor:"pointer"},onclick:()=>showEditTxn(t,reloadShared2)},
        h("div",{style:{fontSize:"15px"}},"💰"),
        h("div",{style:{flex:"1",minWidth:"0"}},h("div",{style:{fontSize:"13px",fontWeight:"600"}},(who==="정근"?"🧑 ":"👩 ")+who+" 입금"),h("div",{style:{fontSize:"11px",color:C.sub,marginTop:"1px"}},(t.date||"").slice(5)+(t.memo?` · ${t.memo}`:""))),
        h("div",{class:"num",style:{fontSize:"14px",fontWeight:"700",color:C.brand}},"+"+W(t.amount).slice(1)),
        h("span",{style:{fontSize:"12px",color:C.faint}},"›")
      ));
    });
  }
  el.append(h("button",{style:{width:"100%",marginTop:"10px",fontSize:"13.5px",fontWeight:"700",color:C.brand,background:C.soft,border:`1px solid ${C.brand}`,borderRadius:"11px",padding:"11px",cursor:"pointer"},onclick:()=>showAddDeposit()},"＋ 입금 기록 추가"));
  return el;
}

// ── 공용 입금/지출 추가 시트 (결제수단 포함) ──
function showAddDeposit(){
  const ov=h("div",{style:{position:"fixed",inset:"0",background:"rgba(40,37,31,.42)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"50"}});

  const drawPay=()=>{payWrap.innerHTML="";PAY_LIST.forEach(p=>{const pm=PAY_META[p],on=selPay===p;payWrap.append(h("button",{style:{fontSize:"12.5px",padding:"7px 11px",borderRadius:"999px",border:`1px solid ${on?C.brand:C.line}`,background:on?C.soft:C.w,color:on?C.brand:C.ink,fontWeight:on?"700":"500",cursor:"pointer"},onclick:()=>{selPay=p;drawPay();updateHint();}},pm.icon+" "+pm.label));});};
  const updateHint=()=>{
    const pm=PAY_META[selPay];
    if(mode==="지출"&&pm){
      settleHint.style.display="";
      if(pm.settle){settleHint.style.color=C.warn;settleHint.textContent=`🐈 ${pm.who} 개인 결제 → 나중에 정산 도우미에 떠요`;}

// ════════════════════ 💰 자산 탭 ════════════════════
const ACC_KINDS=["통장","카드","현금","기타"];
const ACC_ICON={"통장":"🏦","카드":"💳","현금":"💵","기타":"📁"};
const SAV_KINDS=["적금","예금","비상금","청약","기타"];
const LOAN_KINDS=["신용대출","주택담보","전세자금","자동차","학자금","기타"];
const LOAN_ICON={"신용대출":"💳","주택담보":"🏠","전세자금":"🔑","자동차":"🚗","학자금":"🎓","기타":"🏦"};
const loanMeta=l=>{let m=l&&l.meta;if(typeof m==="string"){try{m=JSON.parse(m);}catch{m=null;}}return m&&typeof m==="object"?m:{};};
const loanBal=l=>{const m=loanMeta(l);return m.balance!=null?Number(m.balance)||0:Number(l.principal)||0;};
const loanKind=l=>loanMeta(l).kind||"신용대출";
const getOD=(id)=>{try{return JSON.parse(localStorage.getItem("odraft:"+id)||"null");}catch{return null;}};
const setOD=(id,o)=>{try{if(o&&o.on)localStorage.setItem("odraft:"+id,JSON.stringify(o));else localStorage.removeItem("odraft:"+id);}catch{}};
const accUsed=(a)=>{const b=Number(a.balance)||0;return b<0?-b:0;};

function repayCalc(getBal,getRate,watch){

  txns.forEach(t=>{
